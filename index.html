campaignForm=function(id,prefill={}){if(session?.role!=='admin')return denyAccess();const c=id?db.campaigns.find(c=>c.id===id):{name:'',channel:'Email',platform:'Web & mobile',audience:'Engaged fans',subject:'Made for your people.',message:'Discover the latest collections from your favorite creators.',cta:'Explore collection',destinationType:'Internal app page',destination:'/drops',template:'Editorial',contentMode:'Visual builder',image:ASSETS.tee,status:'Draft',...prefill};if(!c)return;const external=c.destinationType==='External website';openDialog(id?'Edit & schedule broadcast':'Create & schedule broadcast','Choose the audience, compose your content, and review the destination before scheduling.',`<form id="campaignForm" data-id="${c.id||''}" class="composer-v6"><div class="composer-layout"><div class="composer-fields">${composerSection('01','Audience & channel','Start with who should receive this broadcast.',`<div class="form-grid">${field('name','Campaign name',c.name,'text',null,true)}${field('channel','Channel',c.channel,'text',CHANNELS,true)}${field('platform','Platforms',c.platform==='Email'?'Web & mobile':c.platform,'text',['Web & mobile','Web','Mobile'],true)}${field('audience','Audience',c.audience,'text',['Engaged fans','New users','Creators','All users'],true)}</div>`)}${composerSection('02','Content & creative','Build a layout, paste HTML, or import an email file.',`<div class="form-grid">${field('subject','Title / email subject',c.subject,'text',null,true)}${field('contentMode','Email editor',c.contentMode||'Visual builder','text',['Visual builder','Custom HTML'])}</div><div id="visualEditorFields"><div class="form-grid">${field('template','Email layout',c.template,'text',['Editorial','Product grid','Announcement'])}${field('message','Body copy',c.message,'textarea',null,true)}<label class="field"><span>Creative asset</span><select name="asset">${['tee','hoodie','jersey'].map((a,i)=>`<option value="${a}" ${c.image===ASSETS[a]?'selected':''}>${['Culture tee','Everyday hoodie','Squad jersey'][i]}</option>`).join('')}<option value="custom" ${!Object.values(ASSETS).includes(c.image)?'selected':''}>Custom image URL</option></select></label>${field('imageUrl','Custom image URL',Object.values(ASSETS).includes(c.image)?'':c.image,'url')}</div></div><div id="htmlEditorFields"><div class="html-import-bar"><div><b>Bring your own email</b><p>Import .html / .htm or paste code below. Up to 1 MB.</p></div><button type="button" class="button small" data-v6="choose-html">${icon('download')} Import HTML</button><input type="file" id="campaignHTMLFile" accept=".html,.htm,text/html" hidden></div><p id="htmlImportStatus" role="status" class="subline">${esc(c.importedFilename||'')}</p>${field('html','HTML source',c.html||'','textarea')}<div class="between"><span class="subline">Scripts, forms, and unsafe links are removed from the email.</span><button type="button" data-v6="refresh-email" class="text-btn">Refresh preview</button></div><div id="importedLinks" class="imported-links"></div></div>`)}${composerSection('03','Click destination','Choose exactly where the banner or email button should lead.',`<div class="form-grid">${field('cta','Button label',c.cta,'text',null,true)}${field('destinationType','Destination type',c.destinationType,'text',['Internal app page','External website'],true)}<div class="full field" id="internalLinkControls"><span>App destination</span><select id="internalPageChoice" aria-label="Internal app destination">${INTERNAL_DESTINATIONS.map(([path,n])=>`<option value="${path}" ${!external&&c.destination===path?'selected':''}>${n}</option>`).join('')}<option value="custom" ${!external&&!INTERNAL_DESTINATIONS.some(([p])=>p===c.destination)?'selected':''}>Custom app path</option></select><input id="internalCustomPath" aria-label="Custom app path" placeholder="/creators/username or /drops/drop-id" value="${esc(!external?c.destination:'/drops')}"><small>Choose a page or enter the exact in-app path.</small></div><label class="field full" id="externalLinkControls"><span>Website URL *</span><input type="url" id="externalCampaignURL" placeholder="https://your-website.com/collection" value="${esc(external?c.destination:'')}"><small>Use any full https:// or http:// link. The entire banner and CTA use this destination.</small></label><input type="hidden" name="destination" value="${esc(c.destination)}"><div class="full link-check" id="destinationCheck"></div></div><label id="applyImportedLinkRow" class="row small-text"><input type="checkbox" name="applyDestinationToHTML" ${c.applyDestinationToHTML?'checked':''}> Apply this destination to every link in the imported HTML</label><p id="importLinkHint" class="subline">Keep this off to preserve individual links in your imported email.</p>`)}${composerSection('04','Delivery schedule','Save a draft or choose a future delivery time.',`<div class="form-grid">${field('status','Delivery',c.status==='Sent'?'Draft':c.status,'text',['Draft','Scheduled'],true)}${field('scheduled','Date & time (UTC)',c.scheduled||'','datetime-local')}</div><p id="scheduleSummary" class="schedule-summary"></p>`)}<p class="error-message" id="campaignError" role="alert"></p></div><aside class="composer-preview"><div class="between"><div><span class="eyebrow">BEFORE YOU SCHEDULE</span><h3>Live preview</h3></div><select id="campaignPreviewPlatform" aria-label="Preview platform"><option>Web</option><option>Mobile</option></select></div><div id="campaignPreview"></div><p class="subline" id="campaignDestination"></p><div class="campaign-review" id="campaignReview"></div></aside></div><div class="form-actions composer-savebar">${button('Cancel','close-dialog')}${button('Export HTML','campaign-export-html')}<button type="submit" class="button primary" id="campaignSaveButton">Save draft</button></div></form>`,true);document.getElementById('campaignForm').dataset.importedFilename=c.importedFilename||'';updateCampaignPreview()};
function syncCampaignDestination(){const f=document.getElementById('campaignForm');if(!f)return;const external=f.querySelector('[name="destinationType"]').value==='External website',choice=document.getElementById('internalPageChoice');document.getElementById('internalLinkControls').hidden=external;document.getElementById('externalLinkControls').hidden=!external;document.getElementById('internalCustomPath').hidden=choice.value!=='custom';f.querySelector('[name="destination"]').value=external?document.getElementById('externalCampaignURL').value.trim():choice.value==='custom'?document.getElementById('internalCustomPath').value.trim():choice.value;document.getElementById('externalCampaignURL').required=external;document.getElementById('externalCampaignURL').disabled=!external}
const sanitizeEmailV5=sanitizeEmail;
sanitizeEmail=function(html){const root=document.createElement('div');root.innerHTML=html;const css=[...root.querySelectorAll('style')].map(s=>s.textContent).filter(s=>!/@import|url\s*\(|expression\s*\(|behavior\s*:|<\/style/i.test(s)).join('\n');return (css?'<style>'+css+'</style>':'')+sanitizeEmailV5(root.querySelector('body')?.innerHTML||html)};
const campaignValuesV5=campaignValues;
campaignValues=function(f){const c=campaignValuesV5(f);c.applyDestinationToHTML=!!f.querySelector('[name="applyDestinationToHTML"]')?.checked;c.importedFilename=f.dataset.importedFilename||'';if(c.channel==='Email'&&c.contentMode==='Custom HTML'&&c.applyDestinationToHTML){const dest=safeDestination(c.destination,c.destinationType),href=c.destinationType==='Internal app page'?'https://merchrix.com'+dest:dest;if(dest){const root=document.createElement('div');root.innerHTML=c.html;root.querySelectorAll('a').forEach(a=>a.setAttribute('href',href));c.html=root.innerHTML}}return c};
updateCampaignPreview=function(){const f=document.getElementById('campaignForm');if(!f)return;syncCampaignDestination();const c=campaignValues(f),email=c.channel==='Email',custom=email&&c.contentMode==='Custom HTML',p=document.getElementById('campaignPreviewPlatform');if(!email&&c.platform!=='Web & mobile')p.value=c.platform;p.hidden=email;document.getElementById('visualEditorFields').hidden=custom;document.getElementById('htmlEditorFields').hidden=!custom;f.querySelector('[name="contentMode"]').closest('.field').hidden=!email;f.querySelector('[name="template"]').closest('.field').hidden=!email;f.querySelector('[name="platform"]').closest('.field').hidden=email;f.querySelector('[name="imageUrl"]').closest('.field').hidden=c.asset!=='custom';f.querySelector('[name="imageUrl"]').disabled=custom||c.asset!=='custom';f.querySelector('[name="message"]').required=!custom;f.querySelector('[name="cta"]').required=!custom;document.getElementById('applyImportedLinkRow').hidden=!custom;document.getElementById('importLinkHint').hidden=!custom;f.querySelector('[data-action="campaign-export-html"]').hidden=!email;f.querySelector('[name="scheduled"]').required=c.status==='Scheduled';f.querySelector('[name="scheduled"]').closest('.field').hidden=c.status!=='Scheduled';document.getElementById('campaignSaveButton').textContent=c.status==='Scheduled'?'Schedule broadcast':'Save draft';document.getElementById('scheduleSummary').textContent=c.status==='Scheduled'?(c.scheduled?'Scheduled for '+c.scheduled.replace('T',' at ')+' UTC.':'Choose a future date and time.'):'This broadcast will stay in drafts until you schedule it.';document.getElementById('campaignPreview').innerHTML=campaignPreview(c,p.value);const valid=safeDestination(c.destination,c.destinationType);document.getElementById('destinationCheck').innerHTML=valid?`${icon('check')}<span>${esc(c.destination)}</span>${c.destinationType==='External website'?`<a class="text-btn" href="${esc(valid)}" target="_blank" rel="noopener noreferrer">Test link ${icon('external')}</a>`:''}`:`${icon('warning')}<span>${c.destinationType==='External website'?'Enter a complete website URL, including https://.':'Enter an app path starting with /.'}</span>`;document.getElementById('campaignDestination').textContent=custom&&!c.applyDestinationToHTML?'Imported HTML keeps its original links.':'Click destination: '+(c.destination||'Not set');document.getElementById('campaignReview').innerHTML=kv('Audience',esc(c.audience))+kv('Channel',esc(c.channel))+kv('Platform',esc(c.platform))+kv('Delivery',esc(c.status));if(custom)renderImportedLinks()};
function renderImportedLinks(){const f=document.getElementById('campaignForm'),root=document.createElement('div');root.innerHTML=sanitizeEmail(f.querySelector('[name="html"]').value);const links=[...new Set([...root.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')))];document.getElementById('importedLinks').innerHTML=`<b>${links.length} link${links.length===1?'':'s'} in imported HTML</b>`+links.slice(0,12).map(h=>`<div><span>${esc(h)}</span><button type="button" class="text-btn" data-v6="use-imported-link" data-url="${esc(h)}">Use as destination</button></div>`).join('')+(links.length>12?'<p class="subline">Showing the first 12 links. All links are preserved in the source.</p>':'')}
async function importCampaignHTML(file){if(!file)return;const f=document.getElementById('campaignForm'),status=document.getElementById('htmlImportStatus');if(!/\.html?$/i.test(file.name)){status.textContent='Choose an .html or .htm file.';return}if(file.size>1024*1024){status.textContent='This file is too large. Choose an HTML file under 1 MB.';return}try{const code=await file.text();if(!f.isConnected)return;if(!code.trim())throw new Error('empty');f.querySelector('[name="html"]').value=code;f.querySelector('[name="channel"]').value='Email';f.querySelector('[name="contentMode"]').value='Custom HTML';f.dataset.importedFilename=file.name;status.textContent=file.name+' imported · '+Math.ceil(file.size/1024)+' KB';updateCampaignPreview()}catch{if(f.isConnected)status.textContent='The HTML file could not be read. Paste the code below or choose another file.'}}

/* Explicit preparation ownership, carrier evidence, and account-linked ledger records. */
const PREPARATION_MANAGED=['Order received','Printing & quality check','Packing','Ready for DHL','Handed to DHL','Cancelled'];
const PREPARATION_CREATOR=['Order received','Packing','Ready for DHL drop-off','Handed to DHL','Cancelled'];
const DELIVERY_STATES=['Not handed to DHL','Awaiting first scan','In transit','Out for delivery','Delivered','Delivery exception','Returned'];
function isManaged(o){return o.model==='Merchrix managed'}
function preparationOwner(o){return isManaged(o)?'Merchrix operations':o.creator}
function preparationStages(o){return isManaged(o)?PREPARATION_MANAGED:PREPARATION_CREATOR}
function migrateOperations(){
 for(const o of storeDB.orders){if(o.operations)continue;const managed=isManaged(o),handed=['Shipped','Delivered','Exception'].includes(o.status),prep=o.status==='Cancelled'?'Cancelled':handed?'Handed to DHL':o.status==='Ready for pickup'?(managed?'Ready for DHL':'Ready for DHL drop-off'):o.status==='Production'?(managed?'Printing & quality check':'Packing'):'Order received';const delivery=o.status==='Delivered'?'Delivered':o.status==='Shipped'?'In transit':o.status==='Exception'?'Delivery exception':'Not handed to DHL',at=o.date+'T14:20:00.000Z',source=handed?'DHL':managed?'Merchrix operations':'Creator app';
  o.operations={preparation:prep,delivery,updatedAt:at,updatedBy:source==='Creator app'?o.creator:source,source,carrier:handed?{status:delivery,time:at,detail:delivery==='Delivered'?'Delivery recorded at destination.':delivery==='Delivery exception'?(o.issue||'Shipment requires follow-up.'):'Shipment accepted and moving through the DHL network.'}:null,override:null,history:[{id:o.id+'-placed',time:o.date+'T09:00:00.000Z',title:'Order placed',source:'Merchrix',actor:o.buyer,note:'Payment '+o.payment.toLowerCase()+'.'},{id:o.id+'-prep',time:o.date+'T12:10:00.000Z',title:prep,source:managed?'Merchrix operations':'Creator app',actor:preparationOwner(o),note:managed?'Preparation managed by Merchrix.':'Creator manages stock, packing, and DHL drop-off.'},...(handed?[{id:o.id+'-carrier',time:at,title:delivery,source:'DHL',actor:'DHL',note:delivery==='Delivery exception'?(o.issue||'Shipment requires follow-up.'):'Carrier shipment update.'}]:[])]};
  if(o.issue||o.status==='Exception')o.operations.incident={status:'Open',owner:'DHL',category:'Delivery exception',summary:o.issue||'Shipment requires follow-up.',openedAt:at,notes:[]};
 }
 for(const t of storeDB.transactions){const o=storeDB.orders.find(o=>t.orderId===o.id||t.name==='Order '+o.id),p=storeDB.payouts.find(p=>t.payoutId===p.id||t.name==='Payout '+p.id);if(o){t.orderId=o.id;t.creatorId=o.creatorId;t.buyerId=o.buyerId}else if(p){t.creatorId=p.creatorId;t.payoutId=p.id}t.creator=storeDB.users.find(p=>p.id===t.creatorId)?.name||'Unassigned';t.customer=storeDB.users.find(p=>p.id===t.buyerId)?.name||'';t.creatorUsername=storeDB.users.find(p=>p.id===t.creatorId)?.handle||'';t.customerUsername=storeDB.users.find(p=>p.id===t.buyerId)?.handle||''}
 for(const p of storeDB.payouts)if(!storeDB.transactions.some(t=>t.payoutId===p.id)){const creator=storeDB.users.find(u=>u.id===p.creatorId);storeDB.transactions.push({id:'TX-'+p.id,name:'Payout '+p.id,payoutId:p.id,creatorId:p.creatorId,creator:creator?.name||p.name,creatorUsername:creator?.handle||'',customer:'',customerUsername:'',amount:p.amount,type:'Payout',status:p.status==='Paid'?'Successful':p.status==='Approved'?'Processing':p.status,date:p.date,reference:'MRC-OUT-'+p.id})}
 if(!storeDB.squadContributions){const day=new Date();day.setUTCHours(12,0,0,0);storeDB.squadContributions=(storeDB.squadMembers||[]).flatMap((m,i)=>['Merch purchases','Squad participation','Squad Clash'].map((kind,j)=>({id:'FC-'+i+'-'+j,userId:m.userId,squadId:m.squadId,kind,points:40+(i*37+j*83)%680,date:new Date(+day-(2+(i+j*3)%27)*86400000).toISOString().slice(0,10)})))}
 persist();
}
migrateOperations();

function opTime(v){if(!v)return 'No update yet';return new Date(v).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC'}
function openIncident(o){return !!o.operations?.incident&&o.operations.incident.status!=='Resolved'}
function orderViewRows(){return db.orders.map(o=>({...o,preparation:o.operations.preparation,delivery:o.operations.delivery,attention:openIncident(o)?'Needs attention':o.operations.incident?'Resolved':'No issue',source:o.operations.source,lastUpdate:o.operations.updatedAt,customerUsername:person(o.buyer)?.handle||'',creatorUsername:person(o.creator)?.handle||''}))}
function orderRouteCards(){return `<div class="grid two ownership-cards">${['Merchrix managed','Creator stocked'].map((model,i)=>{const rows=db.orders.filter(o=>o.model===model);return `<article class="ownership-card ${i?'creator-route':'merchrix-route'}"><div class="between"><span class="route-symbol">${icon(i?'bag':'pen')}</span><span class="eyebrow">${i?'CREATOR’S OWN STOCK':'PRINTED WITH MERCHRIX'}</span></div><h3>${i?'Creator prepares & drops off':'Merchrix prepares & hands over'}</h3><p>${i?'The creator owns the merch, packs the order, and takes it to DHL. They update preparation and handoff from their app.':'Merchrix prints the merch, checks quality, packs the order, and hands it to DHL. Our operations team manages preparation.'}</p><div class="ownership-flow"><span>${i?'Creator':'Merchrix'}<small>Preparation & DHL handoff</small></span>${icon('arrow')}<span>DHL<small>Delivery to customer</small></span></div><div class="between route-count"><span>${rows.length} orders</span><b>${rows.filter(openIncident).length} need attention</b></div></article>`}).join('')}</div>`}
function orderOperationsCell(r,k){const o=db.orders.find(o=>o.id===r.id);if(k==='name')return `<button class="cell-link row" data-action="record" data-collection="orders" data-id="${r.id}">${art(db.products.find(p=>p.id===r.productId)?.art)}<span><b>${r.id} · ${esc(r.name)}</b><small class="cell-sub">Buyer: ${esc(r.buyer)} · ${money(r.amount)}</small><small class="cell-sub">Creator: @${esc(r.creatorUsername||r.creator)}</small></span></button>`;if(k==='model')return `<span class="route-label ${isManaged(o)?'purple':'teal'}">${isManaged(o)?'Printed by Merchrix':'Creator’s own merch'}</span><small class="cell-sub">${isManaged(o)?'Merchrix handles preparation':'Creator handles preparation'}</small>`;if(k==='preparation')return `<b class="operation-text">${esc(r.preparation)}</b><small class="cell-sub">Owner: ${isManaged(o)?'Merchrix':esc(o.creator)}</small>`;if(k==='delivery')return badge(r.delivery)+`<small class="cell-sub">${o.operations.override?'Admin-adjusted · DHL update retained':o.operations.carrier?'Latest update from DHL':'DHL handles delivery after handoff'}</small>`;if(k==='attention')return openIncident(o)?`<span class="badge orange">Needs attention</span><small class="cell-sub">With ${esc(o.operations.incident.owner)}</small>`:badge(r.attention);if(k==='lastUpdate')return `<b class="operation-text">${esc(r.source)}</b><small class="cell-sub">${opTime(r.lastUpdate)}</small>`;return esc(r[k])}
function ordersPage(){const rows=orderViewRows().filter(r=>route.tab==='production'?!['Handed to DHL','Cancelled'].includes(r.preparation):route.tab==='pickups'?['Ready for DHL','Ready for DHL drop-off'].includes(r.preparation):route.tab==='delivery'?['Awaiting first scan','In transit','Out for delivery','Delivery exception'].includes(r.delivery):route.tab==='exceptions'?r.attention==='Needs attention':true);return intro('Orders & fulfillment','Track preparation, DHL delivery, and issues. Admin corrections are recorded with a reason.')+`<div class="stack">${orderRouteCards()}${metrics([['In preparation',db.orders.filter(o=>!['Handed to DHL','Cancelled'].includes(o.operations.preparation)).length,'Merchrix or creator is preparing','lavender'],['With DHL',db.orders.filter(o=>['Awaiting first scan','In transit','Out for delivery'].includes(o.operations.delivery)).length,'Carrier delivery in progress','blue'],['Needs attention',db.orders.filter(openIncident).length,'Follow up or resolve','peach'],['Delivered',db.orders.filter(o=>o.operations.delivery==='Delivered').length,'Order delivery complete']])}<section class="panel">${tabs('orders',route.tab)}<div class="operations-note">${icon('shield')}<p><b>Admin oversight:</b> view updates from the creator and DHL, correct an order status, or resolve an issue. A correction does not replace the original DHL update.</p></div>${advancedTable('orderOperations',rows,{sort:'lastUpdate',dir:'desc',cell:orderOperationsCell,action:r=>button('Manage','record','small',`data-collection="orders" data-id="${r.id}"`)})}</section></div>`}
function partyCard(title,p,fallback){return `<div class="order-party"><span>${title}</span><div class="row">${avatar(p||{name:fallback},'small')}<div><b>${esc(p?.name||fallback)}</b><small>${p?.handle?'@'+esc(p.handle):'No linked account'}</small></div></div></div>`}
function orderDetails(id){if(!canCollection('orders'))return denyAccess();const o=db.orders.find(o=>o.id===id);if(!o)return;const op=o.operations,incident=op.incident,stages=preparationStages(o).filter(s=>s!=='Cancelled'),index=stages.indexOf(op.preparation);openDialog('Order '+o.id,o.name+' · '+(isManaged(o)?'Printed by Merchrix':'Creator’s own merch'),`<div class="order-detail-top"><div class="row">${art(db.products.find(p=>p.id===o.productId)?.art)}<div><h2>${esc(o.name)}</h2><p>${o.quantity} × ${esc(o.variant)} · ${money(o.amount)}</p></div></div><div>${badge(o.payment)}${openIncident(o)?'<span class="badge orange">Needs attention</span>':''}</div></div><div class="grid two order-parties">${partyCard('CUSTOMER',db.users.find(p=>p.id===o.buyerId),o.buyer)}${partyCard('CREATOR',db.users.find(p=>p.id===o.creatorId),o.creator)}</div><div class="order-owner-note">${icon(isManaged(o)?'pen':'bag')}<div><b>${isManaged(o)?'Merchrix manages printing, packing, and DHL handoff.':'The creator manages packing and takes this order to DHL.'}</b><p>DHL handles the delivery to the customer. Admins can correct statuses and follow up on issues.</p></div></div><div class="grid two order-state-panels"><section class="info-box"><div class="between"><h3>01 · Preparation</h3><span class="pill">${isManaged(o)?'Merchrix operations':'Creator app'}</span></div><h2>${esc(op.preparation)}</h2><p class="subline">Responsible: ${esc(preparationOwner(o))}</p><ol class="preparation-steps">${stages.map((s,i)=>`<li class="${i===index?'current':i<index?'done':''}"><i>${i<index?'✓':i+1}</i><span>${s}</span></li>`).join('')}</ol>${button('Adjust preparation','order-adjust','small',`data-id="${id}" data-scope="preparation"`)}</section><section class="info-box delivery-state"><div class="between"><h3>02 · Delivery</h3><span class="dhl-label">DHL</span></div><h2>${esc(op.delivery)}</h2><p class="subline">${op.override?'Status in Merchrix was adjusted by an admin.':'DHL carries the order after it is handed over.'}</p><div class="carrier-evidence"><span>LAST DHL UPDATE</span><b>${esc(op.carrier?.status||'No carrier update yet')}</b><p>${esc(op.carrier?.detail||'The first carrier update appears after DHL accepts and scans the parcel.')}</p><small>${op.carrier?opTime(op.carrier.time):'Awaiting handoff / first scan'}</small></div>${op.override?`<p class="admin-override-note">${icon('shield')} ${esc(op.override.actor)} adjusted delivery on ${opTime(op.override.time)}.<br>${esc(op.override.reason)}</p>`:''}${kv('Tracking number',esc(o.tracking||'Not added'))}${button('Adjust delivery status','order-adjust','small',`data-id="${id}" data-scope="delivery"`)}</section></div><section class="order-issue ${openIncident(o)?'open':''}"><div class="between"><div><h3>${openIncident(o)?'Issue needs follow-up':incident?'Issue resolved':'No open issue'}</h3><p>${esc(incident?.summary||'Raise an issue if preparation, handoff, or delivery needs attention.')}</p></div>${button(incident?'Review / resolve issue':'Raise an issue','order-issue','small',`data-id="${id}"`)}</div>${incident?`<div class="row wrap">${badge(incident.status)}<span>Responsible: ${esc(incident.owner)}</span><span>${esc(incident.category)}</span></div>${incident.notes?.length?`<p class="issue-latest-note">Latest note: ${esc(incident.notes.at(-1).note)}</p>`:''}`:''}</section><div class="grid two"><section class="info-box"><h3>Shipping & payment</h3>${kv('Delivery address',esc(o.address))}${kv('Carrier','DHL')}${kv('Shipping charge',money(o.shipping))}${kv('Order total',money(o.amount))}${kv('Payment',badge(o.payment))}</section><section class="info-box"><h3>Latest update</h3>${kv('Source',esc(op.source))}${kv('Updated by',esc(op.updatedBy))}${kv('Time',opTime(op.updatedAt))}<p class="subline">Status changes retain the previous value, source, and reason in the order activity below.</p></section></div><section class="review-section"><h3>Order activity</h3><div class="order-history">${[...op.history].reverse().map(h=>`<article><span class="history-source">${icon(h.source==='DHL'?'box':h.source==='Creator app'?'users':'shield')}</span><div><div class="between"><b>${esc(h.title)}</b><span class="badge">${esc(h.source)}</span></div><p>${esc(h.note)}</p><small>${esc(h.actor)} · ${opTime(h.time)}</small></div></article>`).join('')}</div></section><div class="form-actions">${button('Done','close-dialog','primary')}</div>`,true)}
function orderAdjustment(id,scope='preparation'){if(!canCollection('orders','write'))return denyAccess();const o=db.orders.find(o=>o.id===id);if(!o)return;const list=scope==='delivery'?DELIVERY_STATES:preparationStages(o),current=o.operations[scope];openDialog(scope==='delivery'?'Adjust delivery status':'Adjust preparation status',o.id+' · '+o.name,`<form id="orderAdjustmentForm" data-id="${id}" data-scope="${scope}"><div class="adjust-context">${kv('Current status',badge(current))}${kv('Preparation owner',esc(preparationOwner(o)))}${scope==='delivery'?kv('Last DHL update',esc(o.operations.carrier?.status||'No carrier update yet')):''}</div>${field('status','New status',current,'text',list,true)}${field('tracking','DHL tracking number',o.tracking||'')}${field('reason','Reason for this adjustment','','textarea',null,true)}<p class="subline">${scope==='delivery'?'This updates the order status shown in Merchrix. The original DHL update remains visible for comparison.':'Use a confirmed update from the creator or operations team. Your name and reason will be added to the order history.'}</p><p id="orderAdjustmentError" class="error-message" role="alert"></p><div class="form-actions">${button('Back to order','record','',`data-collection="orders" data-id="${id}"`)}<button class="button primary" type="submit">Save adjustment</button></div></form>`)}
function orderIssueForm(id){if(!canCollection('orders','write'))return denyAccess();const o=db.orders.find(o=>o.id===id);if(!o)return;const issue=o.operations.incident||{};openDialog(issue.summary?'Review order issue':'Raise an order issue',o.id+' · '+o.name,`<form id="orderIssueForm" data-id="${id}">${field('summary','Issue summary',issue.summary||'','text',null,true)}<div class="form-grid">${field('category','Issue type',issue.category||'Delivery exception','text',['Preparation delay','DHL handoff delay','Delivery exception','Address issue','Other'],true)}${field('owner','Responsible party',issue.owner||(isManaged(o)?'Merchrix operations':'Creator'),'text',['Merchrix operations','Creator','DHL'],true)}${field('status','Issue status',issue.status||'Open','text',['Open','Follow-up needed','Resolved'],true)}</div>${field('note','Action taken / resolution note','','textarea',null,true)}<p class="subline">Resolving an issue records the outcome. It does not automatically mark the order delivered or change the DHL status.</p><p id="orderIssueError" class="error-message" role="alert"></p><div class="form-actions">${button('Back to order','record','',`data-collection="orders" data-id="${id}"`)}<button type="submit" class="button primary">Save issue update</button></div></form>`)}
let balanceSegment='all';

balances=function(){const rows=balanceRowsScoped();return `<div class="balance-directory balance-v7"><div class="studio-heading"><div><h3>Creator balances</h3><p class="subline">Find a creator by name, @username, email, or bank account.</p></div><span class="pill">${creatorBalanceRows().length} creators · NGN</span></div><div class="balance-segments">${[['all','All creators'],['available','Ready to withdraw'],['pending','Pending settlement'],['held','On hold']].map(([key,label])=>`<button class="${balanceSegment===key?'selected':''}" data-v7="balance-segment" data-value="${key}">${label}<span>${creatorBalanceRows().filter(r=>key==='all'||r[key==='available'?'available':key==='held'?'held':'pending']>0).length}</span></button>`).join('')}</div>${advancedTable('creatorBalances',rows,{cols:['name','available','pending','held','status'],sort:'available',dir:'desc',cell:(r,k)=>k==='name'?`<button class="cell-link row" data-action="balance-details" data-id="${r.id}">${avatar(r)}<span><b>${esc(r.name)}</b><small class="cell-sub">${esc(r.username)}</small><small class="cell-sub">${esc(r.bank)}</small></span></button>`:k==='available'?`<b class="balance-available">${money(r.available)}</b><small class="cell-sub">${money(r.queued)} reserved</small>`:['pending','held'].includes(k)?`<b class="balance-number ${k==='held'&&r.held?'negative':''}">${money(r[k])}</b>`:badge(r.status),action:r=>button('Details','balance-details','small',`data-id="${r.id}"`)})}<div class="balance-legend"><span><i class="legend-dot" style="background:#51ae8f"></i>Withdrawable: cleared earnings</span><span>Reserved: approved payouts</span><span>Pending: awaiting settlement</span><span>On hold: under review</span></div></div>`};
function balancePage(){const rows=creatorBalanceRows(),sum=k=>rows.reduce((n,r)=>n+r[k],0);return intro('Creator balances','A searchable account directory with cleared, pending, and held earnings.')+`<div class="stack">${metrics([['Withdrawable',money(sum('available')),'Cleared and available','lavender'],['Reserved',money(sum('queued')),'Approved for payout','blue'],['Pending settlement',money(sum('pending')),'Not yet withdrawable'],['On hold',money(sum('held')),'Requires review','peach']])}<section class="panel">${tabs('finance','balances')}${balances()}</section></div>`}
let transactionPersonId='',transactionPersonRole='all';
function currentTransaction(t){const payout=t.payoutId?db.payouts.find(p=>p.id===t.payoutId):null;return {...t,creator:db.users.find(p=>p.id===t.creatorId)?.name||t.creator,customer:db.users.find(p=>p.id===t.buyerId)?.name||t.customer,...(payout?{amount:payout.amount,status:payout.status==='Paid'?'Successful':payout.status==='Approved'?'Processing':payout.status}:{})}}
function ledgerRows(creatorId=null){const rows=db.transactions.map(currentTransaction);return creatorId?rows.filter(t=>t.creatorId===creatorId):transactionPersonId?rows.filter(t=>t.creatorId===transactionPersonId||t.buyerId===transactionPersonId):rows}
function transactionPersonPicker(){const p=db.users.find(p=>p.id===transactionPersonId);return `<details class="transaction-person-filter" open><summary>${icon('users')}<span><b>Filter by creator or customer</b><small>${p?esc(p.name)+' · @'+esc(p.handle):'Choose a person to see their linked transactions'}</small></span><span class="accordion-chevron">⌄</span></summary><div class="person-filter-body"><div class="person-search-row"><label class="search-field">${icon('search')}<input id="transactionPersonSearch" type="search" autocomplete="off" placeholder="Search name, username, email, or account ID" aria-label="Find a creator or customer"></label><select id="transactionPersonRole" aria-label="Account type"><option value="all" ${transactionPersonRole==='all'?'selected':''}>All accounts</option><option value="Creator" ${transactionPersonRole==='Creator'?'selected':''}>Creators</option><option value="Fan" ${transactionPersonRole==='Fan'?'selected':''}>Customers / fans</option></select></div><div id="transactionPersonResults" class="person-results">${transactionPersonResults('')}</div><div id="transactionPersonSelection" class="transaction-selection">${p?`<span class="row">${avatar(p,'small')}<span>Showing transactions linked to <b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)}</span></span></span><button class="text-btn" data-v7="clear-transaction-person">Clear person filter</button>`:'<span class="muted">All people selected. Search above to narrow the ledger.</span>'}</div></div></details>`}
function transactionPersonResults(query){const all=db.users.filter(p=>(transactionPersonRole==='all'||p.role===transactionPersonRole)&&[p.name,p.handle,p.email,p.id].join(' ').toLowerCase().includes(query.trim().toLowerCase()));const rows=query.trim()?all.slice(0,12):all.filter(p=>db.transactions.some(t=>t.creatorId===p.id||t.buyerId===p.id)).slice(0,6);return rows.map(p=>`<button class="person-choice ${p.id===transactionPersonId?'selected':''}" data-v7="select-transaction-person" data-id="${p.id}">${avatar(p,'small')}<span><b>${esc(p.name)}</b><small>@${esc(p.handle)} · ${p.role==='Fan'?'Customer':p.role}</small></span>${p.id===transactionPersonId?icon('check'):icon('plus')}</button>`).join('')||'<p class="picker-empty">No matching accounts. Try another name or username.</p>'}
function transactionCell(t,k){if(k==='name')return `<button class="cell-link" data-v7="transaction-detail" data-id="${t.id}"><b>${esc(t.name)}</b><small class="cell-sub">${t.id} · ${esc(t.reference)}</small></button>`;if(k==='creator'||k==='customer'){const p=db.users.find(p=>p.id===(k==='creator'?t.creatorId:t.buyerId));return p?`<a class="row" href="#users/${p.id}">${avatar(p,'small')}<span><b>${esc(p.name)}</b><small class="cell-sub">@${esc(p.handle)}</small></span></a>`:'<span class="muted">—</span>'}return baseCell(t,k,'transactions')}
function transactionTable(rows,creator=false){return advancedTable('transactions',rows,{cols:creator?['name','customer','type','amount','date','status']:COLLECTIONS.transactions.cols,sort:'date',dir:'desc',cell:transactionCell,action:t=>`<button class="button small" data-v7="transaction-detail" data-id="${t.id}">View</button>`})}
function transactionSummary(rows){return `<div class="ledger-summary"><div><span>Matching transactions</span><b>${rows.length}</b></div><div><span>Successful order payments</span><b>${money(rows.filter(t=>t.type==='Payment'&&t.status==='Successful').reduce((n,t)=>n+t.amount,0))}</b></div><div><span>Successful payouts</span><b>${money(rows.filter(t=>t.type==='Payout'&&t.status==='Successful').reduce((n,t)=>n+t.amount,0))}</b></div></div>`}
function transactionsPage(){const rows=ledgerRows();return intro('Transactions','Find payments and payouts by creator, customer, reference, or date.')+`<section class="panel">${tabs('finance','transactions')}${transactionPersonPicker()}<div id="scopedTransactionLedger">${transactionSummary(rows)}${transactionTable(rows)}</div></section>`}
function refreshScopedTransactions(){const host=document.getElementById('scopedTransactionLedger');if(!host)return;host.querySelectorAll('[data-grid]').forEach(g=>grids.delete(g.dataset.grid));const rows=ledgerRows();host.innerHTML=transactionSummary(rows)+transactionTable(rows);const p=db.users.find(p=>p.id===transactionPersonId);document.getElementById('transactionPersonSelection').innerHTML=p?`<span class="row">${avatar(p,'small')}<span>Showing <b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)}</span> · ${rows.length} transactions</span></span><button class="text-btn" data-v7="clear-transaction-person">Clear person filter</button>`:'<span class="muted">All people selected. Search above to narrow the ledger.</span>';document.querySelector('.transaction-person-filter summary small').textContent=p?p.name+' · @'+p.handle:'Choose a person to see their linked transactions';document.getElementById('transactionPersonResults').innerHTML=transactionPersonResults(document.getElementById('transactionPersonSearch').value)}
function creatorTransactions(id){if(!canCollection('transactions'))return empty('Access restricted','Transaction access is limited to the finance and admin workspace.');const p=db.users.find(p=>p.id===id),rows=ledgerRows(id);return `<div class="creator-ledger-heading"><div><h3>Creator transactions</h3><p class="subline">Payments for @${esc(p.handle)}’s orders and payouts to this creator. Amounts are gross transaction values.</p></div><span class="pill">${rows.length} records · NGN</span></div>${transactionSummary(rows)}${transactionTable(rows,true)}`}
function transactionDetail(id){if(!canCollection('transactions'))return denyAccess();const source=db.transactions.find(t=>t.id===id);if(!source)return;const t=currentTransaction(source);const creator=db.users.find(p=>p.id===t.creatorId),buyer=db.users.find(p=>p.id===t.buyerId);openDialog('Transaction '+t.id,t.name,`<div class="transaction-detail-amount"><span>${esc(t.type)}</span><h2>${money(t.amount)}</h2>${badge(t.status)}</div><div class="grid two">${partyCard('CREATOR',creator,t.creator||'Unassigned')}${partyCard(t.type==='Payout'?'RECIPIENT':'CUSTOMER',t.type==='Payout'?creator:buyer,t.type==='Payout'?t.creator:t.customer||'Not linked')}</div><div class="info-box" style="margin-top:20px">${kv('Reference',esc(t.reference))}${kv('Date',esc(t.date))}${kv('Linked order',esc(t.orderId||'—'))}${kv('Payout reference',esc(t.payoutId||'—'))}<p class="subline">${t.type==='Payout'?'Transfer to the creator’s bank account.':'Payment collected for the creator’s order. This is the gross payment amount, including any shipping charge.'}</p></div><div class="form-actions">${t.orderId?button('View order','record','',`data-collection="orders" data-id="${t.orderId}"`):''}${t.payoutId?button('View payout','record','',`data-collection="payouts" data-id="${t.payoutId}"`):''}${button('Close','close-dialog','primary')}</div>`,true)}
function fandomWindow(){const end=new Date();end.setUTCHours(23,59,59,999);return {end:end.toISOString().slice(0,10),start:new Date(+end-29*86400000).toISOString().slice(0,10)}}
function fanSquadTotals(id){const w=fandomWindow(),events=db.squadContributions.filter(e=>e.userId===id&&e.date>=w.start&&e.date<=w.end),ids=[...new Set(events.map(e=>e.squadId))];return ids.map(squadId=>{const s=db.squads.find(s=>s.id===squadId),mine=events.filter(e=>e.squadId===squadId),sum=kind=>mine.filter(e=>e.kind===kind).reduce((n,e)=>n+e.points,0);return {id:squadId,name:s?.name||'Unknown squad',creator:s?.creator||'',purchases:sum('Merch purchases'),participation:sum('Squad participation'),clashes:sum('Squad Clash'),total:mine.reduce((n,e)=>n+e.points,0)}}).sort((a,b)=>b.total-a.total)}
function fandomSnapshot(p){const w=fandomWindow(),orders=db.orders.filter(o=>o.buyerId===p.id&&o.payment==='Paid'&&o.status!=='Cancelled'&&o.date>=w.start&&o.date<=w.end),creatorIds=[...new Set(orders.map(o=>o.creatorId))],top=creatorIds.map(id=>({id,orders:orders.filter(o=>o.creatorId===id),spend:orders.filter(o=>o.creatorId===id).reduce((n,o)=>n+o.amount-o.shipping,0)})).sort((a,b)=>b.spend-a.spend)[0],creator=db.users.find(u=>u.id===top?.id),squads=fanSquadTotals(p.id),topSquad=squads[0],total=squads.reduce((n,s)=>n+s.total,0);return `<section class="info-box fandom-v7"><div class="between"><h3>Fandom snapshot</h3><span class="pill">Last 30 days</span></div><div class="fandom-favorites"><div><span class="eyebrow">TOP CREATOR</span>${creator?`<a class="row" href="#users/${creator.id}">${avatar(creator)}<div><b>${esc(creator.name)}</b><small>@${esc(creator.handle)}</small></div></a><p>${top.orders.length} paid orders · ${money(top.spend)} in merch</p><small>Based on merch spend, excluding shipping.</small>`:'<p>No paid creator purchases in this period.</p>'}</div><div><span class="eyebrow">TOP SQUAD</span>${topSquad?`<button class="cell-link row" data-action="record" data-collection="squads" data-id="${topSquad.id}"><span class="squad-monogram">${esc(topSquad.name.slice(0,2).toUpperCase())}</span><div><b>${esc(topSquad.name)}</b><small>${esc(topSquad.creator)}</small></div></button><p>${topSquad.total.toLocaleString()} Fanblazes contributed</p><small>This fan’s highest squad contribution this period.</small>`:'<p>No squad contribution recorded in this period.</p>'}</div></div><div class="fan-contribution-total"><span>${icon('flame')}</span><div><b>${total.toLocaleString()}</b><p>Fanblazes earned for ${squads.length} squad${squads.length===1?'':'s'}</p></div><button class="text-btn" data-v7="fan-contributions" data-id="${p.id}">Breakdown ${icon('arrow')}</button></div><p class="fandom-explainer">These are squad points this fan earned through purchases, participation, and Squad Clash. They are separate from the fan’s personal XP and the squad’s total score.</p></section>`}
function fanContributionDetails(id){if(!canCollection('users'))return denyAccess();const p=db.users.find(p=>p.id===id);if(!p)return;const rows=fanSquadTotals(id),w=fandomWindow();openDialog('Fanblazes contribution breakdown',p.name+' · @'+p.handle+' · '+w.start+' to '+w.end,`<div class="preview-note">Only this fan’s contributions in the last 30 days are shown. A squad’s overall Fanblazes total includes contributions from other members.</div>${advancedTable('fanContributions',rows,{sort:'total',dir:'desc',actions:false,cell:(r,k)=>k==='name'?`<button class="cell-link" data-action="record" data-collection="squads" data-id="${r.id}"><b>${esc(r.name)}</b><small class="cell-sub">${esc(r.creator)}</small></button>`:Number(r[k]||0).toLocaleString()})}<div class="form-actions">${button('Done','close-dialog','primary')}</div>`,true)}
const profileV6=profile;

const badgeV6=badge;

function syncOrderSummary(o){const op=o.operations;if(op.preparation==='Cancelled')o.status='Cancelled';else if(openIncident(o)||op.delivery==='Delivery exception')o.status='Exception';else if(op.delivery==='Delivered')o.status='Delivered';else if(['In transit','Out for delivery','Returned','Awaiting first scan'].includes(op.delivery))o.status='Shipped';else if(['Ready for DHL','Ready for DHL drop-off','Handed to DHL'].includes(op.preparation))o.status='Ready for pickup';else if(['Printing & quality check','Packing'].includes(op.preparation))o.status='Production';else o.status='Pending';if(openIncident(o))o.issue=op.incident.summary;else delete o.issue}

function syncDesignAssignments(){
 const stateMap={'New':'New request','In progress':'In progress','In review':'Awaiting review','Delivered':'Completed'};
 for(const b of storeDB.briefs){
  let p=storeDB.designProjects.find(p=>p.briefId===b.id);
  const owner=storeDB.staff.find(s=>s.name===b.designer)||Object.values(STAFF_ACCOUNTS).find(s=>s.name===b.designer);
  const signature=JSON.stringify([b.name,b.creator,b.designer,b.due,b.notes,b.status,b.package,b.priority]);
  if(!p&&owner){const time=new Date().toISOString();p={id:'BR-'+b.id,briefId:b.id,designerId:owner.id,designer:b.designer,name:b.name,client:b.creator,clientId:person(b.creator)?.id,category:b.package,status:stateMap[b.status]||'New request',priority:b.priority||'Normal',created:today(),due:b.due||today(),brief:b.notes||'Review the project requirements with your administrator before starting.',requirements:['Print-ready artwork','Editable source files','Garment preview'],palette:[],reference:b.art||'tee',unread:0,versions:[],messages:[{id:'M-'+uid(),by:'system',text:'Request assigned by the admin team. Review the brief before starting work.',time}],activity:[{title:'Request assigned',detail:'Assigned to '+b.designer+' by the admin team',time}],assignedBy:'Admin team'};storeDB.designProjects.unshift(p)}
  if(!p)continue;
  if(p.briefSignature!==signature){Object.assign(p,{name:b.name,client:b.creator,designer:b.designer,designerId:owner?.id||null,due:b.due||today(),brief:b.notes||p.brief,category:b.package,priority:b.priority||'Normal',status:stateMap[b.status]||p.status});if(p.status==='Completed')p.completed??=today();p.briefSignature=signature}
  else {b.status=({'New request':'New','In progress':'In progress','Revision requested':'In progress','Awaiting review':'In review','Completed':'Delivered'})[p.status]||b.status;p.briefSignature=JSON.stringify([b.name,b.creator,b.designer,b.due,b.notes,b.status,b.package,b.priority])}
 }
}

function ncDate(date){if(!date||Number.isNaN(Date.parse(date)))return '';return new Date(date.length===10?date+'T12:00:00Z':date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Africa/Lagos'})}
function ncUpdateBell(){if(!session)return;const bell=document.querySelector('[data-action="notifications"]');if(!bell)return;const n=ncItems().filter(n=>!ncIsRead(n)).length;bell.querySelectorAll('i,.nc-bell-count').forEach(n=>n.remove());if(n)bell.insertAdjacentHTML('beforeend',`<span class="nc-bell-count" aria-hidden="true">${n>99?'99+':n}</span>`);bell.setAttribute('aria-label','Notifications'+(n?', '+n+' unread':', all read'));bell.setAttribute('aria-haspopup','dialog')}
function ncRender(){const root=document.getElementById('notificationCenter');if(!root)return;const all=ncItems(),unread=all.filter(n=>!ncIsRead(n)).length,categories=[...new Set(all.map(n=>n.category))];if(ncCategory!=='All categories'&&!categories.includes(ncCategory))ncCategory='All categories';const rows=all.filter(n=>(ncView==='all'||!ncIsRead(n))&&(ncCategory==='All categories'||n.category===ncCategory));root.innerHTML=`<header class="nc-head"><div><h2 id="nc-title">Notifications</h2><p>${unread?unread+' unread update'+(unread===1?'':'s'):'You’re all caught up'} · ${esc(STAFF_ACCOUNTS[session.role].label)} workspace</p></div><button class="icon-btn" data-nc="close" aria-label="Close notifications">${icon('close')}</button></header><div class="nc-toolbar"><div class="nc-tabs" role="group" aria-label="Filter notifications"><button data-nc="all" aria-pressed="${ncView==='all'}">All</button><button data-nc="unread" aria-pressed="${ncView==='unread'}">Unread${unread?' · '+unread:''}</button></div><button data-nc="read-all" ${unread?'':'disabled'}>Mark all as read</button></div><div class="nc-filter"><span>${rows.length} notification${rows.length===1?'':'s'}</span><select id="nc-category" aria-label="Notification category">${['All categories',...categories].map(c=>`<option ${c===ncCategory?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="nc-list">${rows.length?[true,false].map(attention=>{const group=rows.filter(n=>n.attention===attention);return group.length?`<section><h3 class="nc-group">${attention?'Needs attention':'Updates'}</h3>${group.map(n=>`<article class="nc-item ${ncIsRead(n)?'':'unread'}"><span class="nc-symbol ${n.tone}" aria-hidden="true">${icon(n.ic)}</span><div class="nc-copy"><button class="nc-open" data-nc="open" data-key="${esc(n.key)}"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><span class="nc-meta">${esc(n.category)}${ncDate(n.date)?' · '+ncDate(n.date):''}</span><span class="nc-cta">${n.cta} →</span></button></div><button class="nc-read" data-nc="toggle" data-key="${esc(n.key)}" title="Mark as ${ncIsRead(n)?'unread':'read'}" aria-label="Mark ${esc(n.title)} as ${ncIsRead(n)?'unread':'read'}">${ncIsRead(n)?icon('check'):'<i></i>'}</button></article>`).join('')}</section>`:''}).join(''):`<div class="nc-empty"><span class="nc-symbol">${icon('check')}</span><h3>${ncView==='unread'?'You’re all caught up':'No notifications here'}</h3><p>${ncView==='unread'?'You have no unread updates in this view.':'New workspace updates will appear here.'}</p>${ncView==='unread'||ncCategory!=='All categories'?'<button class="button small" data-nc="reset">View all notifications</button>':''}</div>`}</div><footer class="nc-foot">Reading a notification does not resolve the underlying task.</footer>`;ncUpdateBell()}
function ncClose(){document.getElementById('notificationCenter')?.close()}
notifications=function(){if(!session)return;let root=document.getElementById('notificationCenter');if(!root){root=document.createElement('dialog');root.id='notificationCenter';root.setAttribute('aria-labelledby','nc-title');root.addEventListener('close',()=>{if(ncReturnFocus?.isConnected)ncReturnFocus.focus()});root.addEventListener('click',e=>{if(e.target===root){const r=root.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)root.close()}});document.body.append(root)}ncReturnFocus=document.activeElement;ncView='all';ncCategory='All categories';ncRender();if(!root.open)root.showModal();root.querySelector('[data-nc="close"]').focus()};
window.addEventListener('click',e=>{const b=e.target.closest('[data-nc]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(!session)return;const action=b.dataset.nc;if(action==='close')return ncClose();if(['all','unread','reset'].includes(action)){ncView=action==='unread'?'unread':'all';if(action==='reset')ncCategory='All categories';ncRender();document.querySelector(`[data-nc="${ncView}"]`)?.focus();return}const items=ncItems();if(action==='read-all'){ncSaveRead(items,true);ncRender();document.querySelector('[data-nc="all"]')?.focus();return}const n=items.find(n=>n.key===b.dataset.key);if(!n)return;if(action==='toggle'){ncSaveRead([n],!ncIsRead(n));ncRender();document.querySelector('[data-nc="'+ncView+'"]')?.focus();return}if(action==='open'){ncSaveRead([n],true);ncClose();ncUpdateBell();if(n.kind.startsWith('project-')){const p=ownedProject(n.id);if(!p)return denyAccess();p.unread=0;persist();conversationTab=n.kind.slice(8);if(route.projectId===n.id)render();else location.hash='designer-inbox/'+n.id;return}if(n.kind==='application')applicationView(n.id);else if(n.kind==='delivery')managerDelivery(n.id);else record(({order:'orders',product:'products',report:'reports',payout:'payouts'})[n.kind],n.id)}},true);
window.addEventListener('change',e=>{if(e.target.id!=='nc-category')return;ncCategory=e.target.value;ncRender();document.getElementById('nc-category')?.focus()},true);
const renderBeforeNotifications=render;render=function(){renderBeforeNotifications();ncUpdateBell()};
parseRoute();
</script><script>
/* Creator admission: approved applications and direct invitations. */
storeDB.creatorInvites??=[];
if(!PAGE_TABS.users.some(t=>t[0]==='invites'))PAGE_TABS.users.splice(2,0,['invites','Creator invites']);
COLLECTIONS.creatorInvites={title:'Creator invites',singular:'invite',cols:['name','email','source','created','expires','status'],labels:{name:'Creator',source:'Invite source',created:'Created',expires:'Expires'},fields:{}};
GRID_FIELDS.creatorInvites=['status','source'];GRID_RANGES.creatorInvites=['created','expires'];
function ciAllowed(){return session&&canCollection('users','write')&&!emptyPreview}
function ciButton(text,action,id='',cls='small'){return `<button type="button" class="button ${cls}" data-ci="${action}" data-id="${esc(id)}">${text}</button>`}
function ciStatus(i){return i.usedAt?'Used':i.revokedAt?'Revoked':Date.parse(i.expires)<=Date.now()?'Expired':'Ready'}
function ciExisting(email,except=''){return storeDB.creatorInvites.find(i=>i.id!==except&&i.email.toLowerCase()===email.toLowerCase()&&['Ready','Used'].includes(ciStatus(i)))}
function ciCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code;do{code='MX-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>alphabet[n%alphabet.length]).join('')}while(storeDB.creatorInvites.some(i=>i.code===code));return code}
function ciCreate(data){if(!ciAllowed())throw new Error('You do not have permission to create creator invites.');const name=String(data.name||'').trim(),email=String(data.email||'').trim().toLowerCase(),days=Number(data.days||14);if(!name)throw new Error('Enter the creator’s full name.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Enter a valid email address.');if(![7,14,30].includes(days))throw new Error('Choose a valid expiry period.');const application=data.applicationId&&storeDB.applications.find(a=>a.id===data.applicationId);if(data.applicationId&&!application)throw new Error('This application could not be found.');if(application&&application.status!=='Approved'&&!data.approve)throw new Error('Approve this application before creating an invite.');if(application&&application.email?.toLowerCase()!==email)throw new Error('The invite email must match the application.');const existing=ciExisting(email);if(existing)throw new Error(existing.usedAt?'This recipient has already used an invitation.':'This email already has an active invitation. Open the existing invite.');const account=storeDB.users.find(u=>u.role==='Creator'&&u.email?.toLowerCase()===email&&u.status==='Active');if(account)throw new Error('This email already belongs to an active creator.');const time=new Date().toISOString(),i={id:'INV-'+uid().toUpperCase(),name,email,brand:String(data.brand||'').trim(),applicationId:application?.id||null,code:ciCode(),created:time,expires:new Date(Date.now()+days*86400000).toISOString(),createdBy:session.name,source:application?'Application':'Direct invite',history:[{title:'Code created',actor:session.name,date:time}]};storeDB.creatorInvites.unshift(i);return i}
function ciRows(){return db.creatorInvites.map(i=>({...i,created:i.created.slice(0,10),expires:i.expires.slice(0,10),status:ciStatus(i)}))}
function creatorInvitesPage(){const rows=ciRows();return intro('Creator invites','Create signup access for approved applicants or invite a creator directly.',ciButton(icon('plus')+' Invite creator','new','','primary'))+`<div class="stack">${metrics([['Ready to use',rows.filter(i=>i.status==='Ready').length,'Active signup codes','lavender'],['Used',rows.filter(i=>i.status==='Used').length,'Redeemed during signup','blue'],['Expired',rows.filter(i=>i.status==='Expired').length,'Create a new code if needed','peach'],['Direct invites',rows.filter(i=>i.source==='Direct invite').length,'No application required','gray']])}<div class="ci-banner"><span class="avatar">${icon('users')}</span><div><h3>Two paths. One creator signup.</h3><p>Approve an application to issue a code, or invite a creator directly. The creator enters their code before continuing signup.</p></div><a class="button small" href="#users/applications">Review applications</a></div><section class="panel">${tabs('users','invites')}${rows.length?advancedTable('creatorInvites',rows,{sort:'created',dir:'desc',cell:(r,k)=>k==='name'?`<b>${esc(r.name)}</b><small class="cell-sub">${esc(r.brand||r.id)}</small>`:k==='status'?badge(r.status):esc(r[k]||'—'),action:r=>ciButton('View invite','view',r.id)}):`<div class="pad">${empty('No creator invites yet','Approve an application or invite a creator without an application.')}<div class="form-actions">${ciButton('Invite creator','new','','primary')}</div></div>`}</section></div>`}
const ciCollectionBase=collectionPage;collectionPage=function(page){if(page==='users'&&route.tab==='invites')return creatorInvitesPage();return ciCollectionBase(page)};
applicationsPage=function(){const rows=db.applications;return intro('Creator applications','Review creator applications, then approve and issue a signup code.',ciButton('Invite without an application','new'))+`<div class="stack">${metrics([['Awaiting review',rows.filter(a=>['Submitted','In review'].includes(a.status)).length,'New creator requests','lavender'],['Approved',rows.filter(a=>a.status==='Approved').length,'Ready for an invite','blue'],['Changes requested',rows.filter(a=>a.status==='Changes requested').length,'Waiting on the applicant','peach'],['Active invites',db.creatorInvites.filter(i=>i.applicationId&&ciStatus(i)==='Ready').length,'Ready for creator signup','gray']])}<section class="panel">${tabs('users','applications')}${advancedTable('applications',rows,{cols:['name','email','submitted','status'],sort:'submitted',dir:'desc',cell:(a,k)=>k==='name'?`<button class="cell-link row" data-ci="application" data-id="${esc(a.id)}">${avatar(a)}<span><b>${esc(a.name)}</b><small class="cell-sub">${esc(a.brand||a.answers?.['Public / creator name']||a.id)}</small></span></button>`:k==='status'?badge(a.status):esc(a[k]||'—'),action:a=>ciButton('Review application','application',a.id)})}</section></div>`};
function ciAnswer(label,value){return `<div class="ci-answer"><dt>${label}</dt><dd>${esc(value||'Not provided')}</dd></div>`}
applicationView=function(id){if(!canCollection('users'))return denyAccess();const a=db.applications.find(x=>x.id===id);if(!a)return;const answers=a.answers||{},invites=db.creatorInvites.filter(i=>i.applicationId===id),last=invites[0];openDialog('Creator application',a.id+' · Submitted '+dateLabel(a.submitted),`<div class="ci-review-header">${avatar(a)}<div><h3>${esc(a.name)}</h3><p>${esc(a.email)}</p></div>${badge(a.status)}</div><div class="ci-review-grid"><section class="info-box"><h3>About the creator</h3><dl>${ciAnswer('Full name',a.name)}${ciAnswer('Email address',a.email)}${ciAnswer('Country / location',a.country||a.region||answers.Location)}${ciAnswer('Brand / creator name',a.brand||answers['Brand/Creator Name']||answers['Public / creator name'])}${ciAnswer('About the brand',a.aboutBrand||answers['Tell us about your brand']||answers['Tell us about your community'])}${ciAnswer('Why Merchrix?',a.reason||answers['Why do you want to join Merchrix?'])}</dl></section><div class="stack"><section class="info-box"><h3>Social handles</h3>${(a.socials||[]).map(s=>`<a class="list-item" href="${esc(safePublicLink(s.url))}" target="_blank" rel="noopener noreferrer"><span class="avatar small">${icon('link')}</span><div><b>${esc(s.platform)}</b><small>${esc(s.handle)}</small></div>${icon('external')}</a>`).join('')||'<p class="subline">No social handles submitted.</p>'}</section>${(a.documents||[]).length?`<section class="info-box"><h3>Supporting documents</h3>${a.documents.map((d,i)=>`<div class="list-item"><div><b>${esc(d.name)}</b><small>${esc(d.type)}</small></div>${v8button('Open','document',id,`data-index="${i}"`)}</div>`).join('')}</section>`:''}<section class="info-box"><h3>Signup invitation</h3>${last?`${kv('Code status',badge(ciStatus(last)))}${kv('Recipient',esc(last.email))}${ciButton('View invite','view',last.id)}`:`<p class="subline">${a.status==='Approved'?'Application approved. Create a code to let this creator sign up.':'Approve the application to create a signup code.'}</p>${a.status==='Approved'?ciButton('Create invite code','from-application',a.id,'primary small'):''}`}</section></div></div><section class="info-box"><h3>Review decision</h3><p class="subline">Signup access does not verify identity or grant a reserved username.</p><form id="ciDecisionForm" data-id="${esc(a.id)}"><div class="grid two">${field('outcome','Decision',a.status,'text',['Submitted','In review','Changes requested','Approved','Rejected'],true)}${field('days','Invite expires after','14','text',['7','14','30'],true)}</div>${field('reason','Review notes','','textarea',null,true)}<label class="row small-text"><input type="checkbox" name="reviewed" required> I reviewed the application and social handles.</label><p class="ci-note" style="margin-top:16px">Choosing Approved creates an invitation code. You can then copy it or open an email draft to share it.</p><p id="ciError" class="error-message" role="alert"></p><div class="form-actions">${button('Cancel','close-dialog')}<button class="button primary" type="submit">Save decision</button></div></form></section>${reviewHistory(a)}`,true)};
function ciNew(applicationId=''){if(!ciAllowed())return denyAccess();const a=applicationId?db.applications.find(a=>a.id===applicationId):null;if(applicationId&&(!a||a.status!=='Approved'))return toast('Approve the application first.');openDialog(a?'Create signup invite':'Invite a creator',a?'Issue a signup code for this approved application.':'No application needed. Create a code for a creator you want to invite.',`<form id="ciCreateForm" data-application="${esc(a?.id||'')}">${field('name','Full name',a?.name||'','text',null,true)}${field('email','Recipient email',a?.email||'','email',null,true)}${field('brand','Brand / creator name',a?.brand||a?.answers?.['Public / creator name']||'')}${field('days','Invite expires after (days)','14','text',['7','14','30'],true)}<p class="ci-note">One code per creator, linked to this email. The code can be used once before it expires.</p><p id="ciError" class="error-message" role="alert"></p><div class="form-actions">${button('Cancel','close-dialog')}<button type="submit" class="button primary">Create invite code</button></div></form>`);if(a){document.querySelector('#ciCreateForm [name=email]').readOnly=true;document.querySelector('#ciCreateForm [name=name]').readOnly=true}}
function ciMessage(i){return `Hi ${i.name},\n\nYou’re invited to join Merchrix as a creator.\n\nYour signup invitation code is: ${i.code}\n\nOpen Merchrix, choose Creator, and enter this code to continue signup using ${i.email}.\n\nThis code expires on ${new Date(i.expires).toLocaleString('en-GB',{timeZone:'Africa/Lagos'})} WAT and can only be used once.\n\nSee you on Merchrix!`}
function ciView(id){if(!canCollection('users'))return denyAccess();const i=db.creatorInvites.find(i=>i.id===id);if(!i)return;const status=ciStatus(i),ready=status==='Ready';openDialog('Creator invitation',i.name+' · '+i.id,`<div class="between" style="margin-bottom:18px"><span class="eyebrow">${esc(i.source)}</span>${badge(status)}</div><div class="ci-code"><label for="ciCode">Signup invitation code</label><input id="ciCode" value="${esc(i.code)}" readonly aria-label="Signup invitation code"><p>${ready?'Share this code with the creator to unlock signup.':status==='Used'?'This code has already been redeemed.':'This code is no longer valid. Create a new invite if needed.'}</p></div><div class="ci-meta"><div><small>Recipient</small><b>${esc(i.email)}</b></div><div><small>Expires</small><b>${esc(new Date(i.expires).toLocaleString('en-GB',{timeZone:'Africa/Lagos'}))} WAT</b></div><div><small>Created by</small><b>${esc(i.createdBy)}</b></div><div><small>Usage</small><b>${i.usedAt?'1 of 1 use':'0 of 1 use'}</b></div></div>${ready?`<div class="ci-share">${ciButton('Copy code','copy',i.id,'primary small')}${ciButton('Copy invitation','copy-message',i.id)}<a class="button small" href="mailto:${encodeURIComponent(i.email)}?subject=${encodeURIComponent('Your Merchrix creator invitation')}&body=${encodeURIComponent(ciMessage(i))}">${icon('mail')} Open email draft</a></div>`:''}<p class="ci-note">Email delivery and signup redemption need the live app connection. This preview creates and manages codes locally; opening a draft does not send an email.</p><div class="form-actions">${i.applicationId?ciButton('View application','application',i.applicationId):''}${ready?ciButton('Revoke code','revoke',i.id,'danger small'):['Expired','Revoked'].includes(status)?ciButton('Create new invite','replace',i.id,'primary small'):''}</div><div>${(i.history||[]).map(h=>`<div class="ci-history">${esc(h.title)}<small>${esc(h.actor)} · ${esc(new Date(h.date).toLocaleString('en-GB'))}</small></div>`).join('')}</div>`)}
function ciCommit(){localStorage.setItem('merchrix-admin-v4',JSON.stringify(storeDB))}
window.addEventListener('click',async e=>{const b=e.target.closest('[data-ci]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(!ciAllowed())return denyAccess();const action=b.dataset.ci,id=b.dataset.id;if(action==='new')return ciNew();if(action==='application')return applicationView(id);if(action==='from-application')return ciNew(id);if(action==='view')return ciView(id);const i=storeDB.creatorInvites.find(i=>i.id===id);if(!i)return;if(action==='replace'){ciNew(i.applicationId||'');const f=document.getElementById('ciCreateForm');if(f){f.elements.name.value=i.name;f.elements.email.value=i.email;f.elements.brand.value=i.brand||''}return}if(action==='revoke'){openDialog('Revoke this invitation?','The creator will no longer be able to use this code.',`<p class="ci-note">${esc(i.name)} · ${esc(i.email)}</p><div class="form-actions">${ciButton('Keep invitation','view',id)}${ciButton('Revoke code','confirm-revoke',id,'danger')}</div>`);return}if(action==='confirm-revoke'){if(ciStatus(i)!=='Ready')return ciView(id);const previous=structuredClone(i);i.revokedAt=new Date().toISOString();i.history.push({title:'Code revoked',actor:session.name,date:i.revokedAt});try{ciCommit();audit('Creator invite revoked',id);render();ciView(id)}catch{Object.assign(i,previous);if(!previous.revokedAt)delete i.revokedAt;toast('Could not save the change. Please try again.')}return}if(['copy','copy-message'].includes(action)){if(ciStatus(i)!=='Ready')return toast('This invitation is no longer active.');try{await navigator.clipboard.writeText(action==='copy'?i.code:ciMessage(i));toast(action==='copy'?'Invitation code copied.':'Invitation message copied.')}catch{if(action==='copy'){const input=document.getElementById('ciCode');input.focus();input.select();toast('Code selected. Use Ctrl/Cmd+C to copy.')}else openDialog('Copy invitation','Select the message and copy it.',`<textarea readonly style="width:100%;min-height:280px">${esc(ciMessage(i))}</textarea>`)}return}},true);
window.addEventListener('submit',e=>{const f=e.target;if(!['ciCreateForm','ciDecisionForm'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();if(!ciAllowed())return denyAccess();if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f)),before=structuredClone(storeDB.creatorInvites),a=f.id==='ciDecisionForm'?storeDB.applications.find(a=>a.id===f.dataset.id):null,old=a?structuredClone(a):null;try{let i;if(a){if(!v.reason.trim()||!v.reviewed)throw new Error('Review the application and add a decision note.');if(!['Submitted','In review','Changes requested','Approved','Rejected'].includes(v.outcome))throw new Error('Choose a valid decision.');if(v.outcome==='Approved'){i=ciExisting(a.email);if(i&&i.applicationId!==a.id)throw new Error('This email already has an invitation. Manage it under Creator invites.');if(!i)i=ciCreate({name:a.name,email:a.email,brand:a.brand||a.answers?.['Public / creator name'],days:v.days,applicationId:a.id,approve:true})}else{const active=storeDB.creatorInvites.find(i=>i.applicationId===a.id&&['Ready','Used'].includes(ciStatus(i)));if(active)throw new Error('This application has an active or used invite. Revoke an unused code before changing the approval.')}a.status=v.outcome;a.history??=[];a.history.unshift({status:v.outcome,actor:session.name,time:new Date().toISOString(),note:v.reason.trim()})}else i=ciCreate({...v,applicationId:f.dataset.application||null});ciCommit();audit(a?'Creator application '+v.outcome:'Creator invite created',a?.id||i.id);render();if(i)ciView(i.id);else applicationView(a.id);toast(i?'Invite code ready to share.':'Decision saved.')}catch(err){storeDB.creatorInvites=before;if(a&&old)Object.assign(a,old);f.querySelector('#ciError').textContent=err.message}},true);
window.addEventListener('change',e=>{if(e.target.closest('#ciDecisionForm')&&e.target.name==='outcome'){e.target.form.querySelector('button[type="submit"]').textContent=e.target.value==='Approved'?'Approve & create invite code':'Save decision'}},true);

function rvPlatform(platform){const p=String(platform||'').toLowerCase().replace(/[^a-z]/g,'');return ({xtwitter:'x',twitter:'x',youtube:'youtube',tiktok:'tiktok',instagram:'instagram',facebook:'facebook',spotify:'spotify',twitch:'twitch',kick:'kick'})[p]||p}
function rvLogo(platform){const key=rvPlatform(platform),svg=REVIEW_SOCIAL_LOGOS[key];return svg?`<span class="rv-social-logo rv-${key}"><img src="data:image/svg+xml;base64,${svg}" alt="${esc(platform)} logo"></span>`:`<span class="rv-social-logo">${icon('link')}</span>`}
function rvSocial(s,compact=false){const url=safePublicLink(s.url);const inside=`${rvLogo(s.platform)}${compact?'':`<span><b>${esc(s.platform)}</b><small>${esc(s.handle||s.url||'No handle supplied')}</small></span>${icon('external')}`}`;return url==='#'?`<span class="rv-social ${compact?'compact':''}" title="${esc(s.platform)}: no profile URL provided">${inside}</span>`:`<a class="rv-social ${compact?'compact':''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(s.platform)} profile for ${esc(s.handle||'creator')}">${inside}</a>`}
function rvButton(label,action,id='',cls='small',extra=''){return `<button class="button ${cls}" type="button" data-rv="${action}" data-id="${esc(id)}" ${extra}>${label}</button>`}
let rvApplicationFilter='All',rvApplicationSearch='',rvApplicationPage=1,rvIdentityTab='claims',rvClaimSearch='',rvClaimFilter='All';
function rvAppRows(){return db.applications.filter(a=>(rvApplicationFilter==='All'||(rvApplicationFilter==='Awaiting review'?['Submitted','In review'].includes(a.status):a.status===rvApplicationFilter))&&[a.name,a.email,a.brand,a.id,a.answers?.['Public / creator name']].join(' ').toLowerCase().includes(rvApplicationSearch.toLowerCase()))}
function rvAppResults(){const rows=rvAppRows(),pages=Math.max(1,Math.ceil(rows.length/8));rvApplicationPage=Math.min(pages,rvApplicationPage);return `<div class="table-wrap"><table class="rv-table"><thead><tr><th>Creator</th><th>Social profiles</th><th>Submitted</th><th>Status</th><th><span class="sr-only">Action</span></th></tr></thead><tbody>${rows.slice((rvApplicationPage-1)*8,rvApplicationPage*8).map(a=>`<tr><td><button class="rv-person" data-rv="application" data-id="${esc(a.id)}">${avatar(a)}<span><b>${esc(a.brand||a.answers?.['Public / creator name']||a.name)}</b><small>${esc(a.name)} · ${esc(a.country||a.region||'Location not provided')}</small></span></button></td><td><div class="rv-social-strip">${(a.socials||[]).map(s=>rvSocial(s,true)).join('')||'<span class="muted">Not provided</span>'}</div></td><td><span class="rv-date">${dateLabel(a.submitted)}</span><small class="cell-sub">${esc(a.id)}</small></td><td>${badge(a.status)}</td><td>${rvButton(a.status==='Approved'?'View application':'Review application','application',a.id)}</td></tr>`).join('')||`<tr><td colspan="5">${empty('No applications found','Try another filter or search.')}</td></tr>`}</tbody></table></div><div class="rv-pagination"><span>${rows.length?((rvApplicationPage-1)*8+1):0}–${Math.min(rvApplicationPage*8,rows.length)} of ${rows.length} applications</span><div>${rvButton('Previous','app-prev','','small',rvApplicationPage<=1?'disabled':'')}<span>${rvApplicationPage} / ${pages}</span>${rvButton('Next','app-next','','small',rvApplicationPage>=pages?'disabled':'')}</div></div>`}
applicationsPage=function(){const rows=db.applications,counts=[['Awaiting review',rows.filter(a=>['Submitted','In review'].includes(a.status)).length,'Ready for a decision','lavender'],['Approved',rows.filter(a=>a.status==='Approved').length,'Signup access approved','blue'],['Changes requested',rows.filter(a=>a.status==='Changes requested').length,'Waiting on creators','peach']];return `<div class="rv-page">${intro('Creator applications','Meet the creators who want to join Merchrix.',ciButton('Invite a creator','new','','primary'))}<div class="rv-summary">${counts.map(([name,n,note,tone])=>`<button class="rv-summary-card ${tone}" data-rv="app-filter" data-value="${name}"><span>${name}</span><strong>${n}</strong><small>${note} ${icon('arrow')}</small></button>`).join('')}</div><section class="panel rv-directory">${tabs('users','applications')}<div class="rv-toolbar"><div class="rv-filter-tabs">${['All','Awaiting review','Approved','Changes requested','Rejected'].map(s=>`<button data-rv="app-filter" data-value="${s}" aria-pressed="${rvApplicationFilter===s}">${s}</button>`).join('')}</div><label class="search-field">${icon('search')}<input id="rvAppSearch" type="search" value="${esc(rvApplicationSearch)}" placeholder="Search creator or email" aria-label="Search creator applications"></label></div><div id="rvAppResults">${rvAppResults()}</div></section></div>`};
function rvSection(title,subtitle,content,cls=''){return `<section class="panel rv-section ${cls}"><header><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:''}</header><div class="rv-section-body">${content}</div></section>`}
function rvFact(label,value){return `<div class="rv-fact"><small>${label}</small><b>${esc(value||'Not provided')}</b></div>`}
