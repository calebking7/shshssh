reservationsPage=function(){const claims=db.usernameClaims,reserved=rvIdentityTab==='reserved';return `<div class="rv-page ri-directory">${intro('Reserved identities','Protect public usernames and verify who is entitled to claim them.',reserved?v8button('Add reservation','reservation-new'):'')}<div class="ri-directory-note">${icon('shield')}<p>A reservation protects a username for a specific person or brand. Review claims against that identity before granting access.</p></div><div class="rv-switch">${rvButton('Ownership claims','identity-tab','claims',reserved?'small':'primary small')}${rvButton('Reserved usernames','identity-tab','reserved',reserved?'primary small':'small')}</div>${reserved?`<section class="panel rv-directory">${tabs('users','usernames')}${advancedTable('usernames',db.usernames,{cols:['name','owner','status'],cell:(r,k)=>k==='name'?`<div class="ri-reserved-cell"><span class="ri-shield-small">${icon('shield')}</span><span><b>@${esc(r.name)}</b><small>${esc(r.kind||'Public identity')}</small></span></div>`:k==='owner'?`<b>${esc(r.reservedFor||r.owner)}</b><small class="cell-sub">${r.claimId?'Ownership claim approved':'Reserved identity'}</small>`:badge(r.claimId?'Claimed · protected':r.status),action:r=>v8button('View reservation','reservation',r.id)})}</section>`:`<div class="rv-summary">${[['Awaiting review',claims.filter(c=>['Submitted','Under review'].includes(c.status)).length,'Review identity and ownership evidence','lavender'],['More proof requested',claims.filter(c=>c.status==='More information requested').length,'Reservation remains protected','peach'],['Ownership confirmed',claims.filter(c=>c.status==='Approved').length,'Approved claims to reserved identities','blue']].map(([label,n,note,color])=>`<div class="rv-summary-card ${color}"><span>${label}</span><strong>${n}</strong><small>${note}</small></div>`).join('')}</div><section class="panel rv-directory">${tabs('users','usernames')}<div class="rv-toolbar"><label class="search-field">${icon('search')}<input id="rvClaimSearch" type="search" placeholder="Search reserved name or claimant" aria-label="Search reserved identity claims" value="${esc(rvClaimSearch)}"></label><select id="rvClaimFilter" aria-label="Claim status">${['All','Submitted','Under review','More information requested','Approved','Declined'].map(s=>`<option ${rvClaimFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="rvClaimResults">${rvClaimResults()}</div></section>`}</div>`};
rvClaimScreen=function(id){const c=db.usernameClaims.find(c=>c.id===id);if(!c)return intro('Claim unavailable','This ownership claim could not be found.');const r=riReservation(c),person=riPublicName(c),rep=riRepresentative(c),checks=riChecks(c),blocked=riBlocking(c),terminal=['Approved','Declined'].includes(c.status),ready=!blocked&&checks.every(x=>x.ok)&&c.documents.length>0;return `<div class="rv-page ri-page"><a class="rv-back" href="#users/usernames">${icon('back')} Ownership claims</a><div class="rv-review-heading"><div><p class="eyebrow">RESERVED IDENTITY REVIEW</p><h2>Who is entitled to @${esc(c.requested)}?</h2><p>${esc(c.id)} · Submitted ${dateLabel(c.submitted)} </p></div>${badge(c.status)}</div><div class="ri-reservation-hero"><span class="ri-hero-shield">${icon('shield')}</span><div><span>RESERVED FOR</span><h2>${esc(person)}</h2><p>@${esc(c.requested)}</p></div><div class="ri-hero-state">${badge(r?.claimId?'Ownership confirmed':'Protected reservation')}<small>${r?.claimId?'Ownership decision recorded':'Unavailable to unverified claimants'}</small></div></div><div class="rv-review-layout"><div class="rv-review-main">${rvSection('The person behind this claim',rep?'Submitting on behalf of the reserved identity.':'The claimant says they are the person this username is reserved for.',`<div class="ri-claimant"><div class="rv-identity">${avatar({name:c.claimant},'hero')}<div><h3>${esc(c.claimant)}</h3><p>${esc(c.email)}</p><span>${rep?'Representative of '+esc(person):'Claiming as '+esc(person)}</span></div></div><span class="badge">${rep?'Representative':'Self claim'}</span></div><div class="ri-comparison"><div>${rvFact('Intended owner',person)}</div><div>${rvFact('Submitted identity name',c.claimant)}</div></div><div class="ri-important">${icon('shield')}<p>${rep?'Confirm both the representative’s identity and their authority to act for '+esc(person)+'. The reserved identity stays with '+esc(person)+'.':'A matching name alone is not sufficient. Verify that the claimant is the actual '+esc(person)+' through identity and official-account evidence.'}</p></div>`)}${rvSection('Evidence of entitlement','Review the connection to the reserved identity, not just the existence of an account.',`<div class="ri-check-list">${checks.map((x,index)=>`<div class="ri-check-item"><span class="ri-check-number ${x.ok?'ok':x.status==='Does not match'?'bad':''}">${x.ok?icon('check'):index+1}</span><div><h4>${esc(x.label)}</h4><p>${esc(x.detail)}</p></div><span class="ri-evidence-pill ${x.ok?'ready':x.status==='Does not match'?'problem':''}">${esc(x.status)}</span></div>`).join('')}</div>${c.channel==='Connected'?`<div class="ri-connected">${rvLogo(c.platform)}<div><b>${esc(c.platform)} connection</b><p>${esc(c.handle)}</p></div>${c.url&&safePublicLink(c.url)!=='#'?`<a class="text-btn" href="${esc(safePublicLink(c.url))}" target="_blank" rel="noopener noreferrer">Open profile ${icon('external')}</a>`:''}</div>`:''}<p class="rv-helper">${c.demo?'Review identity and official-account evidence before recording an ownership decision.':'Verification results are supplied by the identity and connected-account services.'}</p>`)}${rvSection(rep?'Authority & supporting proof':'Supporting proof','Open the evidence and check that it supports this reserved identity.',`<p class="ri-evidence-note">${esc(c.authorityNote)}</p><div class="rv-documents">${c.documents.map((d,i)=>`<button class="rv-document" data-rv="claim-file" data-id="${esc(c.id)}" data-index="${i}"><span class="rv-file-icon">${icon('file')}</span><span><b>${esc(d.name)}</b><small>${esc(d.kind)}</small></span>${icon('external')}</button>`).join('')||'<div class="rv-evidence-empty">No supporting proof has been submitted. Request evidence before approving.</div>'}</div>`)}${rvSection('Review history','Ownership decisions and requests for additional proof.',[...c.history].reverse().map(h=>`<div class="rv-event"><span class="rv-event-dot"></span><div><b>${esc(h.status)}</b><p>${esc(h.note)}</p><small>${esc(h.actor)} · ${dateLabel(h.time,true)}</small></div></div>`).join(''))}</div><aside class="rv-review-aside">${rvSection('Ownership decision','Is this claimant entitled to this reserved identity?',terminal?`<div class="ri-final ${c.status==='Approved'?'approved':''}">${icon(c.status==='Approved'?'check':'shield')}<h3>${c.status==='Approved'?'Ownership confirmed':'Claim declined'}</h3><p>${c.status==='Approved'?`@${esc(c.requested)} remains protected for ${esc(person)}. ${rep?'The claimant’s authority to represent this identity has been recorded.':'The claimant has been confirmed as the intended owner.'}`:`@${esc(c.requested)} remains reserved for ${esc(person)}. This claimant has not been granted access.`}</p></div>`:`<form id="rvClaimDecisionForm" data-id="${esc(c.id)}">${blocked?`<div class="ri-blocked">${icon('warning')}<p>${esc(blocked)}</p></div>`:!ready?'<div class="ri-pending">Some ownership evidence is missing. Request the specific proof needed to continue.</div>':''}<div class="ri-decisions"><label><input type="radio" name="decision" value="Approved" ${ready?'':'disabled'} required><span><b>Approve ownership claim</b><small>Confirm entitlement to this reservation.</small></span></label><label><input type="radio" name="decision" value="More information requested" required><span><b>Request more proof</b><small>Keep the reservation protected.</small></span></label><label><input type="radio" name="decision" value="Declined" required><span><b>Decline claim</b><small>The claimant gets no access to the handle.</small></span></label></div><div id="riApprovalChecks" hidden><label class="rv-check"><input type="checkbox" name="identity"><span>I confirm the identity evidence establishes ${rep?'who is representing '+esc(person):'that this is the actual '+esc(person)}.</span></label><label class="rv-check"><input type="checkbox" name="channel"><span>I confirmed that the official-account evidence belongs to ${esc(person)}.</span></label><label class="rv-check"><input type="checkbox" name="authority"><span>${rep?'I verified authorization to claim on behalf of '+esc(person)+'.':'I reviewed supporting proof of ownership of this public identity.'}</span></label></div>${field('note','Decision note','','textarea',null,true)}<p class="rv-helper">Record the evidence supporting your decision, or the exact proof still needed.</p><p id="rvClaimError" class="error-message" role="alert"></p><button type="submit" class="button primary rv-full" id="riDecisionSubmit">Save ownership decision</button></form>`)}<div class="ri-protection-note">${icon('shield')}<div><b>The reservation stays protected</b><p>Approval confirms the rightful claimant. Declining or requesting more proof does not release this username to anyone else.</p></div></div></aside></div></div>`};
rvApplyClaimDecision=function(c,v){if(!session||!canCollection('usernames','write')||emptyPreview)throw new Error('You do not have permission to review reserved identities.');if(['Approved','Declined'].includes(c.status))throw new Error('This ownership claim already has a final decision.');if(!['Under review','More information requested','Approved','Declined'].includes(v.decision))throw new Error('Choose an ownership decision.');if(!String(v.note||'').trim())throw new Error('Add a note explaining the ownership decision.');if(v.decision==='Approved'){const blocking=riBlocking(c);if(blocking)throw new Error(blocking);if(!riChecks(c).every(x=>x.ok)||!c.documents.length||!v.identity||!v.channel||!v.authority)throw new Error('Verify the claimant’s entitlement to the reserved identity and complete all approval checks.');const r=riReservation(c);r.reservedFor??=r.owner;r.claimId=c.id;r.status='Protected';r.claimedBy={claimId:c.id,claimant:c.claimant,userId:c.userId||null,capacity:riRepresentative(c)?'Authorized representative':'Reserved person',confirmedAt:new Date().toISOString()};r.history??=[];r.history.push({status:'Ownership claim approved',actor:session.name,time:new Date().toISOString(),note:v.note.trim()});c.ownershipConfirmed=true;c.reservationId=r.id;}c.status=v.decision;c.history.push({status:v.decision,actor:session.name,time:new Date().toISOString(),note:v.note.trim()});return c};
window.addEventListener('change',e=>{const f=e.target.closest('#rvClaimDecisionForm');if(!f||e.target.name!=='decision')return;const approved=e.target.value==='Approved',checks=document.getElementById('riApprovalChecks');if(checks)checks.hidden=!approved;const label=({Approved:'Approve ownership claim','More information requested':'Request more proof',Declined:'Decline claim'})[e.target.value];document.getElementById('riDecisionSubmit').textContent=label||'Save ownership decision';f.querySelectorAll('[name=identity],[name=channel],[name=authority]').forEach(x=>{x.required=approved;if(!approved)x.checked=false})},true);
parseRoute();
</script>
<script>

],scores:[

try{const saved=JSON.parse(localStorage.getItem(mxOpsKey)||'null');if(saved&&Array.isArray(saved.questions)&&Array.isArray(saved.scores))mxOps=saved}catch{}
let mxFlarePeriod='Weekly',mxRepTab='Squads',mxSelectedSquadId='',mxQuestionScopeFilter='all',mxQuestionSearchTerm='',mxQuestionStatusFilter='All statuses',mxQuestionCategoryFilter='All categories';
let mxSelectedQuestions=new Set();
let mxQuestionDraft={category:'Squad Knowledge',format:'Multiple choice',creatorIds:[],targetSquads:[],options:['','','',''],correctAnswer:0,trueFalseAnswer:'True',imageData:''};
const mxSave=()=>{try{localStorage.setItem(mxOpsKey,JSON.stringify(mxOps))}catch{}};
const mxEsc=esc;
function mxSquads(){return (typeof db!=='undefined'&&Array.isArray(db.squads)?db.squads:[])}
function mxUsers(){return (typeof db!=='undefined'&&Array.isArray(db.users)?db.users:[])}
function mxCreators(){return mxUsers().filter(p=>p.role==='Creator').sort((a,b)=>a.name.localeCompare(b.name))}
function mxFindSquad(idOrName){return mxSquads().find(s=>s.id===idOrName||s.name===idOrName)}
function mxSquadPicture(s,cls=''){const raw=s?.image||s?.imageUrl||s?.coverImage||s?.photo||s?.avatarImage||s?.avatar||'';const src=(typeof raw==='string'?(ASSETS?.[raw]||raw):'');if(src&&(/^(https?:|data:image\/|blob:|\/)/i).test(src))return `<img class="mx-squad-picture ${cls}" src="${esc(src)}" alt="${esc(s.name||'Squad')}" loading="lazy">`;return `<span class="mx-squad-picture ${cls}" aria-label="${esc(s?.name||'Squad')}">${esc((s?.name||'SQ').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`}
function mxQuestionTargetList(q){if(Array.isArray(q.targetSquads))return q.targetSquads;if(q.squad&&q.squad!=='All squads')return [q.squad];return []}
function mxQuestionCreatorNames(q){return (q.creatorIds||[]).map(id=>mxCreators().find(p=>p.id===id)).filter(Boolean)}
function mxQuestionAppliesToSquad(q,squad){const targets=mxQuestionTargetList(q);return !targets.length||targets.includes(squad.id)||targets.includes(squad.name)}
function mxQuestionsForSquad(squad){return mxOps.questions.filter(q=>mxQuestionAppliesToSquad(q,squad))}
function mxSquadScores(squad){return mxOps.scores.filter(u=>u.squad===squad.name)}
function mxPerformance(squad){const members=mxSquadScores(squad),attempts=members.reduce((n,u)=>n+(Number(u.rounds)||0),0),accuracy=members.length?Math.round(members.reduce((n,u)=>n+(Number(u.correct)||0),0)/members.length):0,questions=mxQuestionsForSquad(squad);return {members,attempts,accuracy,questions,published:questions.filter(q=>q.status==='Published').length,active:members.length}}
function mxMetric(label,value,note,color=''){return `<div class="panel metric ${color}"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`}
function mxSquadCard(s){const p=mxPerformance(s),creator=mxUsers().find(u=>u.name===s.creator)||{name:s.creator||'Creator'};return `<article class="panel mx-squad-card"><div class="mx-squad-cover">${mxSquadPicture(s)}</div><div class="mx-squad-main"><div class="mx-squad-head"><div class="mx-squad-title"><div><h3>${esc(s.name)}</h3><p>${Number(s.members||0).toLocaleString()} members · ${esc(s.status||'Active')}</p></div></div><div class="mx-squad-question-count"><strong>${p.questions.length}</strong><span>Questions</span></div></div><div class="mx-squad-creator">${avatar(creator,'small')}<span>Creator: <b>${esc(s.creator||'Not assigned')}</b></span></div><div class="mx-squad-metrics"><div><span>Published</span><strong>${p.published}</strong></div><div><span>Rounds completed</span><strong>${p.attempts.toLocaleString()}</strong></div><div><span>Avg. accuracy</span><strong>${p.active?p.accuracy+'%':'—'}</strong></div></div><div class="mx-squad-actions"><button class="button primary" data-mx="view-squad" data-id="${esc(s.id)}">View performance ${icon('arrow-right')}</button><button class="button" data-mx="manage-squad-questions" data-id="${esc(s.id)}">Manage questions</button></div></div></article>`}
function mxSquadOverview(){const query=(document.getElementById('mxSquadSearch')?.value||'').trim().toLowerCase();const squads=mxSquads().filter(s=>[s.name,s.creator,s.id].join(' ').toLowerCase().includes(query));return `<section class="panel"><div class="mx-section-heading between"><div><h3>Squad performance</h3><p>Review each squad’s question coverage, participation and answer accuracy.</p></div><span class="badge">${mxSquads().length} squads</span></div><div class="mx-squad-filter"><label class="search-field">${icon('search')}<input id="mxSquadSearch" type="search" value="${esc(query)}" placeholder="Search squads or creators" aria-label="Search squads"></label><span class="muted small-text">${squads.length} results</span></div><div class="mx-squad-grid" style="padding:0 20px 20px">${squads.map(mxSquadCard).join('')||`<div class="mx-no-results"><h3>No squads found</h3><p>Try a different squad or creator name.</p></div>`}</div></section>`}
function mxSquadDetail(){const s=mxSquads().find(x=>x.id===mxSelectedSquadId)||mxFindSquad(mxSelectedSquadId);if(!s){mxRepTab='Squads';return mxSquadOverview()}const p=mxPerformance(s),creator=mxUsers().find(u=>u.name===s.creator)||{name:s.creator||'Creator'},categories=mxQuestionCategories.map(c=>({name:c,count:p.questions.filter(q=>(q.category||'Quick Check')===c).length}));const top=[...p.members].sort((a,b)=>(Number(b.correct)||0)-(Number(a.correct)||0));return `<button class="back" data-mx="back-to-squads">${icon('arrow-left')} Back to all squads</button><section class="panel"><div class="mx-performance-hero">${mxSquadPicture(s)}<div class="mx-performance-copy"><div class="eyebrow">SQUAD PERFORMANCE</div><h2>${esc(s.name)}</h2><p>${Number(s.members||0).toLocaleString()} members · Led by ${esc(s.creator||'No creator assigned')}</p></div><div class="mx-performance-actions"><button class="button" data-mx="manage-squad-questions" data-id="${esc(s.id)}">Manage questions</button><button class="button primary" data-mx="add-question">${icon('plus')} Add question</button></div></div></section><div class="grid four" style="margin-top:18px">${mxMetric('Questions assigned',p.questions.length,`${p.published} published`,'lavender')}${mxMetric('Rounds completed',p.attempts.toLocaleString(),'Across tracked members','peach')}${mxMetric('Average accuracy',p.active?p.accuracy+'%':'—',p.active?'Across tracked members':'No answers recorded','blue')}${mxMetric('Members assessed',p.active.toLocaleString(),'With Rep Check activity','gray')}</div><div class="mx-detail-layout" style="margin-top:18px"><section class="panel mx-detail-panel"><div class="panel-heading"><div><h3>Question coverage</h3><p>Question counts by category</p></div></div><div class="panel-body"><div class="mx-performance-chart">${categories.map(c=>`<div class="mx-performance-row"><span>${esc(c.name)}</span><div class="progress"><span style="width:${p.questions.length?Math.round(c.count/p.questions.length*100):0}%"></span></div><strong>${c.count}</strong></div>`).join('')}</div><div class="form-actions"><button class="button" data-mx="manage-squad-questions" data-id="${esc(s.id)}">Open question bank</button></div></div></section><section class="panel mx-detail-panel"><div class="panel-heading"><div><h3>Creator and squad</h3><p>Squad ownership and membership</p></div></div><div class="panel-body"><div class="list-item">${avatar(creator)}<div><b>${esc(s.creator||'Not assigned')}</b><small>Squad creator</small></div><span class="badge">${esc(s.status||'Active')}</span></div><div class="kv"><span>Squad ID</span><span>${esc(s.id||'—')}</span></div><div class="kv"><span>Total members</span><span>${Number(s.members||0).toLocaleString()}</span></div><div class="kv"><span>Published questions</span><span>${p.published}</span></div><div class="kv"><span>Draft questions</span><span>${p.questions.length-p.published}</span></div><div class="kv"><span>Tracked participation</span><span>${p.active} member${p.active===1?'':'s'}</span></div></div></section></div><section class="panel" style="margin-top:18px"><div class="panel-heading"><div><h3>Member performance</h3><p>Rounds completed, answer accuracy and last recorded activity.</p></div><button class="button small" data-mx="export-squad-members" data-id="${esc(s.id)}">Export CSV</button></div>${mxMemberTable(top,s.name)}</section>`}
function mxMemberTable(users,onlySquad=''){return `<div class="table-wrap"><table><thead><tr><th>Member</th><th>Squad</th><th>Rounds completed</th><th>Accuracy</th><th>Last active</th></tr></thead><tbody>${users.map(u=>{const p=mxUsers().find(x=>x.name===u.user)||{name:u.user};return `<tr><td><div class="mx-member-cell">${avatar(p,'small')}<span><b>${esc(u.user)}</b></span></div></td><td>${esc(u.squad)}</td><td>${Number(u.rounds||0).toLocaleString()}</td><td><div class="mx-accuracy"><div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(u.correct)||0))}%"></span></div><strong>${Number(u.correct)||0}%</strong></div></td><td>${esc(u.updated||'—')}</td></tr>`}).join('')||`<tr><td colspan="5"><div class="mx-no-results"><h3>No member activity yet</h3><p>Member performance will appear after Rep Check attempts are recorded.</p></div></td></tr>`}</tbody></table></div>`}
function mxQuestionCategoryOptions(){return mxQuestionCategories.map(c=>`<option value="${esc(c)}" ${mxQuestionDraft.category===c?'selected':''}>${esc(c)}</option>`).join('')}
function mxQuestionFormatOptions(){return mxQuestionFormats.map(f=>`<option value="${esc(f)}" ${mxQuestionDraft.format===f?'selected':''}>${esc(f)}</option>`).join('')}
function mxSelectedCreatorMarkup(){return mxQuestionDraft.creatorIds.map(id=>mxCreators().find(p=>p.id===id)).filter(Boolean).map(p=>`<span class="mx-selected-chip">${esc(p.name)} <button type="button" data-mx="remove-creator" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join('')}
function mxCreatorResultMarkup(query=''){const selected=new Set(mxQuestionDraft.creatorIds),needle=query.trim().toLowerCase();const rows=mxCreators().filter(p=>[p.name,p.handle,p.email,p.id,p.category].join(' ').toLowerCase().includes(needle)).slice(0,8);return rows.map(p=>`<button type="button" class="mx-picker-option ${selected.has(p.id)?'selected':''}" data-mx="toggle-creator" data-id="${esc(p.id)}">${avatar(p,'small')}<span class="mx-picker-option-copy"><b>${esc(p.name)}</b><small>@${esc(p.handle||'no username')} · ${esc(p.category||'Creator')}</small></span>${icon(selected.has(p.id)?'check':'plus')}</button>`).join('')||`<div class="mx-picker-empty">No creators match this search.</div>`}
function mxSquadResultMarkup(query=''){const selected=new Set(mxQuestionDraft.targetSquads),needle=query.trim().toLowerCase();const rows=mxSquads().filter(s=>[s.name,s.creator,s.id].join(' ').toLowerCase().includes(needle)).slice(0,8);return rows.map(s=>`<button type="button" class="mx-picker-option ${selected.has(s.id)||selected.has(s.name)?'selected':''}" data-mx="toggle-target-squad" data-id="${esc(s.id)}">${mxSquadPicture(s,'small')}<span class="mx-picker-option-copy"><b>${esc(s.name)}</b><small>${esc(s.creator||'No creator assigned')} · ${Number(s.members||0).toLocaleString()} members</small></span>${icon(selected.has(s.id)||selected.has(s.name)?'check':'plus')}</button>`).join('')||`<div class="mx-picker-empty">No squads match this search.</div>`}
function mxSelectedSquadChips(){return mxQuestionDraft.targetSquads.map(id=>mxFindSquad(id)).filter(Boolean).map(s=>`<span class="mx-selected-chip">${esc(s.name)} <button type="button" data-mx="remove-target-squad" data-id="${esc(s.id)}" aria-label="Remove ${esc(s.name)}">×</button></span>`).join('')}
function mxQuestionTargetMarkup(){const cat=mxQuestionDraft.category;return `${cat==='Creator Knowledge'?`<div class="mx-field-section"><label class="mx-field-label">Creator knowledge target <span class="muted">(required)</span></label><p class="mx-picker-helper" style="margin:0 0 10px">Search by creator name, username or email. Select one or more creators.</p><div class="mx-picker"><div class="mx-picker-search"><input id="mxCreatorSearch" type="search" placeholder="Search hundreds of creators…" autocomplete="off" aria-label="Search creators"></div><div class="mx-picker-results" id="mxCreatorResults">${mxCreatorResultMarkup('')}</div><div class="mx-selected-chips" id="mxCreatorSelected">${mxSelectedCreatorMarkup()||'<span class="muted small-text">No creators selected</span>'}</div></div></div>`:''}<div class="mx-field-section"><label class="mx-field-label">${cat==='Squad Knowledge'?'Question squad scope':'Available to squads'}</label><p class="mx-picker-helper">Select one or more squads, or leave the selection empty to make the question available to every squad.</p><div class="mx-picker"><div class="mx-picker-search"><input id="mxSquadTargetSearch" type="search" placeholder="Search squads or creators…" autocomplete="off" aria-label="Search squads for targeting"></div><div class="mx-picker-results mx-squad-results" id="mxSquadTargetResults">${mxSquadResultMarkup('')}</div><div class="mx-selected-chips" id="mxTargetSquadsSelected">${mxSelectedSquadChips()||'<span class="muted small-text">All squads</span>'}</div></div></div>`}
function mxOptionRows(){return `<div class="mx-option-editor">${mxQuestionDraft.options.map((v,i)=>`<div class="mx-option-row"><span class="mx-option-number">${i+1}</span><input type="text" data-mx-option-index="${i}" value="${esc(v)}" placeholder="Option ${i+1}" aria-label="Answer option ${i+1}" maxlength="180"><button type="button" class="icon-btn" data-mx="remove-option" data-index="${i}" aria-label="Remove option ${i+1}" ${mxQuestionDraft.options.length<=2?'disabled':''}>${icon('trash')}</button></div>`).join('')}</div><button type="button" class="button small" data-mx="add-option" ${mxQuestionDraft.options.length>=8?'disabled':''}>${icon('plus')} Add answer option</button>`}
function mxQuestionResponseMarkup(){const f=mxQuestionDraft.format;const description={
 'Multiple choice':'Create as many answer choices as needed and mark the correct response. The answer key is stored with the question.',
 'Typed/free-text answers':'Add an expected answer and accepted alternatives. Responses can be typed instead of choosing from options.',
 'True or false':'Set the expected truth value for a statement.',
 'Image identification':'Attach an image and specify the person, project, song, or moment participants should identify.',
 'Which came first?':'Enter two moments or releases, then select the one that happened first.',
 'Ordering/chronology':'List the events in the correct order, one per line.',
 'Identify the song, project, person or moment':'Enter the expected identification and any accepted aliases.',
 'Career timeline questions':'Enter the expected timeline answer and any accepted alternatives.',
 'Collaboration questions':'Record accepted collaborators, project names or other valid responses.',
 'Fandom culture and lore':'Define the accepted answer and add any context required for review.',
 'Visual recognition':'Attach the visual reference and enter the identity participants should recognize.',
 'Current/recent fandom knowledge':'Specify the current answer and add context or a reference date for review.',
 'Merchrix/Squad memory questions':'Enter the expected answer and any accepted alternatives from squad or platform history.',
 'Other structured formats':'Describe the expected response structure and how the answer should be evaluated.'}[f]||'Configure the expected answer for this question.';
 let body='';
 if(f==='Multiple choice'){body=`<h4>Answer choices</h4><p>${description}</p>${mxOptionRows()}<label class="field" style="margin-top:15px">Correct answer<select name="correctAnswer">${mxQuestionDraft.options.map((v,i)=>`<option value="${i}" ${mxQuestionDraft.correctAnswer===i?'selected':''}>${v.trim()?esc(v.trim()):'Option '+(i+1)}</option>`).join('')}</select></label>`}
 else if(f==='True or false'){body=`<h4>Correct response</h4><p>${description}</p><label class="field">Correct answer<select name="trueFalseAnswer"><option ${mxQuestionDraft.trueFalseAnswer==='True'?'selected':''}>True</option><option ${mxQuestionDraft.trueFalseAnswer==='False'?'selected':''}>False</option></select></label>`}
 else if(f==='Which came first?'){body=`<h4>Compare two moments</h4><p>${description}</p><div class="form-grid"><label class="field">Moment or release A<input name="timelineItemA" required maxlength="180" placeholder="Enter the first item"></label><label class="field">Moment or release B<input name="timelineItemB" required maxlength="180" placeholder="Enter the second item"></label><label class="field full">Which happened first?<select name="firstItem"><option value="A">Moment A</option><option value="B">Moment B</option></select></label></div>`}
 else if(f==='Ordering/chronology'){body=`<h4>Correct order</h4><p>${description}</p><label class="field">Events in chronological order<textarea name="orderedItems" rows="5" required placeholder="First event\nSecond event\nThird event"></textarea><small>One event per line. The order entered here becomes the reference sequence.</small></label>`}
 else if(f==='Image identification'||f==='Visual recognition'){body=`<h4>Visual reference</h4><p>${description}</p><div class="mx-upload-preview" id="mxQuestionImagePreview">${mxQuestionDraft.imageData?`<img src="${esc(mxQuestionDraft.imageData)}" alt="Question image preview">`:'<span>No image attached</span>'}</div><label class="upload-area" style="margin-bottom:14px"><span class="icon">${icon('image')}</span><b>Upload reference image</b><span>PNG, JPG, WEBP · up to 5 MB</span><small>Or enter an image URL below.</small><input id="mxQuestionImageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Image URL (optional)<input name="imageUrl" type="url" placeholder="https://…"></label><label class="field">Expected identification<input name="expectedAnswers" required placeholder="Person, song, project or moment"></label><label class="field">Accepted alternatives (optional)<textarea name="acceptedAlternatives" rows="2" placeholder="One accepted alias per line"></textarea></label>`}
 else {const required=f!=='Other structured formats';body=`<h4>Expected response</h4><p>${description}</p><label class="field">Expected answer${required?'':' / scoring guidance'}<textarea name="expectedAnswers" rows="3" ${required?'required':''} placeholder="Enter the answer or accepted alternatives, one per line"></textarea><small>For several accepted responses, put each one on a new line.</small></label><label class="field">Evaluation guidance${f==='Other structured formats'?' (required)':' (optional)'}<textarea name="guidance" rows="3" ${f==='Other structured formats'?'required':''} placeholder="Describe what counts as a correct response"></textarea></label>`}
 return `<div class="mx-question-response" id="mxQuestionResponseBlock"><h4>Response setup</h4>${body}</div>`}
function mxQuestionForm(){mxQuestionDraft={category:'Squad Knowledge',format:'Multiple choice',creatorIds:[],targetSquads:[],options:['','','',''],correctAnswer:0,trueFalseAnswer:'True',imageData:''};openDialog('Add Rep Check question','Set the category, answer format and audience for this question.',`<form id="mxAddQuestionForm" class="mx-question-form"><div class="mx-question-form-intro">Create a question using the response format that fits the content. Answer choices are optional unless the selected format requires them. Question scoring is managed by the platform.</div><label class="field">Question category<select name="category" id="mxQuestionCategory" required>${mxQuestionCategoryOptions()}</select><small>Squad Knowledge, Creator Knowledge or Quick Check.</small></label><label class="field">Question prompt<textarea name="question" required maxlength="600" placeholder="Write the question participants will answer" rows="3"></textarea></label><label class="field">Question format<select name="format" id="mxQuestionFormat" required>${mxQuestionFormatOptions()}</select></label><div id="mxQuestionTarget">${mxQuestionTargetMarkup()}</div><div id="mxQuestionResponse">${mxQuestionResponseMarkup()}</div><label class="field">Initial status<select name="status"><option>Draft</option><option>Published</option></select></label><p id="mxQuestionError" class="error-message" role="alert"></p><div class="form-actions"><button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">Save question</button></div></form>`)}
function mxFilteredQuestions(){const q=mxQuestionSearchTerm.toLowerCase(),status=mxQuestionStatusFilter,category=mxQuestionCategoryFilter,scope=mxQuestionScopeFilter;return mxOps.questions.filter(x=>{const creators=mxQuestionCreatorNames(x).map(p=>[p.name,p.handle].join(' ')).join(' '),targets=mxQuestionTargetList(x).map(id=>mxFindSquad(id)?.name||id).join(' ');const text=[x.question,x.id,x.category,x.format,x.status,creators,targets].join(' ').toLowerCase();const statusOK=status==='All statuses'||x.status===status;const categoryOK=category==='All categories'||(x.category||'Quick Check')===category;const squadOK=scope==='all'||mxQuestionAppliesToSquad(x,mxFindSquad(scope)||{id:scope,name:scope});return statusOK&&categoryOK&&squadOK&&text.includes(q)})}
function mxQuestionRows(){const rows=mxFilteredQuestions(),allSelected=rows.length>0&&rows.every(q=>mxSelectedQuestions.has(q.id));return `<div class="mx-selection-bar"><label><input type="checkbox" id="mxSelectAllQuestions" ${allSelected?'checked':''} ${rows.length?'':'disabled'}> Select all ${rows.length} matching questions</label><div class="mx-selection-info"><span>${mxSelectedQuestions.size} selected</span><button type="button" class="button danger small" data-mx="delete-selected-questions" ${mxSelectedQuestions.size?'':'disabled'}>${icon('trash')} Delete selected</button></div></div><div class="table-wrap"><table class="mx-question-table"><thead><tr><th aria-label="Select"></th><th>Question</th><th>Category</th><th>Format</th><th>Audience</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>{const squadNames=mxQuestionTargetList(x).map(id=>mxFindSquad(id)?.name||id),creatorNames=mxQuestionCreatorNames(x).map(p=>p.name);const target=[...creatorNames,...(squadNames.length?squadNames:['All squads'])].join(' · ');return `<tr><td><input class="mx-question-check" type="checkbox" data-mx-select-question="${esc(x.id)}" aria-label="Select question ${esc(x.question)}" ${mxSelectedQuestions.has(x.id)?'checked':''}></td><td><div class="mx-question-title">${esc(x.question)}</div><small class="cell-sub">${esc(x.id)}</small></td><td><span class="badge purple">${esc(x.category||'Quick Check')}</span></td><td><span class="mx-question-format">${esc(x.format||'Multiple choice')}</span></td><td><span class="cell-title">${esc(target)}</span></td><td><span class="badge ${x.status==='Published'?'green':'orange'}">${esc(x.status||'Draft')}</span></td><td><div class="mx-question-actions"><button class="button small" data-mx="toggle-question" data-id="${esc(x.id)}">${x.status==='Published'?'Unpublish':'Publish'}</button><button class="button small danger" data-mx="delete-question" data-id="${esc(x.id)}" aria-label="Delete question">${icon('trash')}</button></div></td></tr>`}).join('')||`<tr><td colspan="7"><div class="mx-no-results"><h3>No questions found</h3><p>Try changing your search or filters, or add a new question.</p></div></td></tr>`}</tbody></table></div><div class="pagination"><span>Showing ${rows.length} of ${mxOps.questions.length} questions</span><span>Question scoring is managed by the platform.</span></div>`}
function mxQuestionBank(){return `<section class="panel"><div class="mx-section-heading between"><div><h3>Question bank</h3><p>Search, filter, publish or remove questions. Select multiple rows to delete them together.</p></div><button class="button primary" data-mx="add-question">${icon('plus')} Add question</button></div><div class="mx-question-toolbar"><label class="search-field">${icon('search')}<input id="mxQuestionSearch" type="search" value="${esc(mxQuestionSearchTerm)}" placeholder="Search questions, creators or squads" aria-label="Search questions"></label><select id="mxQuestionCategoryFilter" aria-label="Question category"><option ${mxQuestionCategoryFilter==='All categories'?'selected':''}>All categories</option>${mxQuestionCategories.map(c=>`<option ${mxQuestionCategoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="mxQuestionStatusFilter" aria-label="Question status"><option ${mxQuestionStatusFilter==='All statuses'?'selected':''}>All statuses</option><option ${mxQuestionStatusFilter==='Published'?'selected':''}>Published</option><option ${mxQuestionStatusFilter==='Draft'?'selected':''}>Draft</option></select><select id="mxQuestionTargetFilter" aria-label="Filter by squad"><option value="all" ${mxQuestionScopeFilter==='all'?'selected':''}>All squads</option>${mxSquads().map(s=>`<option value="${esc(s.id)}" ${mxQuestionScopeFilter===s.id||mxQuestionScopeFilter===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div id="mxQuestionRows">${mxQuestionRows()}</div></section>`}
function mxMemberPerformance(){const users=[...mxOps.scores].sort((a,b)=>(Number(b.correct)||0)-(Number(a.correct)||0));const avg=users.length?Math.round(users.reduce((n,u)=>n+(Number(u.correct)||0),0)/users.length):0;return `<div class="grid four">${mxMetric('Members assessed',users.length,'With recorded Rep Check activity','lavender')}${mxMetric('Rounds completed',users.reduce((n,u)=>n+(Number(u.rounds)||0),0).toLocaleString(),'Across tracked members','peach')}${mxMetric('Average accuracy',users.length?avg+'%':'—','Across tracked members','blue')}${mxMetric('Squads represented',new Set(users.map(u=>u.squad)).size,'With tracked activity','gray')}</div><section class="panel" style="margin-top:18px"><div class="panel-heading"><div><h3>Member performance</h3><p>Review participation and answer accuracy by member.</p></div><button class="button small" data-mx="export-users">Export CSV</button></div>${mxMemberTable(users)}</section>`}
function mxRepPage(){const qs=mxOps.questions,squads=mxSquads(),totalPublished=qs.filter(q=>q.status==='Published').length,scoreCount=mxOps.scores.length,rounds=mxOps.scores.reduce((n,u)=>n+(Number(u.rounds)||0),0);const topTab=mxRepTab==='SquadDetail'?'Squads':mxRepTab;return `${intro('Rep Check','Monitor question coverage and squad performance, then manage question formats from the question bank.',`<button class="button primary" data-mx="add-question">${icon('plus')} Add question</button>`)}<div class="grid four mx-rep-summary">${mxMetric('Squads',squads.length,'Squad question coverage','lavender')}${mxMetric('Total questions',qs.length,'Across all categories','peach')}${mxMetric('Published questions',totalPublished,'Available in Rep Check','blue')}${mxMetric('Rounds completed',rounds.toLocaleString(),`${scoreCount} members with recorded activity`,'gray')}</div><div class="mx-rep-tabs"><button class="tab ${topTab==='Squads'?'active':''}" data-mx="rep-tab" data-value="Squads">Squad overview</button><button class="tab ${topTab==='Questions'?'active':''}" data-mx="rep-tab" data-value="Questions">Question bank <span class="tab-count">${qs.length}</span></button><button class="tab ${topTab==='Members'?'active':''}" data-mx="rep-tab" data-value="Members">Member performance</button></div>${mxRepTab==='SquadDetail'?mxSquadDetail():mxRepTab==='Questions'?mxQuestionBank():mxRepTab==='Members'?mxMemberPerformance():mxSquadOverview()}`}
function mxDownload(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function mxFlarePage(){const vals=mxFlarePeriod==='Daily'?{sent:'1,284',avg:'53.5',peak:'146',change:'+8.4%'}:mxFlarePeriod==='Monthly'?{sent:'38,492',avg:'1,283',peak:'2,940',change:'+12.6%'}:{sent:'8,764',avg:'1,252',peak:'1,486',change:'+6.2%'};const labels=mxFlarePeriod==='Daily'?['8 AM','10 AM','12 PM','2 PM','4 PM','6 PM','8 PM']:mxFlarePeriod==='Monthly'?['Wk 1','Wk 2','Wk 3','Wk 4']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const bars=mxFlarePeriod==='Daily'?[35,48,68,44,82,100,64]:mxFlarePeriod==='Monthly'?[58,82,69,100]:[65,82,74,100,88,58,72];return `${intro('Flare analytics','Track Flare delivery volume, engagement trends and service performance. Message content and recipient details are not displayed.')}<div class="row wrap" style="justify-content:flex-end;margin:-12px 0 18px"><span class="muted small-text">Reporting period</span>${['Daily','Weekly','Monthly'].map(p=>`<button class="button small ${mxFlarePeriod===p?'primary':''}" data-mx="flare-period" data-value="${p}">${p}</button>`).join('')}<button class="button small" data-mx="flare-export">Export summary</button></div><div class="grid four">${mxMetric('Flares sent',vals.sent,vals.change+' vs previous period','lavender')}${mxMetric('Daily average',vals.avg,'Flares per day','peach')}${mxMetric('Peak activity',vals.peak,'Highest count in a day','blue')}${mxMetric('Delivery success','99.2%','Successful sends','gray')}</div><div class="grid chart-layout" style="margin-top:20px"><section class="panel"><div class="panel-heading"><div><h3>Flare sending volume</h3><p>Aggregate sends · ${mxFlarePeriod.toLowerCase()} view</p></div><span class="badge purple">App performance</span></div><div class="panel-body"><div style="height:230px;display:flex;align-items:end;gap:clamp(8px,2vw,22px);padding:12px 8px 0;border-bottom:1px solid var(--line)">${bars.map((v,i)=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:9px"><span class="small-text muted">${Math.round(v*vals.sent.replace(/,/g,'')/100)} </span><div title="${labels[i]} activity" style="width:min(100%,38px);height:${v}%;min-height:12px;border-radius:7px 7px 2px 2px;background:${i===bars.indexOf(Math.max(...bars))?'var(--purple)':'#dcd7ff'}"></div><small class="muted">${labels[i]}</small></div>`).join('')}</div><p class="muted small-text" style="margin-top:16px">Flare volume is summarized from delivery events for the selected reporting period.</p></div></section><section class="panel"><div class="panel-heading"><div><h3>Performance signals</h3><p>Service delivery health</p></div></div><div class="panel-body"><div class="list-item"><span class="queue-icon">${icon('check')}</span><div><b>Send success rate</b><small>Successful flare events</small></div><b class="amount">99.2%</b></div><div class="progress"><span style="width:99.2%"></span></div><div class="list-item"><span class="queue-icon">${icon('clock')}</span><div><b>Average processing</b><small>Event processing time</small></div><b class="amount">240 ms</b></div><div class="divider"></div><div class="list-item"><span class="queue-icon">${icon('flame')}</span><div><b>Failed sends</b><small>Events requiring investigation</small></div><b class="amount">0.8%</b></div><p class="preview-note">Privacy by design: this dashboard excludes message previews and recipient-level activity.</p></div></section></div><section class="panel" style="margin-top:20px"><div class="panel-heading"><div><h3>Volume summary</h3><p>Counts by reporting window</p></div></div><div class="table-wrap"><table><thead><tr><th>Period</th><th>Total flares</th><th>Daily average</th><th>Peak day</th><th>Change</th></tr></thead><tbody><tr><td><b>Today</b></td><td>1,284</td><td>1,284</td><td>1,284</td><td><span class="badge green">+8.4%</span></td></tr><tr><td><b>This week</b></td><td>8,764</td><td>1,252</td><td>1,486</td><td><span class="badge green">+6.2%</span></td></tr><tr><td><b>This month</b></td><td>38,492</td><td>1,283</td><td>2,940</td><td><span class="badge green">+12.6%</span></td></tr></tbody></table></div></section>`}

function validateQuestion(d,publish){if(!d.question.trim())return 'Add a question prompt before saving.';if(!publish)return '';if(d.scope==='selected'&&!d.targetSquads.length)return 'Choose at least one squad, or explicitly select All squads.';if(d.targetSquads.some(id=>!mxFindSquad(id))&&d.scope==='selected')return 'One of the selected squads no longer exists. Update the audience.';if(d.category==='Creator Knowledge'&&!d.creatorIds.length)return 'Tag at least one creator for a Creator Knowledge question.';if(d.creatorIds.some(id=>!mxCreators().some(c=>c.id===id)))return 'Remove creator tags that no longer exist.';if(!Number.isInteger(Number(d.time))||d.time<5||d.time>120)return 'Answer time must be a whole number from 5 to 120 seconds.';if(d.source&&!validUrl(d.source))return 'Use an HTTPS source link.';if(d.topic==='Recent knowledge'&&!d.referenceDate)return 'Add the reference date for recent knowledge.';if(d.referenceDate&&d.referenceDate>new Date().toISOString().slice(0,10))return 'The knowledge reference date cannot be in the future.';if(d.image&&!d.imageAlt.trim())return 'Add a description for the question image without revealing the answer.';if(['choice','order'].includes(d.kind)){if(d.options.length<2||d.options.length>8||d.options.some(x=>!x.trim()))return 'Complete every item, or remove unused items. Use 2–8 items.';if(new Set(d.options.map(norm)).size!==d.options.length)return 'Use distinct answer items so the question is unambiguous.'}if(d.kind==='choice'){if(!d.correct.length||d.correct.some(i=>i<0||i>=d.options.length))return 'Mark the correct answer beside the answer choices.';if(d.multiple&&(d.correct.length<2||d.correct.length===d.options.length))return 'For multiple select, mark at least two correct answers and leave one incorrect choice.';if(!d.multiple&&d.correct.length!==1)return 'Choose exactly one correct answer.';if(d.visual&&(d.images.length!==d.options.length||d.images.some(x=>!x)))return 'Upload a different image and add a description for every image choice.';if(d.visual&&new Set(d.images).size!==d.images.length)return 'Use different images for each choice.'}if(d.kind==='boolean'&&!(d.correct.length===1&&[0,1].includes(d.correct[0])))return 'Choose whether True or False is correct.';if(d.kind==='text'&&!norm(d.expected))return 'Enter the expected answer.';if(d.kind==='text'&&d.numeric&&!/^\d{4}$/.test(d.expected.trim()))return 'Enter a four-digit year.';if(d.kind==='match'){if(d.pairs.length<2||d.pairs.some(p=>!p.left.trim()||!p.right.trim()))return 'Complete both sides of every pair.';if(new Set(d.pairs.map(p=>norm(p.left))).size!==d.pairs.length||new Set(d.pairs.map(p=>norm(p.right))).size!==d.pairs.length)return 'Each match must have a unique item and a unique answer.'}if(!d.explanation.trim())return 'Add a short answer explanation before publishing.';return ''}
function recordQuestion(d,state){const id=d.id||uid('RQ'),editor={...clone(d),id,status:state},bundle=mobileBundle(editor);return {id,question:d.question.trim(),category:d.category,format:legacy[d.kind],formatLabel:formatLabel(d),type:bundle.question.type,status:state,audience:{mode:d.scope,squadIds:d.scope==='all'?[]:[...d.targetSquads]},targetSquads:d.scope==='all'?[]:[...d.targetSquads],creatorIds:[...d.creatorIds],options:bundle.question.options||[],answer:bundle.question.answer,editorV3:editor,mobileQuestion:bundle.question,assets:bundle.assets,updated:new Date().toISOString()}}

function questionRows(){let rows=mxOps.questions.filter(q=>{const d=normalizeQuestion(q);return [q.id,q.question,d.topic,...d.creatorIds.map(id=>mxCreators().find(c=>c.id===id)?.name),scopeText(d)].join(' ').toLowerCase().includes(repFilter.q.toLowerCase())&&(repFilter.status==='All statuses'||q.status===repFilter.status)&&(repFilter.format==='All formats'||d.kind===repFilter.format)&&(repFilter.scope==='All audiences'||d.scope===repFilter.scope)&&(!repFilter.squadId||mxQuestionAppliesToSquad(q,mxFindSquad(repFilter.squadId)))});const pages=Math.max(1,Math.ceil(rows.length/10));repFilter.page=Math.min(repFilter.page,pages);if(!rows.length)return emptyEx('No matching questions','Try another search or create the first question for this audience.',btn('Create question','q-new','','primary'));return `<div class="ex-table"><table><thead><tr><th>Question</th><th>Response</th><th>Audience</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.slice((repFilter.page-1)*10,repFilter.page*10).map(q=>{const d=normalizeQuestion(q);return `<tr><td><span class="q-title">${E(q.question)}</span><small>${E(q.id)} · ${E(d.topic)}</small></td><td>${E(formatLabel(d))}<small>${d.time}s to answer</small></td><td><span title="${E(scopeText(d))}">${d.scope==='all'?'All squads':d.targetSquads.length===1?E(scopeText(d)):d.targetSquads.length+' squads'}</span><small>${E(d.category)}</small></td><td>${status(q.status)}</td><td><div class="row">${btn('Preview','q-preview',q.id,'small')}${btn('Edit','q-edit',q.id,'small')}${btn(icon('more'),'q-menu',q.id,'small" aria-label="More question actions')}</div></td></tr>`}).join('')}</tbody></table></div><div class="ex-pager"><small>${rows.length} question${rows.length===1?'':'s'} · Page ${repFilter.page} of ${pages}</small><div class="row">${btn('Previous','q-page',-1,'small'+(repFilter.page===1?'" disabled':''))}${btn('Next','q-page',1,'small'+(repFilter.page===pages?'" disabled':''))}</div></div>`}

(d.options.length<=2?'" disabled':''))}</div>`).join('');h+=btn('+ Add '+(d.kind==='order'?'event':'choice'),'q-add-option','','small'+(d.options.length>=8?'" disabled':''))}if(d.kind==='boolean')h=`<div class="two-col">${['True','False'].map((v,i)=>`<label class="ex-radio-card"><input type="radio" name="answer-key" data-correct="${i}" ${d.correct.includes(i)?'checked':''}><span><b>${v}</b><small>Mark as the correct answer</small></span></label>`).join('')}</div>`;if(d.kind==='text')h=`${sel('Answer type','numeric',String(d.numeric),[['false','Text or name'],['true','Four-digit year']])}${fld(d.numeric?'Correct year':'Expected answer','expected',d.expected,d.numeric?'inputmode="numeric" maxlength="4"':'maxlength="180"')}${d.numeric?'':fld('Accepted alternatives · one per line','aliases',d.aliases,'rows="3" placeholder="Nicknames, full names or other valid spellings"','textarea')}<p class="hint">Capitalization, spaces and punctuation are ignored when checking text answers.</p>`;if(d.kind==='match')h=`<p class="hint">Enter the correct pairs. Fans match each item to a shuffled answer list.</p>${d.pairs.map((p,i)=>`<div class="ex-answer-row"><input data-pair="${i}" data-side="left" value="${E(p.left)}" placeholder="Song or item" aria-label="Pair ${i+1} item"><span>→</span><input data-pair="${i}" data-side="right" value="${E(p.right)}" placeholder="Collaborator or match" aria-label="Pair ${i+1} answer">${btn('×','q-remove-pair',i,'small'+(d.pairs.length<=2?'" disabled':''))}</div>`).join('')}${btn('+ Add pair','q-add-pair','','small'+(d.pairs.length>=6?'" disabled':''))}`;return h}
function questionEditor(){const d=qDraft;return `<div class="ex"><header class="ex-head"><div>${btn('← Question bank','q-back','','small')}<h2 style="margin-top:17px">${d.id?'Edit question':'Create a question'}</h2><p>Choose how fans answer. We’ll handle the points.</p></div><div class="row">${status(d.status)}${btn('Export JSON','q-export-draft')}</div></header><div class="ex-edit-grid"><div><form id="exQuestionForm" novalidate><section class="ex-box">${title('01','Question & response','Formats describe the interaction. Topics describe the knowledge.')}<div class="ex-formats">${formats.map(([v,l,i])=>`<button type="button" class="ex-format ${d.kind===v?'active':''}" data-ex="q-format" data-id="${v}" aria-pressed="${d.kind===v}">${icon(i)}<span>${l}</span></button>`).join('')}</div><div class="ex-example-row"><select id="exExample" aria-label="Question example">${REP_SOURCE.examples.filter(x=>fromMobile(x,REP_SOURCE.assets).kind===d.kind).map(x=>`<option value="${x.id}">${E(x.format)} · ${E(x.q.slice(0,62))}${x.q.length>62?'…':''}</option>`).join('')}</select>${btn('Use example','q-example','','small')}</div>${fld('Question prompt','question',d.question,'rows="3" maxlength="600" placeholder="What do you want fans to answer?"','textarea')}<div class="two-col">${sel('Topic','topic',d.topic,topics)}${fld('Time to answer · seconds','time',d.time,'type="number" min="5" max="120" step="1"')}</div>${d.topic==='Recent knowledge'?fld('Knowledge reference date','referenceDate',d.referenceDate,'type="date"'):''}<details ${d.image?'open':''}><summary>Question image · optional</summary><div class="ex-upload">${d.image?`<img src="${E(d.image)}" alt="Question attachment">`:icon('image')}<div><b>Give fans a visual clue</b><p class="hint">JPG, PNG or WebP · up to 5 MB</p><input type="file" data-upload="prompt" accept="image/png,image/jpeg,image/webp" aria-label="Upload question image">${d.image?btn('Remove','q-remove-image','','small'):''}</div></div>${fld('Image description','image ere.')}</h3>${q.context?`<div class="ex-note" style="display:block"><b>${E(q.context.title)}</b><br>${E(q.context.text)}</div>`:''}${q.clues?`<p class="hint">${q.clues.map(E).join('<br>')}</p>`:''}${q.image?`<img class="q-image" src="${E(assets[q.image])}" alt="${E(q.imageAlt)}">`:''}${h}${p.checked?`<div class="feedback ${p.correct?'':'wrong'}"><b>${p.correct?'That’s right!':'Not quite'}</b><p style="margin:5px 0 0">${E(q.explain)}</p></div>${btn('Try again','preview-reset','','primary')}`:btn('Check answer','preview-check','','primary')}<p class="hint" id="exPreviewError" role="status">${E(p.feedback||'')}</p></div><div class="ex-phone-footer">${E(formatLabel(d))} · Player preview</div></div>`}

 else if(a==='preview-check'){const d=previewDraft||qDraft,err=validateQuestion(d,true);if(err){previewState.feedback='Finish the question first: '+err;updatePreview(false);return}const q=mobileBundle(d).question,p=previewState;let v=p.value;if(q.type==='order')v=p.order;if(q.type==='match')v=q.options.map((_,i)=>p.matches[i]===undefined?null:Number(p.matches[i]));if(v===null||v===''||Array.isArray(v)&&(!v.length||v.includes(null))){p.feedback='Choose or enter your answer first.';updatePreview(false);return}p.correct=['text','number'].includes(q.type)?q.aliases.includes(norm(v)):q.type==='multi'?JSON.stringify([...v].sort((a,b)=>a-b))===JSON.stringify(q.answer):['order','match'].includes(q.type)?JSON.stringify(v)===JSON.stringify(q.answer):v===q.answer;p.checked=true;p.feedback='';updatePreview(false)}
 else if(a==='ad-new'||a==='ad-slot')openAd(null,a==='ad-slot'?id:null);
 else if(a==='ad-edit'){closeDialog();openAd(ads.find(x=>x.id===id))}
 else if(a==='ad-tab'){adTab=id;render()}
 else if(a==='ad-save'||a==='ad-enable')saveAd(a==='ad-enable');
 else if(a==='ad-destination'){const x=internalItems(aDraft.destinationType).find(x=>x.id===id);if(x){aDraft.destination=x.id;aDraft.destinationLabel=x.name;dirty=true;render()}}
 else if(a==='ad-preview'){const x=ads.find(x=>x.id===id);openDialog(x.name,'Fan-facing banner placement',`<div class="ex" style="max-width:360px;margin:auto">${adPreview(x)}</div>`)}
 else if(a==='ad-menu'){const x=ads.find(x=>x.id===id);openDialog('Campaign actions',x.name,`<div class="ex row wrap">${btn('Duplicate','ad-duplicate',id)}${btn('Export JSON','ad-export-one',id)}${btn('Delete campaign','ad-delete',id)}</div>`)}
 else if(a==='ad-duplicate'){const x={...clone(ads.find(x=>x.id===id)),id:null,status:'Draft'};x.name+=' · copy';closeDialog();openAd(x);dirty=true}
 else if(a==='ad-delete'){if(confirm('Delete this campaign and release its placements?')&&persistAds(ads.filter(x=>x.id!==id))){closeDialog();render();toast('Campaign deleted.')}}
 else if(a==='ad-pause'||a==='ad-resume'){const x=clone(ads.find(x=>x.id===id));x.status=a==='ad-pause'?'Paused':'Enabled';if(a==='ad-resume'){const err=validateAd(x,true);if(err){toast(err);return}}if(persistAds(ads.map(v=>v.id===id?x:v))){render();toast(a==='ad-pause'?'Campaign paused.':'Campaign resumed.')}}
 else if(a==='ad-export')exportJSON('merchrix-ad-campaigns.json',{schemaVersion:1,placements:slots,campaigns:ads});
 else if(a==='ad-export-one')exportJSON('campaign-'+id+'.json',ads.find(x=>x.id===id));
},true);
function bindInput(e){const t=e.target;if(t.id==='exPreviewAnswer'){previewState.value=t.value;return}if(t.dataset.previewMatch!==undefined){if(t.value==='')delete previewState.matches[t.dataset.previewMatch];else previewState.matches[t.dataset.previewMatch]=Number(t.value);return}if(t.dataset.filter){repFilter[t.dataset.filter]=t.value;repFilter.page=1;$('#exQuestionRows').innerHTML=questionRows();return}if(t.dataset.adFilter){adFilter[t.dataset.adFilter]=t.value;$('#exAdRows').innerHTML=adRows();return}if(t.dataset.pickSearch){const k=t.dataset.pickSearch;if(k==='ad')adPickerQuery=t.value;else pickerQuery[k]=t.value;$('#ex-'+k+'-results').innerHTML=pickerResults(k==='creator'?'creator':'squad',k==='ad');return}if(t.id==='exDestinationSearch'){destQuery=t.value;$('#exDestinationResults').innerHTML=destinationResults();return}const ad=t.closest('#exAdForm'),q=t.closest('#exQuestionForm');if(!ad&&!q)return;const d=ad?aDraft:qDraft;if(t.dataset.bind){const k=t.dataset.bind;d[k]=t.type==='checkbox'?t.checked:['visual','numeric'].includes(k)?t.value==='true':t.value;if(k==='visual'&&d.visual){d.multiple=false;d.correct=d.correct.slice(0,1);d.images=d.options.map((_,i)=>d.images[i]||'')}if(k==='multiple'&&!d.multiple)d.correct=d.correct.slice(0,1);if(k==='destinationType'){d.destination='';d.destinationLabel='';destQuery=''}dirty=true;if(['scope','category','topic','visual','multiple','numeric','destinationType'].includes(k)){resetPreview();render();return}if(ad){$('#exAdPreview').innerHTML=adPreview(d);if(k==='focal'){const banner=$('#exAdForm .ex-banner img');if(banner)banner.style.objectPosition=d.focal}}else updatePreview();return}if(t.dataset.option!==undefined){d.options[Number(t.dataset.option)]=t.value;dirty=true;updatePreview()}if(t.dataset.pair!==undefined){d.pairs[Number(t.dataset.pair)][t.dataset.side]=t.value;dirty=true;updatePreview()}if(t.dataset.correct!==undefined){const i=Number(t.dataset.correct);d.correct=d.multiple?(t.checked?[...new Set([...d.correct,i])]:d.correct.filter(x=>x!==i)):[i];dirty=true;updatePreview()}if(t.dataset.slot){d.placements=t.checked?[...new Set([...d.placements,t.dataset.slot])]:d.placements.filter(x=>x!==t.dataset.slot);dirty=true;render()}}
document.addEventListener('input',e=>{if(['checkbox','radio','file'].includes(e.target.type)||e.target.tagName==='SELECT')return;bindInput(e)},true);
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.upload){const d=t.dataset.upload==='ad'?aDraft:qDraft;if(!d)return;try{const image=await readImage(t.files?.[0]);if(t.dataset.upload==='ad'){d.image=image.src;d.imageName=t.files[0].name;d.dimensions=image.dimensions}else if(t.dataset.upload==='prompt')d.image=image.src;else d.images[Number(t.dataset.index)]=image.src;dirty=true;resetPreview();render();toast('Image uploaded.')}catch(err){toast(err.message);t.value=''}return}if(t.id==='exImport'){try{if(t.files[0].size>10*1024*1024)throw Error('Import a JSON file smaller than 10 MB.');const data=JSON.parse(await t.files[0].text()),records=Array.isArray(data)?data:[data];if(records.length>200)throw Error('Import up to 200 questions at a time.');const imported=records.map(r=>{let d;if(r.editorV3)d=normalizeQuestion(r);else if(r.mobileQuestion)d=fromMobile(r.mobileQuestion,r.assets||{});else if(r.question)d=normalizeQuestion(r);else throw Error('The file does not contain a supported Rep Check question.');d.id=null;d.status='Draft';if(r.mobileQuestion&&!r.editorV3){d.scope=r.audience?.mode||(r.targetSquads?.length?'selected':'all');d.targetSquads=(r.targetSquads||r.audience?.squadIds||[]).map(id=>mxFindSquad(id)?.id||id);d.creatorIds=r.creatorIds||[];d.category=r.category||'Quick Check'}if(!formats.some(x=>x[0]===d.kind)||typeof d.question!=='string'||!d.question.trim())throw Error('One or more questions are invalid. Nothing was imported.');return recordQuestion(d,'Draft')});if(confirm('Import '+imported.length+' question(s) as drafts? Review audience and answers before publishing.')&&persistQuestions([...imported,...mxOps.questions])){render();toast(imported.length+' question(s) imported as drafts.')}}catch(err){toast(err.message)}return}if(['checkbox','radio'].includes(t.type)||t.tagName==='SELECT')bindInput(e)},true);
document.addEventListener('submit',e=>{if(['exQuestionForm','exAdForm'].includes(e.target.id)){e.preventDefault();e.stopImmediatePropagation();if(e.target.id==='exQuestionForm')saveQuestion(false);else saveAd(false)}},true);
dialog.addEventListener('close',()=>{previewDraft=null});

const communityRender=render;render=function(){if(['rep-check','ad-engine','flares'].includes(route.page)&&(!session||!canPage(route.page))){originalRenderGuard();return}communityRender()};

refreshShell();parseRoute();
