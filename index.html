function avatar(p,cls=''){p=p||{name:'Merchrix'};const src=ASSETS[p.avatar];return src?`<img class="avatar ${cls}" src="${src}" alt="">`:`<span class="avatar ${cls}" style="background:${['#ede7fc','#ffe8de','#e0f3eb','#e0eefa'][String(p.name).length%4]}">${esc(p.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span>`}

function analytics(){const k=chartRange==='7'?0.24:chartRange==='90'?2.65:1;return intro('Platform performance','Commerce, creators, and fandom. Reporting period ending 20 September 2026.',button(icon('download')+' Export report','analytics-export'))+`<div class="stack">${metrics([['GMV',short(84700000*k),'+17% vs prior period'],['Platform revenue',short(9620000*k),'+12.7% vs prior period'],['Orders',Math.round(12482*k).toLocaleString(),'+9.3% vs prior period'],['Average order value','₦6,786','GMV ÷ orders']])}<div class="grid chart-layout">${chartPanel()}${panel('Revenue mix','Share of platform revenue',`<div class="donut"><div>${short(9620000*k)}<small>Total revenue</small></div></div>${[['Platform fees','52%','#5945ee'],['Design services','26%','#bde900'],['Fulfillment services','12%','#b5a8ff'],['Other','10%','#e2e5eb']].map(([l,v,c])=>`<div class="between small-text" style="margin:12px 0"><span><i class="legend-dot" style="background:${c}"></i> ${l}</span><b>${v}</b></div>`).join('')}`)}</div>

function cell(r,k,c){const val=r[k];if(k==='name'){let visual=c==='users'||c==='staff'||c==='payouts'?avatar(c==='users'?r:person(r.name)||r):c==='products'||c==='assets'?art(r.art):['squads','drops'].includes(c)?`<span class="avatar" style="border-radius:9px">${icon(c==='squads'?'flame':'bag')}</span>`:'';return `<button class="cell-link row" data-action="record" data-collection="${c}" data-id="${r.id}">${visual}<span><span class="cell-title">${c==='users'?nameMarkup(r):esc(val)}</span><span class="cell-sub">${c==='users'?'@'+esc(r.handle):c==='products'?esc(r.variants):esc(r.id)}</span></span></button>`}if(['status','verified','kyc','priority','role'].includes(k))return badge(val);if(['price','amount','gmv','reward'].includes(k))return money(val);if(['stock','members','fanblazes','orders','units','delivered','referrals'].includes(k))return Number(val||0).toLocaleString();if(['buyer','creator'].includes(k)&&person(val))return `<a class="row" href="#users/${person(val).id}">${avatar(person(val),'small')}<span>${esc(val)}</span></a>`;return esc(val??'—')}
function table(c,rows,create=true){currentCollection=c;currentRows=rows;const cfg=COLLECTIONS[c];const statuses=[...new Set(rows.map(r=>r.status).filter(Boolean))];const types=c==='users'?['Creator','Fan']:c==='orders'?['Merchrix managed','Creator stocked']:[];const canCreate=canCollection(c,'write')&&create&&Object.keys(cfg.fields).length&&!['reports'].includes(c);return `<div class="toolbar"><label class="search-field">${icon('search')}<input id="tableSearch" value="${esc(tableState.q)}" placeholder="Search ${esc(cfg.title.toLowerCase())}…" aria-label="Search ${esc(cfg.title)}"></label><select id="statusFilter" aria-label="Filter by status"><option>All statuses</option>${statuses.map(s=>`<option ${tableState.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>${types.length?`<select id="typeFilter" aria-label="Filter by type"><option>All types</option>${types.map(t=>`<option ${tableState.type===t?'selected':''}>${t}</option>`).join('')}</select>`:''}<select id="sortTable" aria-label="Sort records"><option value="default">Default order</option><option value="asc" ${tableState.sort==='asc'?'selected':''}>Name A–Z</option><option value="desc" ${tableState.sort==='desc'?'selected':''}>Name Z–A</option></select><button class="text-btn" data-action="reset-filters">Reset</button><div style="margin-left:auto" class="row gap-sm">${button(icon('download')+' Export','export','small')}${canCreate?button(icon('plus')+' Add '+cfg.singular,'create','primary small',`data-collection="${c}"`):''}</div></div><div id="tableResults">${tableResults()}</div>`}
function filteredRows(){let arr=currentRows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(tableState.q.toLowerCase())&&(tableState.status==='All statuses'||r.status===tableState.status)&&(tableState.type==='All types'||(r.role||r.model)===tableState.type));if(tableState.sort!=='default')arr.sort((a,b)=>String(a.name).localeCompare(String(b.name))*(tableState.sort==='asc'?1:-1));return arr}
function tableResults(){let arr=filteredRows();const c=currentCollection,cfg=COLLECTIONS[c],pages=Math.max(1,Math.ceil(arr.length/10));tableState.page=Math.min(tableState.page,pages);const start=(tableState.page-1)*10,visible=arr.slice(start,start+10);return (visible.length?`<div class="table-wrap"><table><thead><tr>${cfg.cols.map(k=>`<th scope="col">${esc(cfg.labels?.[k]||({name:'Name',id:'Reference',model:'Fulfillment',kyc:'Identity',gmv:'GMV',starts:'Starts',ends:'Ends',fanblazes:'Fanblazes'}[k])||k.replace(/^[a-z]/,l=>l.toUpperCase()))}</th>`).join('')}<th scope="col"><span class="muted">Actions</span></th></tr></thead><tbody>${visible.map(r=>`<tr>${cfg.cols.map(k=>`<td>${cell(r,k,c)}</td>`).join('')}<td><button class="icon-btn" data-action="row-menu" data-collection="${c}" data-id="${r.id}" aria-label="Actions for ${esc(r.name)}">${icon('more')}</button></td></tr>`).join('')}</tbody></table></div>`:empty())+`<div class="pagination"><span>${arr.length?`${start+1}–${Math.min(start+10,arr.length)} of ${arr.length}`:'0'} records</span><div class="row gap-sm"><button data-action="prev" aria-label="Previous page" ${tableState.page===1?'disabled':''}>‹</button><span>Page ${tableState.page} of ${pages}</span><button data-action="next" aria-label="Next page" ${tableState.page===pages?'disabled':''}>›</button></div></div>`}
function updateTable(){document.getElementById('tableResults').innerHTML=tableResults()}
function collectionPage(page){let title=NAV.find(x=>x[0]===page)[1],sub={users:'Manage identities, creator applications, and the people behind every fandom.',commerce:'Manage merch, drops, storefronts, and marketplace visibility.',orders:'From payment to doorstep. Track both fulfillment models with DHL.',finance:'Review earnings, cleared balances, payouts, refunds, and disputes.',studio:'Bring creator ideas to life. Manage briefs, designers, and final approvals.',community:'Manage squads, Fanblazes, fan ranks, and Arena activity.',moderation:'Review reports consistently, record decisions, and manage appeals.',support:'Keep customer conversations, order context, and resolutions together.',crm:'Build audiences and plan communications across the platform.',content:'Curate homepage placements, featured collections, and announcements.',security:'Manage staff access and review administrative activity.'}[page];const tab=route.tab||PAGE_TABS[page][0][0];let cards='',body='';

if(page==='orders'){cards=metrics([['Orders',db.orders.length,'Order ledger'],['In fulfillment',db.orders.filter(x=>['Production','Ready for pickup','Shipped'].includes(x.status)).length,'Production through transit'],['Exceptions',db.orders.filter(x=>x.status==='Exception').length,'Needs attention','peach'],['Delivered',db.orders.filter(x=>x.status==='Delivered').length,'Completed deliveries']]);const rows=db.orders.filter(x=>tab==='production'?x.status==='Production':tab==='pickups'?x.status==='Ready for pickup':tab==='exceptions'?x.status==='Exception':true);body=table('orders',rows,false)}

if(page==='support'){cards=metrics([['Open tickets',db.tickets.filter(x=>x.status==='Open').length,'Awaiting first response','peach'],['In progress',db.tickets.filter(x=>x.status==='In progress').length,'Assigned conversations'],['Resolved',db.tickets.filter(x=>x.status==='Resolved').length,'Completed cases'],['Knowledge base',db.articles.filter(x=>x.status==='Published').length,'Published help articles']]);body=table(tab==='articles'?'articles':'tickets',db[tab==='articles'?'articles':'tickets'])}
if(page==='crm'){cards=metrics([['Campaigns',db.campaigns.length,'Across all channels'],['Scheduled',db.campaigns.filter(x=>x.status==='Scheduled').length,'Prepared for delivery','lavender'],['Segments',db.segments.length,'Defined audiences'],['Waitlist',db.waitlist.filter(x=>x.status==='Pending').length,'Creator applications']]);body=tab==='templates'?templatesView():table(['segments','referrals','waitlist'].includes(tab)?tab:'campaigns',db[['segments','referrals','waitlist'].includes(tab)?tab:'campaigns'])}
if(page==='content'){cards=metrics([['Content blocks',db.content.length,'All placements'],['Published',db.content.filter(x=>x.status==='Published').length,'Active editorial content'],['Scheduled',db.content.filter(x=>x.status==='Scheduled').length,'Upcoming placements','lavender'],['Drafts',db.content.filter(x=>x.status==='Draft').length,'Work in progress']]);body=table('content',db.content.filter(r=>tab==='featured'?r.placement.startsWith('Featured'):tab==='announcements'?r.placement==='Announcement':true))}

function arena(){return `<div class="profile-content"><div class="arena"><div class="between"><span class="badge lime">LIVE</span><span class="small-text muted">1,842 watching · 23:14 elapsed</span></div><div class="arena-score"><div><h3>LIT GANG</h3><strong>1,674,434 🔥</strong><span>54.2% momentum</span></div><span class="muted">VS</span><div class="text-right"><h3>30BG</h3><strong>1,412,821 🔥</strong><span>45.8% momentum</span></div></div><div class="progress lime"><span style="width:54.2%"></span></div><div class="between wrap"><span class="small-text muted">12,481 boosted · 342 drop purchases</span>${button('View event activity','arena-detail','lime small')}</div></div><div class="grid two"><div class="info-box"><h3>Clash controls</h3><p class="subline">Review activity, reports, and the event audit trail.</p><a class="button small" href="#moderation" style="margin-top:18px">Open moderation queue</a></div><div class="info-box"><h3>Previous clash</h3>${kv('Match','Inner Circle vs Seyi Nation')}${kv('Winner','Inner Circle')}${kv('Ended','18 September 2026')}${kv('Final score','842,130 : 761,408')}</div></div></div>`}
function templatesView(){return `<div class="profile-content grid three">${[['Welcome message','Welcome to your fandom','Find your creators. Join a squad. Make it yours.'],['Drop announcement','A new drop just landed','Explore the latest collection before it’s gone.'],['Payout update','Your payout is on its way','Your cleared earnings are being processed.']].map(([n,s,m])=>`<div class="info-box"><span class="badge purple">Message template</span><h3 style="margin-top:20px">${n}</h3><p class="subline">${m}</p>${button('Use template','template','small',`data-name="${n}" data-subject="${s}" data-message="${esc(m)}" style="margin-top:20px"`)}</div>`).join('')}</div>`}

function sessionsView(){return `<div class="profile-content"><div class="info-box"><div class="between"><div><h3>Current workspace session</h3><p class="subline">This browser · active session</p></div>${badge('Active')}</div>${kv('Account','Seyi Emmanuel')}${kv('Role','Super Admin')}${kv('Authentication','Password sign-in')}</div><div class="preview-note">Review your active session and sign out when working on a shared device.</div></div>`}

function profile(p){const creator=p.role==='Creator',pt=route.detailTab||'overview',ptabs=creator?['overview','merch','drops','squad','orders','identity','activity log']:['overview','orders','merch','squad','drops','wishlist','activity log'];const metricsData=creator?[['GMV',short(p.gmv||0),'Lifetime sales','lavender'],['Orders',p.orders||0,'Lifetime orders','peach'],['Fans',Number(p.fans||0).toLocaleString(),'Creator followers','blue'],['Rating',p.orders?'4.9/5':'—',p.orders?String(p.reviewCount||312)+' reviews':'No reviews yet'],['Squad members',Number(p.members||0).toLocaleString(),esc(p.squad||'No squad')],['Active drops',db.drops.filter(r=>r.creatorId===p.id&&r.status==='Live').length,'Current campaigns']]:[['XP',Number(p.xp).toLocaleString(),'Lifetime fan points','yellow'],['Fan rank',`<span style="font-size:12px;letter-spacing:0"><span class="rank-badge">✦</span>${esc(p.rank)}</span>`,rankProgress(p).next?`${rankProgress(p).remaining.toLocaleString()} XP to ${rankProgress(p).next}`:'Highest rank','gray'],['Lifetime spend',short(p.spend||0),'Completed purchases','peach'],['Orders',p.orders,'Lifetime orders'],['Creators followed',p.id==='MX-019284'?14:7,'Creator connections'],['Squads',p.id==='MX-019284'?4:2,'Memberships']];
let body='';if(pt==='overview'){const fields=creator?[['Email',p.email],['Category',p.category||'Not set'],['Joined',p.joined],['Creator type',p.model||'Not set']]:[['Email',p.email],['Region',p.region],['Joined',p.joined],['Latest order',db.orders.find(x=>x.buyerId===p.id)?.date||'No orders']];body=`<div class="grid two"><section class="info-box"><h3>Account information</h3><dl class="info-grid">${fields.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>${creator?`<section class="info-box blue"><div class="between"><h3>Squad snapshot</h3><span class="small-text muted">${esc(p.squad)}</span></div><div class="squad-total">${Number(p.fanblazes||0).toLocaleString()} <span style="font-size:30px">🔥</span></div><span class="muted small-text">Fanblazes</span>${kv('Members',Number(p.members||0).toLocaleString())}</section>`:`<section class="info-box" style="background:#fcf7ff"><div class="between"><h3>Fan rank progress</h3><span class="rank-badge">✦</span></div><div class="squad-total" style="font-size:24px">${esc(p.rank)}</div><p class="subline">${rankProgress(p).next?`${rankProgress(p).remaining.toLocaleString()} more XP to unlock ${rankProgress(p).next}.`:'Highest rank unlocked.'}</p><div class="progress"><span style="width:${rankProgress(p).percent}%"></span></div><div class="between small-text muted"><span>${Number(p.xp).toLocaleString()} XP</span><span>${rankProgress(p).target.toLocaleString()} XP</span></div></section>`}</div><div class="grid two"><section class="info-box green"><h3>Trust & safety</h3>${kv('Identity',badge(p.verified))}${kv('Account',badge(p.status))}${kv('Open reports',db.reports.filter(r=>r.entity.includes(p.id)&&r.status!=='Resolved').length)}${button('Manage account','account-actions','small',`data-id="${p.id}"`)}</section><section class="info-box"><h3>${creator?'Performance snapshot':'Fandom snapshot'}</h3>${creator?`<div class="grid three" style="margin-top:30px"><div><div class="stat-big">${Number(p.units||0).toLocaleString()}</div><p class="subline">Units sold</p></div><div><div class="stat-big">${p.orders?(p.conversion||'5.8')+'%':'—'}</div><p class="subline">Conversion</p></div><div><div class="stat-big">${p.orders?(p.repeat||41)+'%':'—'}</div><p class="subline">Repeat buyers</p></div></div><p class="subline">Last 30 days</p>`:`${kv('Top creator','Amaka Okafor')}${kv('Fanblazes contributed','8,240 🔥')}${kv('Latest achievement','First Drop')}`}</section></div>`}
if(pt==='merch'){const ids=db.orders.filter(r=>r.buyerId===p.id).map(r=>r.productId);const products=db.products.filter(r=>creator?r.creatorId===p.id:ids.includes(r.id));body=`<div class="between"><div><h3>${creator?'Creator merch':'Purchased merch'}</h3><p class="subline">${creator?'Catalog and publishing status':'Products from completed orders'}</p></div>${creator?button('Add product','create','small',`data-collection="products" data-creator="${esc(p.name)}"`):''}</div><div class="product-grid">${products.map(productCard).join('')}</div>${products.length?'':empty('No merch yet','Products will appear here when they are added.')}`}
if(pt==='drops'){const drops=db.drops.filter(r=>creator?r.creatorId===p.id:p.id==='MX-019284'?r.creatorId==='MX-004821':r.creatorId==='MX-006774');body=`<h3>${creator?'Creator drops':'Participated drops'}</h3><div class="product-grid">${drops.map(dropCard).join('')}</div>${drops.length?'':empty('No drops yet','No campaigns are linked to this account.')}`}
if(pt==='orders'){const orders=db.orders.filter(r=>creator?r.creatorId===p.id:r.buyerId===p.id);body=`<h3>Order history</h3>${orders.length?miniOrders(orders):empty('No orders yet','New orders will appear here.')}`}
if(pt==='squad'){const squads=db.squads.filter(r=>creator?r.creator===p.name:p.id==='MX-019284'?r.id!=='SQ-005':['SQ-001','SQ-004'].includes(r.id));body=`<h3>${creator?'Creator squad':'Squad memberships'}</h3><div class="grid two">${squads.map(s=>`<div class="info-box blue"><div class="row"><span class="avatar">${icon('flame')}</span><div><h3>${esc(s.name)}</h3><p class="subline">${esc(s.creator)}</p></div></div><div class="squad-total">${s.fanblazes.toLocaleString()} 🔥</div><p class="subline">Fanblazes · ${s.members.toLocaleString()} members</p>${button('Open squad','record','small',`data-collection="squads" data-id="${s.id}" style="margin-top:20px"`)}</div>`).join('')}</div>`}
if(pt==='identity'){body=`<div class="grid two"><div class="info-box"><h3>Identity verification</h3>${kv('Review status',badge(p.verified))}${kv('Applicant',esc(p.name))}${kv('Account reference',p.id)}${kv('Creator model',esc(p.model))}<div class="file-info">Identity review summary<br>Document type: government-issued ID<br>Submitted documents are available to the identity review team.</div>${p.verified!=='Verified'?button('Review application','review-creator','primary',`data-id="${p.id}" style="margin-top:20px"`):'<p class="subline">Identity verified · 18 January 2025</p>'}</div><div class="info-box"><h3>Username & ownership</h3>${kv('Username','@'+esc(p.handle))}${kv('Contact email',esc(p.email))}${kv('Account status',badge(p.status))}<a class="button small" href="#users/usernames">Open username directory</a></div></div>`}
if(pt==='wishlist')body=`<h3>Saved merch</h3><div class="product-grid">${db.products.slice(0,2).map(productCard).join('')}</div><p class="subline">Merch saved by this fan.</p>`;
if(pt==='activity log'){const events=db.audit.filter(x=>[p.id,p.name].includes(x.entity));body=`<h3>Account activity</h3><div class="timeline">${events.map(e=>`<div class="timeline-item"><b>${esc(e.name)}</b><p>${esc(e.date)} · ${esc(e.actor)}<br>${esc(e.reason)}</p></div>`).join('')}<div class="timeline-item"><b>Account created</b><p>${esc(p.joined)} · ${esc(p.name)}</p></div></div>`}
return `<div class="stack"><div><h2 style="margin-bottom:25px">${creator?'Creator':'User'} details</h2><a href="#users" class="back">${icon('back')} Back to Users & Creators</a><section class="panel profile-hero">${avatar(p,'hero')}<div><div class="profile-title"><h2>${creator?esc(p.name)+(p.verified==='Verified'?'<span class="verified">✓</span>':''):nameMarkup(p)}</h2><span class="profile-role">${p.role}</span><span class="badge ${p.status==='Active'?'lime':''}">${p.status}</span></div><p class="profile-meta">@${esc(p.handle)}</p><p class="profile-meta">${creator?esc(p.verified)+' identity · ':''}Joined ${new Date(p.joined+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</p></div><div class="profile-actions">${button('View public profile','public-profile','primary',`data-id="${p.id}"`)}${button('More actions','account-actions','',`data-id="${p.id}"`)}</div></section></div><div class="profile-metrics">${metrics(metricsData,'six')}</div><section class="panel"><div class="tabs" role="tablist" aria-label="Account sections">${ptabs.map(t=>`<button class="tab ${t===pt?'active':''}" role="tab" aria-selected="${t===pt}" data-action="profile-tab" data-tab="${t}" data-id="${p.id}">${t.replace(/^./,s=>s.toUpperCase())}</button>`).join('')}</div><div class="profile-content">${body}</div></section></div>`}
function field(name,label,value,type='text',options=null,required=false){return `<label class="field ${type==='textarea'?'full':''}"><span>${label}${required?' <span class="muted">*</span>':''}</span>${options?`<select name="${name}" ${required?'required':''}>${options.map(o=>`<option ${o===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''} ${required?'required':''}>`}</label>`}
function settings(){const tab=route.tab||'general',s=db.settings;let content='';if(tab==='general')content=`<h3>Platform information</h3><p class="subline" style="margin-bottom:24px">Basic details used throughout the administrative workspace.</p><div class="form-grid">${field('name','Platform name',s.name,'text',null,true)}${field('email','Support email',s.email,'email',null,true)}${field('currency','Currency',s.currency,'text',['NGN','USD','EUR'])}${field('timezone','Timezone',s.timezone,'text',['Africa/Lagos','Europe/Dublin','UTC'])}</div>`;
if(tab==='commerce')content=`<h3>Commerce & payouts</h3><p class="subline" style="margin-bottom:24px">Configure platform fees and settlement rules.</p><div class="form-grid">${field('fee','Platform fee (%)',s.fee,'number',null,true)}${field('minPayout','Minimum payout (NGN)',s.minPayout,'number',null,true)}${field('holdDays','Settlement hold (days)',s.holdDays,'number',null,true)}</div><div class="preview-note">Wallets support withdrawals only. Pending, withdrawable, and held balances remain separate.</div>`;
if(tab==='integrations')content=`<h3>Platform integrations</h3><p class="subline">Manage the services that power platform operations.</p>${[['DHL','Shipping, pickup scheduling, and tracking','box'],['Payment gateway','Checkout, payment verification, and refunds','wallet'],['AI design service','Generation jobs and design assets','pen'],['Email & push provider','Campaigns and transactional notifications','mail']].map(([n,d,i])=>`<div class="policy-row between"><div class="row"><span class="avatar">${icon(i)}</span><div><h4>${n}</h4><p class="subline">${d}</p></div></div>${button('Setup details','integration','small',`data-name="${n}"`)}</div>`).join('')}<p class="subline">Connection credentials are managed by the platform owner.</p>`;
if(tab==='features')content=`<h3>Feature controls</h3>${[['creatorApplications','Creator applications','Allow prospective creators to apply.'],['aiDesign','AI design tools','Show AI design generation entry points.'],['squadClash','Squad clashes','Enable Squad Clash events for eligible squads.'],['maintenance','Maintenance mode','Control the customer-facing maintenance state.']].map(([k,n,d])=>`<label class="switch-row"><div><b>${n}</b><p>${d}</p></div><input type="checkbox" role="switch" name="${k}" ${s[k]?'checked':''}></label>`).join('')}<p class="subline">Changes apply to the selected platform features.</p>`;
if(tab==='notifications')content=`<h3>Admin notifications</h3>${[['emailAlerts','Email summaries','Daily operational summary for administrators.'],['payoutAlerts','Payout review alerts','Notify finance when requests need attention.'],['orderAlerts','Fulfillment exceptions','Notify operations about stalled orders.']].map(([k,n,d])=>`<label class="switch-row"><div><b>${n}</b><p>${d}</p></div><input type="checkbox" role="switch" name="${k}" ${s[k]?'checked':''}></label>`).join('')}<p class="subline">Choose which operational updates you receive.</p>`;
if(tab==='system')content=`<h3>System health</h3><p class="subline">Service availability over the last 30 days.</p>${[['API','Operational','99.98%'],['Payments','Operational','99.95%'],['Fulfillment','Operational','99.91%'],['Design processing','Operational','99.90%']].map(([n,s,v])=>`<div class="policy-row between"><span>${n}</span><span>${badge('Active')} <span class="muted small-text">${v} uptime</span></span></div>`).join('')}`;
return intro('Platform settings','Configure platform defaults, features, and service integrations.')+`<div class="panel pad settings-layout"><div class="settings-nav">${PAGE_TABS.settings.map(([k,l])=>`<button class="${tab===k?'active':''}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div><form id="settingsForm" data-tab="${tab}">${content}${['integrations','system'].includes(tab)?'':`<div class="form-actions"><button type="submit" class="button primary">Save changes</button></div>`}</form></div>`}
function render(){const page=route.page;document.getElementById('pageTitle').textContent=NAV.find(x=>x[0]===page)?.[1]||'Overview';document.querySelectorAll('.nav-link').forEach(el=>{const a=el.dataset.page===page;el.classList.toggle('active',a);if(a)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});let html;if(page==='overview')html=overview();else if(page==='analytics')html=analytics();else if(page==='settings')html=settings();else if(page==='users'&&route.id){const p=db.users.find(x=>x.id===route.id);html=p?profile(p):empty('Account not found','Return to the account directory to choose an existing account.')+'<a class="button" href="#users">Back to directory</a>'}else html=collectionPage(page);document.getElementById('main').innerHTML=html;document.title=(route.id?'Account details':NAV.find(x=>x[0]===page)?.[1])+' — Merchrix';}
function parseRoute(){const parts=decodeURIComponent(location.hash.slice(1)||'overview').split('/');let page=parts[0];if(!NAV.some(x=>x[0]===page))page='overview';route={page,tab:parts[1]||'',id:page==='users'&&parts[1]?.startsWith('MX-')?parts[1]:null,detailTab:parts[2]||'overview'};if(!route.id&&PAGE_TABS[page]&&!PAGE_TABS[page].some(x=>x[0]===route.tab))route.tab=PAGE_TABS[page][0][0];tableState={q:'',status:'All statuses',type:'All types',sort:'default',page:1};closeMenu();closeNav();render();window.scrollTo(0,0)}

const dialog=document.getElementById('dialog'),menu=document.getElementById('menu');
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3500)}
function openDialog(title,sub,body,drawer=false){if(!dialog.open)lastFocus=document.activeElement;dialog.classList.remove('drawer');dialog.classList.toggle('detail-dialog',drawer);document.getElementById('dialogBody').innerHTML=`<div class="dialog-head"><div><h2 id="dialogTitle">${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div><button class="icon-btn" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div>${body}`;closeMenu();if(!dialog.open)dialog.showModal();dialog.scrollTop=0;setTimeout(()=>{const target=dialog.querySelector('input:not([type=checkbox]),textarea,select,button');target?.focus()},20)}
function closeDialog(){if(dialog.open)dialog.close();if(lastFocus?.isConnected)lastFocus.focus()}
function closeMenu(){menu.hidden=true}
function openMenu(anchor,items){menu.innerHTML=items.map(i=>i==='hr'?'<hr>':`<button data-action="${i.action}" ${i.data||''} class="${i.danger?'danger':''}">${i.icon?icon(i.icon):''}${esc(i.label)}</button>`).join('');menu.hidden=false;const r=anchor.getBoundingClientRect(),m=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(innerWidth-m.width-8,r.right-m.width))+'px';menu.style.top=Math.max(8,Math.min(innerHeight-m.height-8,r.bottom+7))+'px';menu.querySelector('button')?.focus()}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('navScrim').hidden=true}
function openNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('navScrim').hidden=false;document.querySelector('.nav-link.active')?.focus()}

function editRecord(c,id=null,prefill={}){if(!canCollection(c,'write')){denyAccess();return}const cfg=COLLECTIONS[c];if(!cfg)return;const r=id?db[c].find(x=>x.id===id):{...prefill};const fields=Object.entries(cfg.fields).map(([k,spec])=>{const [label,t='text']=spec.split('|');let opts=k==='creator'?db.users.filter(p=>p.role==='Creator').map(p=>p.name):k==='designer'?['Unassigned',...db.staff.filter(p=>p.role==='Designer').map(p=>p.name)]:t.includes(',')?t.split(','):null;if(opts&&r[k]&&!opts.includes(String(r[k])))opts=[String(r[k]),...opts];const required=['name','email','price','cost','stock','creator','starts','ends','due','title','subject','message','notes','body','handle'].includes(k);const val=r[k]??(opts?opts[0]:['price','stock','cost','weight','revisions'].includes(k)?0:'');return field(k,label,val,opts?'text':t,opts,required)}).join('');openDialog((id?'Edit ':'New ')+cfg.singular,id||'Enter the details below.',`<form id="recordForm" data-collection="${c}" data-id="${id||''}"><div class="form-grid">${fields}</div>${c==='products'?'<div class="preview-note" id="profitPreview">Set a sale price and base cost to calculate estimated creator profit.</div>':''}${['campaigns','staff','content','waitlist'].includes(c)?'<p class="preview-note">Review all details before saving.</p>':''}<p class="error-message" id="formError" role="alert"></p><div class="form-actions">${button('Cancel','close-dialog')}<button class="button primary" type="submit">${id?'Save changes':'Create '+cfg.singular}</button></div></form>`);updateProfitPreview()}
function updateProfitPreview(){const form=document.getElementById('recordForm'),el=document.getElementById('profitPreview');if(!el)return;let price=Number(form.elements.price.value),cost=Number(form.elements.cost.value),fee=price*db.settings.fee/100;el.textContent=`Estimated creator profit: ${money(price-cost-fee)} per unit. Platform fee: ${money(fee)} (${db.settings.fee}%). Shipping and tax excluded.`}
function saveRecord(form){if(!canCollection(form.dataset.collection,'write')){denyAccess();return}const c=form.dataset.collection,id=form.dataset.id,cfg=COLLECTIONS[c];const r=id?db[c].find(x=>x.id===id):null;const v=Object.fromEntries(new FormData(form));for(const [k,spec]of Object.entries(cfg.fields)){if(spec.endsWith('|number'))v[k]=Number(v[k]);if(typeof v[k]==='string')v[k]=v[k].trim()}const err=(msg)=>{form.querySelector('#formError').textContent=msg};if(c==='staff'&&r?.role==='Super Admin'&&v.role!=='Super Admin')return err('The platform owner’s role cannot be changed.');if(Object.values(v).some(x=>typeof x==='number'&&(!Number.isFinite(x)||x<0)))return err('Enter a valid non-negative number.');if(v.starts&&v.ends&&v.starts>v.ends)return err('The end date must be after the start date.');if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))return err('Enter a valid email address.');if(v.name!==undefined&&!v.name)return err('Enter a name.');if(c==='users'&&(!/^[a-zA-Z0-9._]{3,30}$/.test(v.handle)||db.users.some(x=>x.id!==id&&x.handle.toLowerCase()===v.handle.toLowerCase())))return err('Use a unique username with 3–30 letters, numbers, dots, or underscores.');if(c==='products'&&!Number.isInteger(v.stock))return err('Stock must be a whole number.');if(c==='products'&&v.price<=0)return err('Sale price must be greater than zero.');if(c==='campaigns'&&v.status==='Scheduled'&&!v.scheduled)return err('Choose a delivery date and time for a scheduled campaign.');if(c==='content'&&!/^#[a-z0-9/-]+$/i.test(v.destination))return err('Use a relative destination such as #commerce/drops.');if(c==='users'&&r.role!==v.role)return err('Account type changes need a migration workflow. Keep the existing account type.');
if(r){const oldName=r.name;Object.assign(r,v);if(c==='users'&&v.name!==oldName){for(const key of ['products','drops','orders','briefs','squads'])for(const row of db[key])if(row.creatorId===id||row.creator===oldName)row.creator=v.name;for(const o of db.orders)if(o.buyerId===id)o.buyer=v.name;for(const po of db.payouts)if(po.creatorId===id)po.name=v.name}}else{const prefix={products:'PR',drops:'DR',briefs:'DS',assets:'AS',packages:'PK',squads:'SQ',challenges:'CH',tickets:'TK',articles:'KB',campaigns:'CM',segments:'SG',waitlist:'WL',content:'CT',usernames:'UN',staff:'ST'}[c]||'MX';const row={id:prefix+'-'+uid().slice(-6).toUpperCase(),name:'',status:'Draft',date:today(),units:0,gmv:0,members:0,fanblazes:0,rank:db.squads.length+1,participants:0,delivered:0,revision:0,art:'tee',...v};if(c==='staff')row.last='Awaiting acceptance';db[c].unshift(row)}if(c==='products'||c==='drops'){const row=r||db[c][0];row.creatorId=person(row.creator)?.id||''}audit((r?'Updated ':'Created ')+cfg.singular,(r||db[c][0]).id,r?'Edited record fields.':'Record created.');closeDialog();render();toast(cfg.singular.replace(/^./,s=>s.toUpperCase())+' saved successfully.')}
function decision(c,id,operation){if(!canCollection(c,'write')){denyAccess();return}const r=db[c].find(x=>x.id===id);if(!r)return;const options=operation==='moderation'?['Dismiss report','Remove reported content','Warn account','Restrict account']:operation==='appeal'?['Approve appeal','Reject appeal']:operation==='refund'?['Approve refund','Reject refund']:null;const title={publish:'Approve product listing','approve-payout':'Approve payout','hold-payout':'Hold payout','settle-payout':'Confirm payout settlement','release-payout':'Release payout hold',revision:'Request design revision','resolve-ticket':'Resolve support ticket',moderation:'Record moderation decision',appeal:'Review account appeal',refund:'Review refund or dispute','send-campaign':'Send campaign','approve-asset':'Approve design asset','approve-referral':'Approve referral reward',archive:'Archive record'}[operation]||'Record decision';openDialog(title,r.id+' · '+r.name,`<form id="decisionForm" data-collection="${c}" data-id="${id}" data-operation="${operation}">${options?field('outcome','Decision',options[0],'text',options,true):''}${field('reason','Reason for this decision','','textarea',null,true)}<div class="preview-note">Your decision and reason will be recorded in the audit log.</div><p id="formError" class="error-message" role="alert"></p><div class="form-actions">${button('Cancel','close-dialog')}<button class="button primary" type="submit">Confirm decision</button></div></form>`)}
function applyDecision(form){if(!canCollection(form.dataset.collection,'write')){denyAccess();return}const {collection:c,id,operation:op}=form.dataset,r=db[c].find(x=>x.id===id),f=Object.fromEntries(new FormData(form));if(!f.reason?.trim()){form.querySelector('#formError').textContent='Add a reason before continuing.';return}if(['approve-payout','settle-payout','release-payout'].includes(op)&&r.kyc!=='Verified'){form.querySelector('#formError').textContent='Identity verification is required before releasing a payout.';return}const statusMap={publish:'Published','approve-payout':'Approved','hold-payout':'On hold','settle-payout':'Paid','release-payout':'Pending',revision:'In progress','resolve-ticket':'Resolved','send-campaign':'Sent','approve-asset':'Approved','approve-referral':'Approved',archive:'Archived'};if(statusMap[op])r.status=statusMap[op];if(op==='revision'){r.revision=(r.revision||0)+1;r.notes+='\nRevision requested: '+f.reason}if(op==='moderation'){r.status=f.outcome==='Dismiss report'?'Dismissed':'Resolved';r.decision=f.outcome+': '+f.reason;const match=r.entity.match(/(?:PR|MX)-\d+/)?.[0];if(f.outcome==='Remove reported content'){const p=db.products.find(p=>p.id===match);if(p)p.status='Archived'}if(f.outcome==='Restrict account'){const u=db.users.find(u=>u.id===match);if(u)u.status='Suspended'}}if(op==='appeal'){r.status=f.outcome==='Approve appeal'?'Approved':'Rejected';r.decision=f.outcome+': '+f.reason;const u=db.users.find(x=>r.entity.includes(x.id));if(u&&r.status==='Approved')u.status='Active'}if(op==='refund'){r.status=f.outcome==='Approve refund'?'Approved':'Rejected';r.decision=f.reason}if(op==='send-campaign')r.delivered=db.segments.find(s=>s.name===r.audience)?.members||0;audit(COLLECTIONS[c].singular+' decision: '+(f.outcome||r.status),r.id,f.reason);closeDialog();render();toast('Decision saved and audit log updated.')}

function csvDownload(name,rows){if(!rows.length){toast('There are no records to export.');return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['avatar','art','creatorId','buyerId','productId'].includes(k));const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+[keys.map(safe).join(','),...rows.map(r=>keys.map(k=>safe(r[k])).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('CSV export downloaded.')}

function operationalStats(range=30){const end=new Date('2026-09-21T00:00:00Z'),start=new Date(end-range*86400000);const orders=db.orders.filter(o=>new Date(o.date)>=start&&new Date(o.date)<end),paid=orders.filter(o=>o.payment==='Paid');const gmv=paid.reduce((s,o)=>s+o.amount-o.shipping,0),revenue=gmv*db.settings.fee/100;return {orders:orders.length,gmv,revenue,aov:paid.length?Math.round(gmv/paid.length):0,creators:new Set(paid.map(o=>o.creatorId)).size}}

const analyticsLayout=analytics;
analytics=function(){const st=operationalStats(Number(chartRange)),k=chartRange==='7'?.24:chartRange==='90'?2.65:1;return analyticsLayout().split(short(84700000*k)).join(short(st.gmv)).split(short(9620000*k)).join(short(st.revenue)).replace(Math.round(12482*k).toLocaleString(),st.orders.toLocaleString()).replace('₦6,786',money(st.aov)).replace('+17% vs prior period','Paid order value').replace('+12.7% vs prior period','Platform fees').replace('+9.3% vs prior period','In selected period').replace('81.4K',db.users.filter(u=>u.role==='Fan'&&u.status==='Active').length.toLocaleString())};
chart=function(){const days=Number(chartRange),end=new Date('2026-09-20T12:00:00Z'),bucket=Math.max(1,Math.ceil(days/7));const gmv=[],rev=[],labels=[];for(let i=0;i<7;i++){const last=new Date(end-(6-i)*bucket*86400000),first=new Date(last-(bucket-1)*86400000);const sum=db.orders.filter(o=>o.payment==='Paid'&&o.date>=first.toISOString().slice(0,10)&&o.date<=last.toISOString().slice(0,10)).reduce((s,o)=>s+o.amount-o.shipping,0);gmv.push(sum);rev.push(sum*db.settings.fee/100);labels.push(last.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}const max=Math.max(100000,Math.ceil(Math.max(...gmv)/100000)*100000),scale=v=>v/max*6;return `<div class="chart-wrap"><svg class="large-chart" viewBox="0 0 660 230" role="img" aria-label="GMV and platform revenue in naira"><g font-family="Arial" font-size="10" fill="#9aa5b6">${[0,2,4,6].map(v=>`<text x="0" y="${181-v*26}">${max*v/6>=1e6?(max*v/6/1e6).toFixed(1)+'M':Math.round(max*v/6/1000)+'K'}</text><line x1="40" x2="647" y1="${177-v*26}" y2="${177-v*26}" stroke="#f3f3f7"/>`).join('')}</g><g transform="translate(39,8)"><path d="${linePath(gmv.map(scale),600,180,12)}" fill="none" stroke="#5c49f0" stroke-width="2.3"/><path d="${linePath(rev.map(scale),600,180,12)}" fill="none" stroke="#bde900" stroke-width="2.3"/>${gmv.map((v,i)=>`<circle tabindex="0" cx="${12+i*96}" cy="${168-scale(v)*26}" r="4" fill="#5c49f0" stroke="white" stroke-width="2"><title>${labels[i]}: GMV ${money(v)}, revenue ${money(rev[i])}</title></circle>`).join('')}</g><g font-family="Arial" font-size="10" fill="#9aa5b6">${labels.map((l,i)=>`<text text-anchor="middle" x="${51+i*96}" y="216">${l}</text>`).join('')}</g></svg></div>`};
function balanceFor(id){const rows=db.payouts.filter(p=>p.creatorId===id);return {available:rows.filter(p=>p.status==='Pending').reduce((s,p)=>s+p.amount,0),queued:rows.filter(p=>p.status==='Approved').reduce((s,p)=>s+p.amount,0),held:rows.filter(p=>p.status==='On hold').reduce((s,p)=>s+p.amount,0),pending:db.orders.filter(o=>o.creatorId===id&&o.payment==='Paid'&&o.status!=='Delivered').reduce((s,o)=>s+Math.round((o.amount-o.shipping)*.35),0)}}
balances=function(){return `<div class="profile-content"><div class="preview-note">Cleared earnings are available for withdrawal. Approved payouts are reserved for settlement. Pending and held earnings are shown separately.</div><div class="grid two">${db.users.filter(u=>u.role==='Creator'&&db.payouts.some(p=>p.creatorId===u.id)).map(p=>{const b=balanceFor(p.id),method=db.payouts.find(po=>po.creatorId===p.id)?.bank;return `<div class="info-box"><div class="row">${avatar(p)}<h3>${esc(p.name)}</h3></div>${kv('Withdrawable',money(b.available))}${kv('Reserved for payout',money(b.queued))}${kv('Pending settlement',money(b.pending))}${kv('On hold',money(b.held))}${kv('Payout method',esc(method))}<a class="button small" href="#users/${p.id}">View creator</a></div>`}).join('')}</div></div>`};

function rankProgress(p){const index=Math.max(0,RANKS.findLastIndex(r=>p.xp>=r[1])),current=RANKS[index],next=RANKS[index+1];return next?{next:next[0],target:next[1],remaining:next[1]-p.xp,percent:Math.round((p.xp-current[1])/(next[1]-current[1])*100)}:{next:null,target:current[1],remaining:0,percent:100}}

const pendingFileDrafts={};let chatFileProject=null;

function designerHome(){const projects=myProjects(),active=projects.filter(p=>p.status!=='Completed'),revisions=projects.filter(p=>p.status==='Revision requested'),review=projects.filter(p=>p.status==='Awaiting review'),complete=projects.filter(p=>p.status==='Completed');return intro('Good morning, '+session.name.split(' ')[0]+'.','A little focus. A lot of good work. Here’s what’s on your desk.',`<a href="#designer-inbox" class="button primary">${icon('mail')} Open messages</a>`)+`<div class="stack"><div class="designer-welcome"><div><span class="eyebrow">YOUR CREATIVE WORKSPACE</span><h2>Ideas in motion.</h2><p>You have ${active.length} active projects and ${revisions.length} requests for revisions.<br>Let’s make something your creators will love.</p><a href="#designer-projects" class="button lime small">View my projects ${icon('arrow')}</a></div><div class="welcome-art">${art('tee','')}${art('hoodie','')}</div></div>${metrics([['Active projects',active.length,'Across your creator clients','lavender'],['Awaiting review',review.length,'Submitted to the client','blue'],['Revisions requested',revisions.length,'Ready for your next pass','peach'],['Completed',complete.length,'Approved and delivered','gray']])}<section><div class="section-title between"><div><h3>Pick up where you left off</h3><p class="subline">Your current projects, ordered by priority.</p></div><a class="text-btn" href="#designer-projects">View all projects ${icon('arrow')}</a></div><div class="designer-cards">${[...active].sort((a,b)=>(b.priority==='High')-(a.priority==='High')).slice(0,3).map(myProjectCard).join('')}</div></section><div class="grid two">${panel('Unread conversations','A few things your clients want you to know',projects.filter(p=>p.unread).map(p=>`<a class="list-item" href="#designer-inbox/${p.id}">${avatar(person(p.client))}<div><b>${esc(p.client)}</b><small class="line-clamp">${esc(p.messages.at(-1).text)}</small></div><span class="unread-count">${p.unread}</span></a>`).join('')||empty('All caught up','You have no unread conversations.'),'<a class="text-btn" href="#designer-inbox">Open inbox</a>')}${panel('Recent work','Your latest deliveries and approvals',projects.filter(p=>p.versions.length).slice(0,4).map(p=>`<a class="list-item" href="#designer-inbox/${p.id}"><span class="activity-dot">${icon(p.status==='Completed'?'check':'pen')}</span><div><b>${esc(p.name)}</b><small>Version ${p.versions.at(-1).number} · ${dateLabel(p.versions.at(-1).date)}</small></div>${projectStatus(p.status)}</a>`).join(''),'<a class="text-btn" href="#designer-history">View history</a>')}</div></div>`}
function designerProjects(history=false){const all=myProjects().filter(p=>history?p.status==='Completed':true);let filtered=all.filter(p=>[p.name,p.client,p.id].join(' ').toLowerCase().includes(designerQuery.toLowerCase())&&(history||designerFilter==='All projects'||p.status===designerFilter));return intro(history?'Work history':'My projects',history?'A record of completed projects, accepted deliveries, and the work behind them.':'Every brief, conversation, and delivery in one place.',history?button(icon('download')+' Export history','designer-export'):'')+`<div class="stack">${history?metrics([['Completed projects',all.length,'Approved by clients','lavender'],['Creators supported',new Set(all.map(p=>p.clientId)).size,'Creative partnerships','blue'],['Deliveries',all.reduce((s,p)=>s+p.versions.length,0),'Versioned submissions','peach'],['Files delivered',all.reduce((s,p)=>s+p.versions.reduce((n,v)=>n+v.files.length,0),0),'Artwork and source files','gray']]):''}<div class="designer-toolbar"><label class="search-field">${icon('search')}<input id="designerSearch" value="${esc(designerQuery)}" placeholder="Search projects or clients…" aria-label="Search projects"></label>${!history?`<div class="project-filters">${['All projects','In progress','Revision requested','Awaiting review','Completed'].map(s=>`<button type="button" class="${designerFilter===s?'active':''}" data-action="project-filter" data-status="${s}">${s}</button>`).join('')}</div>`:''}</div><div id="designerProjectResults">${history?historyTable(filtered):`<div class="designer-cards">${filtered.map(myProjectCard).join('')}</div>`}${!filtered.length?empty('No projects found','Try another search or status filter.'):''}</div></div>`}

function conversationList(){const projects=myProjects().filter(p=>[p.name,p.client].join(' ').toLowerCase().includes(inboxQuery.toLowerCase()));return projects.map(p=>`<button class="conversation-item ${route.projectId===p.id?'active':''}" data-action="conversation" data-id="${p.id}">${avatar(person(p.client))}<span class="conversation-copy"><span class="between"><b>${esc(p.client)}</b><small>${p.unread?'9:18 AM':dateLabel(p.messages.at(-1).time)}</small></span><span class="conversation-project">${esc(p.name)}</span><span class="conversation-last">${esc(p.messages.at(-1).text)}</span></span>${p.unread?`<span class="unread-count">${p.unread}</span>`:''}</button>`).join('')||empty('No conversations','Try a different client name.')}
function fileSize(n){return n>=1024*1024?(n/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

function inbox(){let p=route.projectId?ownedProject(route.projectId):myProjects()[0];if(route.projectId&&!p)return intro('Project unavailable','You can only open projects assigned to you.')+button('Back to my projects','workspace-home','primary');if(!p)return empty('No conversations yet','Assigned projects will appear here.');const selected=!!route.projectId;return `<div class="inbox-shell ${selected?'has-conversation':''}"><aside class="conversation-sidebar"><div class="conversation-sidebar-head"><div class="between"><h2>Inbox</h2><span class="pill">${myProjects().length}</span></div><label class="search-field">${icon('search')}<input id="inboxSearch" placeholder="Find a client or project" aria-label="Search conversations" value="${esc(inboxQuery)}"></label></div><div id="conversationList" class="conversation-list">${conversationList()}</div></aside><section class="conversation-main"><header class="conversation-header"><button class="icon-btn inbox-back" data-action="conversation-back" aria-label="Back to conversations">${icon('back')}</button>${avatar(person(p.client))}<div class="conversation-heading"><h3>${esc(p.client)}</h3><p>${esc(p.name)}</p></div><button class="icon-btn" data-action="project-info" data-id="${p.id}" aria-label="Project information">${icon('more')}</button></header><div class="conversation-projectbar"><span>${projectStatus(p.status)} <span class="chat-due">Due ${dateLabel(p.due)}</span></span>${p.status!=='Completed'?button(icon('box')+' Submit delivery','submit-delivery','primary small',`data-id="${p.id}"`):'<span class="approved-label">'+icon('check')+' Approved & completed</span>'}</div><div class="tabs chat-tabs" role="tablist" aria-label="Project conversation sections">${[['messages','Conversation'],['brief','Project brief'],['deliveries','Deliveries'],['history','History']].map(([k,l])=>`<button role="tab" class="tab ${conversationTab===k?'active':''}" aria-selected="${conversationTab===k}" data-action="conversation-tab" data-tab="${k}" let attachmentDB;
function openAttachmentDB(){if(attachmentDB)return attachmentDB;attachmentDB=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('File storage is unavailable in this browser.'));return}const request=indexedDB.open('merchrix-studio-files',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return attachmentDB}

function fulfillmentSummary(){const statuses=['Pending','Production','Ready for pickup','Shipped','Delivered','Exception','Cancelled'];const colors=['#b6afd9','#a194f1','#d1e47e','#5f86de','#42b497','#edab64','#e1838b'];return `<div class="fulfillment-total"><strong>${db.orders.length}</strong><span>orders tracked<br><small>Current order ledger</small></span><span class="badge green">${db.orders.length?Math.round(db.orders.filter(o=>o.status==='Delivered').length/db.orders.length*100):0}% delivered</span></div><div class="segmented-bar">${statuses.map((s,i)=>`<span title="${s}" style="width:${db.orders.filter(o=>o.status===s).length/Math.max(1,db.orders.length)*100}%;background:${colors[i]}"></span>`).join('')}</div><div class="fulfillment-breakdown">${statuses.map((s,i)=>{const n=db.orders.filter(o=>o.status===s).length;return `<div><span><i class="legend-dot" style="background:${colors[i]}"></i>${s}</span><b>${n}</b><div class="track"><i style="width:${n/Math.max(1,db.orders.length)*100}%;background:${colors[i]}"></i></div></div>`}).join('')}</div><a class="text-btn" href="#orders/exceptions">Resolve ${db.orders.filter(o=>o.status==='Exception').length} exceptions ${icon('arrow')}</a>`}
function communityHealth(){const creators=db.users.filter(u=>u.role==='Creator'),fans=db.users.filter(u=>u.role==='Fan'),pending=creators.filter(u=>u.status==='Pending'),verified=creators.filter(u=>u.verified==='Verified');return `<div class="health-highlight"><span>${icon('users')}</span><div><strong>${creators.length+fans.length}</strong><p>People in your ecosystem</p></div></div><div class="health-grid">${[['Verified creators',verified.length,creators.length,'users'],['Active fans',fans.filter(f=>f.status==='Active').length,fans.length,'users'],['Active squads',db.squads.filter(s=>s.status==='Active').length,db.squads.length,'community']].map(([n,v,total,path])=>`<a href="#${path}" class="health-cell"><span>${n} ${icon('arrow')}</span><b>${v}<small> / ${total}</small></b><div class="track"><i style="width:${v/Math.max(1,total)*100}%"></i></div></a>`).join('')}</div><a href="#users/applications" class="health-action"><span class="avatar small">${icon('shield')}</span><div><b>${pending.length} applications waiting</b><p>Review identity and linked accounts</p></div>${icon('arrow')}</a>`}
const previousAnalytics=analytics;
analytics=function(){const box=document.createElement('div');box.innerHTML=previousAnalytics();for(const h of box.querySelectorAll('h3')){if(h.textContent==='Fulfillment performance'){h.closest('section').querySelector('.panel-body').innerHTML=fulfillmentSummary();h.nextElementSibling.textContent='Production through delivery · order distribution'}if(h.textContent==='Creator & community health'){h.closest('section').querySelector('.panel-body').innerHTML=communityHealth();h.nextElementSibling.textContent='Participation, verification, and the next action'}}return box.innerHTML};
function modelCards(){return `<div class="grid two model-summary">${['Merchrix managed','Creator stocked'].map((m,i)=>{const rows=db.orders.filter(o=>o.model===m),active=rows.filter(o=>!['Cancelled','Delivered'].includes(o.status)),exceptions=rows.filter(o=>o.status==='Exception');return `<article class="panel model-card ${i?'stocked':'managed'}"><div class="between"><span class="model-icon">${icon(i?'bag':'box')}</span><span class="eyebrow">${i?'CREATOR OPERATIONS':'END-TO-END FULFILLMENT'}</span></div><h3>${m}</h3><p>${i?'Creator packed. DHL delivered.':'Produced, quality checked, and shipped by Merchrix.'}</p><div class="model-stats"><div><strong>${active.length}</strong><span>In progress</span></div><div><strong>${rows.filter(o=>o.status==='Delivered').length}</strong><span>Delivered</span></div><div><strong>${exceptions.length}</strong><span>Exceptions</span></div></div><div class="model-footer"><span>${rows.length} total orders</span><span>${i?'Packing → Pickup → Delivery':'Production → QC → Delivery'}</span></div></article>`}).join('')}</div>`}
function studioRequests(){return `<div class="studio-heading"><div><h3>Production queue</h3><p class="subline">All briefs, owners, priorities, and deadlines in one view.</p></div><span class="pill">${icon('pen')}${db.briefs.length} requests</span></div>${advancedTable('briefs',db.briefs,{sort:'due',create:true})}`}
function squadName(id){return db.squads.find(s=>s.id===id)?.name||id}
let clashView='Live';
function clashCard(c){return `<button class="clash-card ${c.status==='Live'?'live':''}" data-action="clash-detail" data-id="${c.id}"><div class="between"><span class="badge ${c.status==='Live'?'lime':'purple'}">${c.status==='Live'?'● LIVE':esc(c.status)}</span><span>${esc(c.id)}</span></div><h3>${esc(c.name)}</h3><div class="clash-rivals"><div><span class="squad-monogram">${esc(squadName(c.home).slice(0,2).toUpperCase())}</span><b>${esc(squadName(c.home))}</b>${c.status!=='Upcoming'?`<strong>${Number(c.homeScore).toLocaleString()}</strong>`:''}</div><span>VS</span><div><span class="squad-monogram alt">${esc(squadName(c.away).slice(0,2).toUpperCase())}</span><b>${esc(squadName(c.away))}</b>${c.status!=='Upcoming'?`<strong>${Number(c.awayScore).toLocaleString()}</strong>`:''}</div></div><div class="clash-card-footer">${icon('calendar')} ${esc(c.starts.replace('T',' · '))} UTC ${icon('arrow')}</div></button>`}
function clashesView(){const rows=db.clashes.filter(c=>clashView==='Archived'?['Completed','Cancelled'].includes(c.status):c.status===clashView);return `<div class="studio-heading"><div><h3>Rival squads. Shared energy.</h3><p class="subline">Schedule the next clash and keep every result in view.</p></div>${button(icon('plus')+' Schedule clash','schedule-clash','primary')}</div><div class="clash-tabs">${['Live','Upcoming','Archived'].map(s=>`<button class="${s===clashView?'selected':''}" data-action="clash-view" data-view="${s}">${s} <span>${db.clashes.filter(c=>s==='Archived'?['Completed','Cancelled'].includes(c.status):c.status===s).length}</span></button>`).join('')}</div><div class="clash-grid">${rows.slice(0,3).map(clashCard).join('')||empty('No '+clashView.toLowerCase()+' clashes',clashView==='Upcoming'?'Schedule a clash between two active squads.':'Clashes will appear here as their status changes.')}</div>${advancedTable('clashes',rows.map(c=>({...c,rivals:squadName(c.home)+' vs '+squadName(c.away)})),{sort:'starts',dir:clashView==='Archived'?'desc':'asc',cell:(c,k)=>k==='name'?`<button class="cell-link" data-action="clash-detail" data-id="${c.id}"><b>${esc(c.name)}</b><small class="cell-sub">${c.id}</small></button>`:k==='status'?badge(c.status):esc(String(c[k]||'').replace('T',' ')),actions:false})}`}
function communityPage(){return intro('Squads & Squad Clash','The conversations, people, and moments that bring creator communities together.')+`<div class="stack">${metrics([['Squads',db.squads.length,'Creator communities','lavender'],['Memberships',db.squads.reduce((n,s)=>n+s.members,0).toLocaleString(),'Across all squads'],['Live clashes',db.clashes.filter(c=>c.status==='Live').length,'In progress','peach'],['Upcoming',db.clashes.filter(c=>c.status==='Upcoming').length,'Scheduled rival matchups']])}<section class="panel">${tabs('community',route.tab)}${route.tab==='clash'?clashesView():table('squads',db.squads)}</section></div>`}
const previousCollectionPage=collectionPage;
collectionPage=function(page){if(page==='community')return communityPage();if(page==='support')return intercomPage();if(page==='studio'&&route.tab==='requests')return intro('Design Studio','A clear view of every brief, deadline, and delivery.')+`<div class="stack">${metrics(['New','In progress','In review','Delivered'].map((s,i)=>[s,db.briefs.filter(b=>b.status===s).length,['Ready to assign','With the design team','Awaiting feedback','Files approved'][i],['lavender','blue','peach','green'][i]]))}<section class="panel">${tabs('studio','requests')}${studioRequests()}</section></div>`;if(page==='crm'&&route.tab==='templates')return intro('Campaign templates','Image-led layouts, ready to personalize.')+`<section class="panel">${tabs('crm','templates')}${campaignTemplates()}</section>`;let html=previousCollectionPage(page);if(page==='orders'){const old=fulfillmentGuide();html=html.replace(old,'');html=html.replace('<div class="stack">','<div class="stack">'+modelCards())}return html};
function intercomPage(){return intro('Customer Support','Your customer conversations live in Intercom.')+`<section class="panel intercom-card"><span class="intercom-mark">${icon('support')}</span><h2>Every conversation, in one place.</h2><p>Open the Intercom inbox to reply to customers, manage assignments, and follow up on conversations.</p><a class="button primary" href="${INTERCOM_URL}" target="_blank" rel="noopener noreferrer">Open Intercom ${icon('external')}</a></section>`}
subadminOverview=function(){return intro('Welcome back, '+session.name.split(' ')[0]+'.','Your people, catalog, and fulfillment priorities.')+`<div class="stack">${metrics([['Creator applications',db.users.filter(u=>u.status==='Pending').length,'Awaiting identity review','lavender'],['Fulfillment exceptions',db.orders.filter(o=>o.status==='Exception').length,'Ready for follow-up','peach'],['Design reviews',db.briefs.filter(b=>b.status==='In review').length,'Awaiting feedback','blue'],['Catalog approvals',db.products.filter(p=>p.status==='In review').length,'Listings to review']])}<div class="grid two">${panel('Orders to follow up','Orders with fulfillment exceptions',miniOrders(db.orders.filter(o=>o.status==='Exception')))}${panel('Team activity','Latest operational decisions',richActivity(db.audit.filter(a=>!/[Pp]ayout|[Pp]ermission/.test(a.name)).slice(0,5)))}</div><div class="grid two">${panel('Design requests','Nearest deadlines',studioRequests())}${panel('Customer conversations','Managed in Intercom',`<p class="subline">Open your shared inbox to reply, assign, and resolve customer conversations.</p><a href="${INTERCOM_URL}" target="_blank" rel="noopener noreferrer" class="button primary" style="margin-top:24px">Open Intercom ${icon('external')}</a>`)}</div></div>`};
const previousSettings=settings;
settings=function(){return `<div class="panel empty-control"><label class="switch-row"><div><b>Preview empty states</b><p>Temporarily hide platform data to inspect empty dashboards, cards, and tables. Turn off to restore every record.</p></div><input id="emptyPreviewToggle" role="switch" aria-label="Preview empty states" type="checkbox" ${emptyPreview?'checked':''}></label></div>`+previousSettings()};
function emptyWorkspace(){const page=route.page,title=currentNav().find(n=>n[0]===page)?.[1]||'Workspace';const c={users:route.tab==='usernames'?'usernames':'users',commerce:route.tab==='drops'?'drops':'products',orders:'orders',finance:['payouts','transactions','refunds'].includes(route.tab)?route.tab:'payouts',studio:route.tab==='assets'?'assets':route.tab==='packages'?'packages':'briefs',crm:['segments','referrals','waitlist'].includes(route.tab)?route.tab:'campaigns',community:route.tab==='clash'?'clashes':'squads',content:'content',moderation:route.tab==='appeals'?'appeals':'reports',security:route.tab==='audit'?'audit':'staff','designer-history':'designHistory'}[page];return intro(title,'A clear place for your next activity.')+`<div class="stack">${metrics([['Total records','0','Nothing here yet','lavender'],['Active','0','Awaiting activity'],['Needs attention','0','You’re all caught up'],['Completed','0','No completed activity']])}${c?`<section class="panel">${PAGE_TABS[page]?.length?tabs(page,route.tab):''}${advancedTable(c,[],{actions:false})}</section>`:`<div class="grid two">${panel('Activity','',empty('No activity yet','Updates will appear when work begins.'))}${panel('At a glance','',empty('Nothing to report yet','Metrics will appear as your workspace grows.'))}</div>`}</div>`}
const previousRender=render;
render=function(){grids.clear();gridSequence=0;if(session&&emptyPreview&&route.page!=='settings'&&route.page!=='support'&&canPage(route.page)){refreshShell();document.getElementById('pageTitle').textContent=currentNav().find(n=>n[0]===route.page)?.[1]||'Workspace';document.getElementById('main').classList.remove('inbox-main');document.getElementById('main').innerHTML=emptyWorkspace();document.title=document.getElementById('pageTitle').textContent+' — Merchrix'}else previousRender();if(!session)return;document.querySelectorAll('a[href^="#support"]').forEach(a=>{a.href=INTERCOM_URL;a.target='_blank';a.rel='noopener noreferrer';if(a.classList.contains('attention-item'))a.innerHTML=`<span class="color-icon" style="background:#252431">${icon('support')}</span><div><b>Customer conversations</b><small>Open the Intercom inbox</small></div>${icon('external')}`});document.querySelectorAll('a[data-page="support"]').forEach(a=>a.innerHTML=icon('support')+'<span>Customer Support</span>'+icon('external'));document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.page===route.page));document.getElementById('emptyPreviewBanner')?.remove();if(emptyPreview)document.getElementById('main').insertAdjacentHTML('afterbegin',`<div id="emptyPreviewBanner" class="preview-banner"><span>${icon('layout')} Empty-state preview is on. Your records are preserved.</span><button class="button small" data-action="end-empty-preview">Restore data</button></div>`)};
searchResults=function(q){q=q.trim().toLowerCase();let results=currentNav().filter(n=>n[0]!=='support'&&n[1].toLowerCase().includes(q)).map(n=>({name:n[1],type:'Workspace page',path:n[0],visual:`<span class="search-entity-icon">${icon(n[2])}</span>`}));if(q&&!emptyPreview){if(session.role==='designer'){for(const p of myProjects())if([p.name,p.client,p.id].join(' ').toLowerCase().includes(q))results.push({name:p.name,type:p.client+' · '+p.id,path:'designer-inbox/'+p.id,visual:projectThumb(p)})}else for(const c of ['users','products','orders','drops','squads','briefs','campaigns'])if(canCollection(c))for(const r of db[c])if([r.name,r.id,r.handle,r.buyer,r.creator].join(' ').toLowerCase().includes(q))results.push({name:r.name,type:COLLECTIONS[c].singular+' · '+r.id,c,id:r.id,visual:c==='users'?avatar(r):['products','orders','briefs'].includes(c)?art(r.art||db.products.find(p=>p.id===r.productId)?.art):`<span class="search-entity-icon">${icon(c==='squads'?'users':c==='campaigns'?'mail':'bag')}</span>`})}document.getElementById('searchResults').innerHTML=results.length?results.slice(0,40).map(r=>`<button class="search-result" data-action="search-result" data-path="${r.path||''}" data-collection="${r.c||''}" data-id="${r.id||''}"><span class="row">${r.visual}<span><b>${esc(r.name)}</b><small class="cell-sub">${esc(r.type)}</small></span></span>${icon('arrow')}</button>`).join(''):empty('No results found','Try a name, reference, or section title.')};
rolesView=function(){return `<div class="profile-content"><p class="subline">Set permissions by responsibility. Super Admin access is locked.</p><form id="permissionsForm"><div class="permission-grid">${Object.entries(PERMISSIONS).map(([r,vals])=>`<fieldset class="info-box"><legend>${r}</legend>${(db.permissions[r]||vals).map((v,i)=>`<label class="permission-choice"><span>${['Users','Orders','Finance','Moderation','Studio','Settings'][i]}</span><input type="checkbox" name="${r}|${i}" aria-label="${r}: ${['Users','Orders','Finance','Moderation','Studio','Settings'][i]}" ${v?'checked':''} ${r==='Super Admin'?'disabled':''}></label>`).join('')}</fieldset>`).join('')}</div><div class="form-actions">${button('Save permissions','save-permissions','primary')}</div></form></div>`};
function bankingPanel(p){const b=p?.banking;if(!b)return empty('No bank account on file','Bank details will appear after the creator submits them.');return `<section class="info-box banking-panel"><div class="between"><h3>${icon('wallet')} Banking details</h3><span class="pill">${esc(b.currency)}</span></div><dl class="bank-grid">${[['Account holder',b.accountName],['Bank',b.bank],['Account number',b.accountNumber],['Routing number',b.routingNumber],['Sort code',b.sortCode],['SWIFT / BIC',b.swift],['Account type',b.accountType],['Branch',b.branch],['Country',b.country]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`}
function documentImage(p,d){const identity=d.type==='Photo identification';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><rect width="760" height="430" rx="24" fill="${identity?'#eceaf8':'#f5f4ef'}"/><rect x="28" y="28" width="704" height="374" rx="18" fill="white"/><text x="56" y="72" font-family="Arial" font-size="17" fill="#6652d8">MERCHRIX • VERIFICATION FILE</text><text x="56" y="118" font-family="Arial" font-size="27" font-weight="bold" fill="#252431">${esc(d.name)}</text>${identity?`<rect x="56" y="152" width="140" height="156" rx="12" fill="#e8e3f5"/><circle cx="126" cy="198" r="28" fill="#afa2d8"/><path d="M76 286a50 50 0 0 1 100 0" fill="#afa2d8"/>`:'<path d="M60 174h620M60 204h620M60 234h620M60 264h620" stroke="#e5e4df" stroke-width="12"/>'}<text x="${identity?222:56}" y="${identity?186:310}" font-family="Arial" font-size="23" fill="#252431">${esc(p.name)}</text><text x="${identity?222:56}" y="${identity?221:342}" font-family="Arial" font-size="16" fill="#717184">${esc(p.region||'Lagos, Nigeria')}</text>${identity?`<text x="222" y="254" font-family="Arial" font-size="15" fill="#717184">Account reference: ${esc(p.id)}</text><text x="222" y="286" font-family="Arial" font-size="15" fill="#717184">Submitted ${esc(d.submitted)}</text>`:''}<text x="56" y="378" font-family="Arial" font-size="13" letter-spacing="2" fill="#aaa5bb">SPECIMEN • NOT AN IDENTITY CREDENTIAL</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function verificationBody(p){return `<div class="review-profile">${avatar(p,'hero')}<div><h2>${esc(p.name)}</h2><p>@${esc(p.handle)} · ${esc(p.category)}</p><p>${esc(p.email)} · ${esc(p.region)}</p></div>${badge(p.verified)}</div><div class="review-section"><div class="between"><h3>Submitted documents</h3><span class="muted small-text">${p.documents?.length||0} files</span></div><div class="document-grid">${(p.documents||[]).map(d=>`<button class="document-card" data-action="verification-document" data-id="${p.id}" data-doc="${d.id}"><img src="${esc(documentImage(p,d))}" alt="${esc(d.name)} preview"><span class="between"><b>${esc(d.name)}</b>${icon('external')}</span><small>${esc(d.type)} · ${esc(d.submitted)}</small>${badge(d.status)}</button>`).join('')}</div></div><div class="review-section"><h3>Linked social & platform accounts</h3><div class="social-grid">${(p.socials||[]).map((s,i)=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="social-account"><span class="social-mark social-${s.platform.toLowerCase()}">${s.platform==='YouTube'?'▶':s.platform==='Spotify'?'≋':s.platform==='Instagram'?'◎':'♪'}</span><div><b>${esc(s.platform)}</b><small>${esc(s.handle)}</small></div>${icon('external')}</a>`).join('')}</div></div>${bankingPanel(p)}<div class="review-section"><h3>Payout history</h3><p class="subline">All requests and settlement outcomes for this creator.</p>${advancedTable('payouts',db.payouts.filter(r=>r.creatorId===p.id||r.name===p.name),{cols:['id','date','amount','bank','status'],sort:'date',dir:'desc',actions:false})}</div>`}
reviewCreator=function(id){const p=db.users.find(u=>u.id===id);if(!p||!canCollection('users'))return;openDialog('Creator application review','Verify the submitted identity, linked accounts, and payout details.',verificationBody(p)+`<form id="creatorReviewForm" data-id="${id}" class="review-decision"><h3>Record your decision</h3><div class="form-grid">${field('outcome','Decision','Approve application','text',['Approve application','Reject application'],true)}${field('reason','Review notes','','textarea',null,true)}</div><label class="row small-text"><input type="checkbox" name="reviewed" required> I have reviewed the submitted documents, linked accounts, and banking details.</label><div class="form-actions">${button('Cancel','close-dialog')}<button type="submit" class="button primary">Save review</button></div></form>`,true)};
function squadDetail(id){const s=db.squads.find(s=>s.id===id);if(!s)return;const posts=db.squadPosts.filter(p=>p.squadId===id),last=db.clashes.filter(c=>c.status==='Completed'&&[c.home,c.away].includes(id)).sort((a,b)=>b.ends.localeCompare(a.ends))[0];openDialog(s.name,'Squad community · '+s.creator,`<div class="squad-detail-hero"><span class="squad-monogram">${esc(s.name.slice(0,2).toUpperCase())}</span><div><h2>${esc(s.name)}</h2><p>${Number(s.members).toLocaleString()} members · ${esc(s.creator)}</p></div>${badge(s.status)}</div><div class="squad-detail-grid"><section><h3>Squad activity feed</h3><div class="squad-posts">${posts.map(p=>`<article class="squad-post"><div class="row">${avatar({name:p.author,avatar:p.avatar},'small')}<div><b>${esc(p.author)}</b><time>${new Date(p.date).toLocaleString('en-GB',{timeZone:'UTC',dateStyle:'medium',timeStyle:'short'})} UTC</time></div></div><p>${esc(p.text)}</p>${p.image?`<img src="${esc(p.image)}" class="post-media" alt="Squad collection preview">`:''}<div class="post-engagement"><span>♡ ${p.likes} likes</span><span>${icon('mail')} ${p.comments} comments</span></div></article>`).join('')||empty('No posts yet','Squad posts will appear here.')}</div></section><aside><h3>Last squad clash</h3>${last?clashCard(last):empty('No completed clashes','Results will appear after the squad’s first clash.')}<div class="info-box" style="margin-top:16px"><h3>Community details</h3>${kv('Creator',esc(s.creator))}${kv('Members',Number(s.members).toLocaleString())}${kv('Status',badge(s.status))}</div></aside></div><div class="review-section"><h3>Member list</h3><p class="subline">Loaded member directory · ${Number(s.members).toLocaleString()} total memberships</p>${advancedTable('squadMembers',db.squadMembers.filter(p=>p.squadId===id),{cell:(p,k)=>k==='name'?`<a class="row" href="#users/${p.userId}" data-close-dialog="true">${avatar(p,'small')}<b>${esc(p.name)}</b></a>`:k==='status'?badge(p.status):esc(p[k]),actions:false})}</div>`,true)}
function scheduleClash(id){const c=db.clashes.find(c=>c.id===id)||{},squads=db.squads.filter(s=>s.status==='Active');openDialog(id?'Edit scheduled clash':'Schedule a Squad Clash','Choose rival squads and a clear event window. All times are UTC.',`<form id="clashForm" data-id="${c.id||''}"><div class="form-grid">${field('name','Clash title',c.name||'','text',null,true)}<label class="field"><span>Home squad *</span><select name="home" required>${squads.map(s=>`<option value="${s.id}" ${s.id===c.home?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field"><span>Rival squad *</span><select name="away" required><option value="">Choose a rival</option>${squads.map(s=>`<option value="${s.id}" ${s.id===c.away?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>${field('starts','Starts (UTC)',c.starts||'','datetime-local',null,true)}${field('ends','Ends (UTC)',c.ends||'','datetime-local',null,true)}${field('description','Event description',c.description||'','textarea',null,true)}</div><p id="clashError" class="error-message" role="alert"></p><div class="form-actions">${button('Cancel','close-dialog')}<button type="submit" class="button primary">${id?'Save schedule':'Schedule clash'}</button></div></form>`)}

function sanitizeEmail(html){const root=document.createElement('div');root.innerHTML=html;const tags=new Set(['DIV','P','BR','H1','H2','H3','H4','SPAN','B','STRONG','EM','I','U','A','IMG','TABLE','TBODY','THEAD','TR','TD','TH','UL','OL','LI','HR','BLOCKQUOTE']);for(const el of [...root.querySelectorAll('*')]){if(!tags.has(el.tagName)){el.remove();continue}for(const a of [...el.attributes]){const n=a.name.toLowerCase();if(!['href','src','alt','style','width','height','align','cellpadding','cellspacing','border','colspan','rowspan'].includes(n))el.removeAttribute(a.name);else if(n==='href'){const value=safeDestination(a.value,'External website');value?el.setAttribute(n,value):el.removeAttribute(n)}else if(n==='src'){const value=safeImage(a.value);value?el.setAttribute(n,value):el.removeAttribute(n)}else if(n==='style'&&/url\s*\(|expression|@import|behavior|position\s*:\s*fixed/i.test(a.value))el.removeAttribute(n)}}return root.innerHTML}

submit.disabled=true;submit.textContent=form.id==='chatForm'?'Sending…':'Uploading…';
try{const time=new Date().toISOString();if(form.id==='chatForm'){const files=pendingChatFiles.length?await storeAttachments(pendingChatFiles):[];p.messages.push({id:'M-'+uid(),by:'designer',text:data.message.trim(),files,time});db.chatDrafts??={};delete db.chatDrafts[p.id];pendingChatFiles=[];persist();renderDesigner()}
else{const files=await storeAttachments(pendingDeliveryFiles),v={id:p.id+'-V'+(p.versions.length+1),number:p.versions.length+1,date:time,note:data.note.trim(),status:'Awaiting review',files};p.versions.push(v);p.status='Awaiting review';p.messages.push({id:'M-'+uid(),by:'designer',text:'I’ve submitted version '+v.number+' for your review.',deliveryId:v.id,time});p.activity.push({title:'Delivery '+v.number+' submitted',detail:files.length+' files · '+data.note.trim(),time});pendingDeliveryFiles=[];audit('Submitted design delivery',p.id,'Version '+v.number);closeDialog();conversationTab='deliveries';if(route.page==='designer-inbox')renderDesigner();else render();toast('Version '+v.number+' submitted for review.')}}catch(err){error.textContent='Your files could not be saved. Check available storage and try again.'}finally{if(submit.isConnected){submit.disabled=false;submit.innerHTML=original}}
},true);
document.addEventListener('input',e=>{if(e.target.id==='designerSearch'){designerQuery=e.target.value;const focus=e.target,caret=focus.selectionStart;const temp=document.createElement('div');temp.innerHTML=designerProjects(route.page==='designer-history');document.getElementById('designerProjectResults').innerHTML=temp.querySelector('#designerProjectResults').innerHTML;}if(e.target.id==='inboxSearch'){inboxQuery=e.target.value;document.getElementById('conversationList').innerHTML=conversationList()}if(e.target.id==='chatMessage'){const id=e.target.closest('form').dataset.id;db.chatDrafts??={};db.chatDrafts[id]=e.target.value;persist()}},true);
document.addEventListener('change',e=>{if(e.target.id==='chatAttachments'){queueFiles('chat',e.target.files);e.target.value=''}if(e.target.id==='deliveryAttachments'){queueFiles('delivery',e.target.files);e.target.value=''}},true);
document.addEventListener('dragover',e=>{const zone=e.target.closest('#deliveryDropZone');if(zone){e.preventDefault();zone.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{e.target.closest('#deliveryDropZone')?.classList.remove('dragover')});
document.addEventListener('drop',e=>{const zone=e.target.closest('#deliveryDropZone');if(zone){e.preventDefault();zone.classList.remove('dragover');queueFiles('delivery',e.dataTransfer.files)}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatMessage'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();e.target.closest('form').requestSubmit()}},true);
</script>
</body></html>
